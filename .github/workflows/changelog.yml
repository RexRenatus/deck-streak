name: changelog

# A pull request adds a fragment under changelog.d/, or it is the release pull request that
# compiles them into CHANGELOG.md. Its job, `fragment`, is a required check on main.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes
# (SPEC-190). Any other event has a group of its own, its run id, so it is never cancelled.
concurrency:
  group: changelog-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fragment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a fragment is added, or CHANGELOG.md is compiled
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD -- CHANGELOG.md | grep -q .; then exit 0; fi
          if git diff --name-only --diff-filter=A "$BASE" HEAD -- changelog.d/ | grep -v README.md | grep -q .; then exit 0; fi
          echo "Add a fragment under changelog.d/ (see changelog.d/README.md)."
          exit 1
