name: changelog

# A pull request adds a fragment under changelog.d/, or it is the release pull request that
# compiles them into CHANGELOG.md, or it is a Dependabot pull request that changes only the files
# the ecosystems of .github/dependabot.yml update (SPEC-190 R13). Its job, `fragment`, is a
# required check on dev and main.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes
# (SPEC-190). Any other event has a group of its own, its run id, so it is never cancelled.
concurrency:
  group: changelog-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fragment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a fragment is added, or CHANGELOG.md is compiled
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if git diff --name-only "$BASE" HEAD -- CHANGELOG.md | grep -q .; then exit 0; fi
          if git diff --name-only --diff-filter=A "$BASE" HEAD -- changelog.d/ | grep -v README.md | grep -q .; then exit 0; fi
          # SPEC-604 R8: a batch the merge queue opens from its own branch reads the dependency-file rule below.
          queue="mergify/merge-queue/"
          if [ "$AUTHOR" = "mergify[bot]" ] && [ "${GITHUB_HEAD_REF:0:${#queue}}" = "$queue" ]; then
            AUTHOR="dependabot[bot]"
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            cargo="Cargo\.lock|Cargo\.toml|crates/[^/]+/Cargo\.toml"
            npm="package\.json|web/app/package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml"
            actions="\.github/workflows/[^/]+\.ya?ml"
            changed="$(git diff --name-only --no-renames "$BASE" HEAD)"
            other="$(printf "%s\n" "$changed" | grep -v -x -E "$cargo|$npm|$actions" || true)"
            if [ -n "$changed" ] && [ -z "$other" ]; then
              echo "A Dependabot pull request that changes only dependency files needs no fragment."
              exit 0
            fi
          fi
          echo "Add a fragment under changelog.d/ (see changelog.d/README.md)."
          exit 1
