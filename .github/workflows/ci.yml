name: ci

# The local gate (scripts/check.sh) on GitHub-hosted runners, on every pull request into dev or
# main and every push to them (ADR-017). The gate runs in four parallel jobs, each calling check.sh
# with its own stages, every stage in exactly one job (ADR-055). The packs are judged on the
# maintainer's box, never here (ADR-069). No secret is used, the token is
# read-only, every action is pinned by its full commit SHA, and every job runs on a GitHub-hosted
# runner. A cache is saved only by a push to dev or main that missed its key; a pull request, a
# fork's included, restores and never saves.
# The required `ci` check is always the pull request's own run: the aggregate job reports as `ci` for
# a pull request and as `ci (push)` for a push to dev or main.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes.
# A push to dev or main has a group of its own, its run id, so it is never cancelled, and never
# replaced while it waits (GitHub keeps one pending run per group and cancels the older).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A fresh checkout rebuilds the workspace anyway; incremental state would only fill the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest,cargo-deny
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: the locked dependency graph, every target's packages (the censuses read it offline)
        run: cargo fetch --locked --manifest-path Cargo.toml
      - name: fmt, clippy (-D warnings), test (nextest), doctest and audit-rust (cargo deny)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh fmt clippy test doctest audit-rust
      - name: keep only the dependencies' artifacts in the cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo clean --workspace
      - name: save the Rust cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs-rust
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # The engine set (SPEC-038 R13, R14): SPEC-022's sync and budget tests, which drive Anki's engine
  # end to end and set the gate's floor, run here beside rust, which runs every other test. It
  # restores the Rust cache and saves none: rust alone saves it, because two jobs saving one key race.
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every slice runs to its end, so one run names every red slice, as check.sh names every red.
      fail-fast: false
      matrix:
        # The engine set in two slices, one per runner (R16): nextest deals its tests out in turn.
        slice: [1, 2]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: test-engine, one slice of the engine set (SPEC-022's sync and budget tests)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
          ENGINE_SLICE: ${{ matrix.slice }}/${{ strategy.job-total }}
        run: bash scripts/check.sh test-engine
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs-engine-${{ matrix.slice }}
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # The workspace's tests in the profile the daemon ships from (SPEC-330, ADR-330, #473): the
  # tests run with debug assertions on and the shipped build runs with them off, so code the build
  # selects is proved here in the build it ships in. It restores the Rust cache and saves none: rust
  # alone saves it, because two jobs saving one key race. The release build lands under
  # target/release, which the cache does not hold, so this job compiles its own.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: the locked dependency graph, every target's packages (the censuses read it offline)
        run: cargo fetch --locked --manifest-path Cargo.toml
      - name: test-release, the workspace's tests in the release profile
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh test-release
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs-release
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the pnpm store's path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: restore the pnpm store, keyed on pnpm-lock.yaml
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: the Playwright version pnpm-lock.yaml locks
        id: playwright-version
        run: |
          mapfile -t versions < <(sed -n 's/^  playwright-core@\([0-9][0-9A-Za-z.+-]*\):.*$/\1/p' pnpm-lock.yaml | sort -u)
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "pnpm-lock.yaml locks ${#versions[@]} Playwright versions; the browser cache's key needs exactly one"
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"
      - name: restore Playwright's Chromium headless shell, keyed on that version
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell
      - name: install Playwright's Chromium headless shell on a miss
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --dir web/app exec playwright install chromium --only-shell
      - name: save Playwright's browser
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: web (pnpm check with svelte-check --fail-on-warnings, vitest, vite build, playwright) and audit-web (pnpm audit)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh web audit-web
      - name: save the pnpm store
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs-web
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  card-sandbox:
    # SPEC-341 R12: the planted card suite in Chromium and WebKit. Each planted card reaches its
    # listener from the reference frame and nothing from the shipped card frame, and each layer
    # removed alone opens exactly the channels the schematic gives it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: Chromium's headless shell and WebKit, with their system libraries
        run: pnpm --dir web/app exec playwright install --with-deps --only-shell chromium webkit
      - name: the planted cards, in Chromium and WebKit
        run: pnpm --dir web/app test:card
      - name: upload the planted suite's results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: card-sandbox-results
          path: web/app/test-results/
          if-no-files-found: warn
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # secrets scans every commit, and scrub reads every blob reachable from HEAD.
          fetch-depth: 0
          persist-credentials: false
      # A guard test builds the ingest crate twice (SPEC-055 A2): the pinned toolchain, and the
      # rust job's cache, restored only.
      # Only the rust job, which builds every target, saves it.
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # SPEC-055 A3 runs cargo deny from the python stage: every advisory exception and allowed
      # git source in deny.toml must still be live in the graph.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: gitleaks 8.30.1, checksum verified
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: python, scrub and secrets (the guard tests, among them cargo builds and a cargo deny audit; the public deny-list; gitleaks)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
          CHECK_HISTORY: "1"
        run: bash scripts/check.sh python scrub secrets
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs-hygiene
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # Mutation testing on the diff (SPEC-039 R3 and R18, ADR-057): a plan, one job per shard of the
  # diff's Rust mutants, the hand-proved rows, and a verdict read from the tools' own reports, where
  # a class that applies and examined nothing is VOID. A release pull request into main is judged on
  # its merge diff like any other. Every job but two runs on every event and says by name why it has
  # nothing to do, because `ci` fails on a skipped need. The two are `mutation-rust`, which is not
  # started when the plan's shards list no mutant, and `mutation-rows`, which is not started when
  # the plan selects no row and no retirement check is due; `ci` admits a skip from those two and
  # from nowhere else, and `mutation-verdict` judges each against the plan. Each job that runs
  # restores caches and saves none.
  #
  # The plan: the event's case, the diff, and, when Rust changed, the shards. cargo-mutants lists
  # the diff's mutants (building nothing) and the plan takes the fewest round-robin shards whose
  # slowest is projected within three hours, half a shard's timeout, a progression mutant and its
  # shard's baseline each charged the settle census's 1521 s (SPEC-327). The shards never pass the
  # run's ceiling, 256 jobs less every other job the run can start: a diff that needs more is
  # refused whole, never capped, and every plan prints its legs against that ceiling (SPEC-362).
  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      case: ${{ steps.plan.outputs.case }}
      scope: ${{ steps.plan.outputs.scope }}
      rust: ${{ steps.plan.outputs.rust }}
      rows: ${{ steps.plan.outputs.rows }}
      shards: ${{ steps.shards.outputs.shards }}
      matrix: ${{ steps.shards.outputs.matrix }}
      python_shards: ${{ steps.shards.outputs.python_shards }}
      python_matrix: ${{ steps.shards.outputs.python_matrix }}
      listed: ${{ steps.shards.outputs.listed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge ref and its first parent, the base's tip: the diff is HEAD^1...HEAD.
          fetch-depth: 2
          persist-credentials: false
      - name: the plan (the event's case, the diff's classes, its changed lines, its rows)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: python3 scripts/mutation-verdict.py plan --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/mutation" --event "$EVENT" --base-ref "$BASE_REF" --subject "$SUBJECT"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: rustup show
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: ${{ steps.plan.outputs.rust == 'true' }}
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      # cargo-mutants reads .cargo/mutants.toml, whose test tool is nextest; the listing runs no
      # test and builds nothing, but it carries the same tool and bounds as every other command.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: ${{ steps.plan.outputs.rust == 'true' }}
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: the diff's mutants, as cargo-mutants itself lists them
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: cargo mutants --no-shuffle --list --json --in-diff "$RUNNER_TEMP/mutation/git.diff" --timeout 2300 --build-timeout 600 > "$RUNNER_TEMP/mutation/listed.json"
      # Every equivalence record is bound against the whole tree's mutants, not the diff's alone, so
      # a change that moves or rewrites a recorded mutant's code is judged wherever it lands
      # (SPEC-057 R8). Like the diff's, this listing builds nothing.
      - name: the whole tree's mutants, which every record is bound against
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: cargo mutants --no-shuffle --list --json --timeout 2300 --build-timeout 600 > "$RUNNER_TEMP/mutation/whole.json"
      # The repository's own Python (SPEC-087, ADR-073): the runner lists the diff's mutants and the
      # whole population's, running no test, and the plan sizes the Python matrix from the first.
      - name: the diff's Python mutants, as the runner itself lists them
        run: python3 scripts/mutation_python.py list --plan "$RUNNER_TEMP/mutation/plan.json" --out "$RUNNER_TEMP/mutation/python-listed.json"
      - name: the whole Python population's mutants, which every Python record is bound against
        run: python3 scripts/mutation_python.py list --all --out "$RUNNER_TEMP/mutation/python-whole.json"
      - name: the shards, the fewest whose slowest is projected within its bound
        id: shards
        run: python3 scripts/mutation-verdict.py shards --plan "$RUNNER_TEMP/mutation/plan.json" --listed "$RUNNER_TEMP/mutation/listed.json" --python-listed "$RUNNER_TEMP/mutation/python-listed.json"
      - name: keep the plan, the diff and the listing for every job after it
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation/
          if-no-files-found: warn

  # One job per shard of the plan: cargo-mutants over the same diff, in place, the shard's mutants
  # round-robin as the plan projected them. Its exit is recorded and its report kept; the verdict's
  # job reads them. It is not started when the plan's listing holds no mutant, which the verdict's
  # `legs` check reads from the listing, never from the leg's absence (SPEC-290 R2).
  mutation-rust:
    needs: [mutation-plan]
    if: ${{ needs.mutation-plan.outputs.listed != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: this shard's case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          echo "mutation-rust: shard $SHARD of $SHARDS: $CASE"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: cargo-mutants, one shard of the diff, in place (its exit is recorded; the verdict reads its report)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          out="$RUNNER_TEMP/shards/mutation-rust-shard-$SHARD"
          mkdir -p "$out"
          rc=0
          python3 scripts/memory_scope.py --report "$out" -- cargo mutants --no-shuffle -vV --in-place --in-diff "$RUNNER_TEMP/mutation/git.diff" --sharding round-robin --shard "$SHARD/$SHARDS" --timeout 2300 --build-timeout 600 --output "$out" || rc=$?
          echo "$rc" > "$out/cargo-mutants.exit"
          echo "cargo-mutants exited $rc"
      - name: keep the shard's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rust-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: warn

  # One job per shard of the plan's Python matrix: the runner over the diff's Python mutants, each
  # shard's mutants round-robin as the plan sized them, stopping a file at its first survivor. It
  # runs on every event and names its case, is never skipped, and restores no cache and saves none.
  # Its report is kept whatever the run returned; the verdict's job reads them.
  mutation-python:
    needs: [mutation-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: this shard's case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          echo "mutation-python: shard $SHARD of $SHARDS: $CASE"
      - name: the runner, one shard of the diff's Python mutants (its exit is recorded; the verdict reads its report)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          out="$RUNNER_TEMP/python-shards/mutation-python-shard-$SHARD"
          mkdir -p "$out"
          rc=0
          python3 scripts/mutation_python.py run --plan "$RUNNER_TEMP/mutation/plan.json" --shard "$SHARD/$SHARDS" --failfast --report "$out/report.json" || rc=$?
          echo "mutation-python exited $rc"
      - name: keep the shard's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-python-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-shards/
          if-no-files-found: warn

  # The hand-proved rows the diff selects, and the retirement check: no row leaves while its target
  # stays, unless the maintainer approved it. It is not started only when the plan selects no row
  # and no retirement check is due, which is a push that merges a pull request (SPEC-290 R3).
  mutation-rows:
    needs: [mutation-plan]
    if: ${{ needs.mutation-plan.outputs.rows == 'true' || needs.mutation-plan.outputs.scope == 'diff' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The retirement check compares the rows at HEAD^1, the base's tip, with HEAD's.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: the rows' case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          ROWS: ${{ needs.mutation-plan.outputs.rows }}
        run: |
          echo "mutation-rows: rows selected $ROWS: $CASE"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: fetch the locked dependency graph, so the offline census finds every package
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        run: cargo fetch --locked
      - name: the rows the diff selects (the verdict reads their report)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/rows"
          rc=0
          python3 scripts/mutation_rows.py prove --rows-from "$RUNNER_TEMP/mutation/plan.json" --report "$RUNNER_TEMP/rows/rows.json" || rc=$?
          echo "the rows runner exited $rc"
      - name: no row leaves while its target stays, unless the maintainer approved it
        if: ${{ needs.mutation-plan.outputs.scope == 'diff' }}
        run: rc=0; python3 scripts/mutation_rows.py retired --base HEAD^1 || rc=1; python3 scripts/swift_mutants.py retired --base HEAD^1 || rc=1; exit "$rc"
      - name: keep the rows' report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-rows
          path: ${{ runner.temp }}/rows/
          if-no-files-found: warn

  # The verdict, whatever the shards returned: every shard the plan promised, from 0 to n-1, is
  # counted, one missing or partial is VOID by name, and the shards' reports must hold every listed
  # mutant once; then the rows, for the Rust class and the oracle's.
  mutation-verdict:
    needs: [mutation-plan, mutation-rust, mutation-python, mutation-rows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each report by name, never by one pattern over all of them: the action extracts into `path`
      # itself when a download is by name, merged, or matches one artifact, and into a directory per
      # artifact only for two or more, so `mutation-*` laid the plan out by how many jobs had
      # uploaded (SPEC-126, #351). `mutation-web` is not read and is not waited for.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/reports/mutation-plan
      # The rows' job makes its report directory only when the plan selected rows, and a download
      # by name of an artifact that was never uploaded fails the step.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        with:
          name: mutation-rows
          path: ${{ runner.temp }}/reports/mutation-rows
      # Each shard's artifact holds its own `mutation-rust-shard-<i>/` directory, so merging puts
      # one shard and many at the same paths; no shard at all matches nothing and is not an error.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-rust-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-python-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - name: the verdict, from every shard's report and the rows' (the plan names a not-applicable case)
        env:
          RUST_LEG: ${{ needs.mutation-rust.result }}
          ROWS_LEG: ${{ needs.mutation-rows.result }}
        run: |
          reports="$RUNNER_TEMP/reports"
          status=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class rust --shard-reports "$reports" --rows "$reports/mutation-rows/rows.json" --whole "$reports/mutation-plan/whole.json" || status=$?
          oracle=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class oracle --python "$reports" --rows "$reports/mutation-rows/rows.json" --python-whole "$reports/mutation-plan/python-whole.json" || oracle=$?
          if [ "$status" -eq 0 ]; then status=$oracle; fi
          scripts=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class scripts --python "$reports" --rows "$reports/mutation-rows/rows.json" --python-whole "$reports/mutation-plan/python-whole.json" || scripts=$?
          if [ "$status" -eq 0 ]; then status=$scripts; fi
          legs=0
          python3 scripts/mutation-verdict.py legs --plan "$reports/mutation-plan/plan.json" --rust-leg "$RUST_LEG" --rows-leg "$ROWS_LEG" || legs=$?
          if [ "$status" -eq 0 ]; then status=$legs; fi
          exit "$status"

  # StrykerJS over every web production file the diff changes, whole, so a survivor already on a
  # touched file is the pull request's own (SPEC-039 R3, ADR-057 D3). It restores the pnpm store
  # and saves none.
  mutation-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: the plan (the event's case, the diff's classes, the web files it changes)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: python3 scripts/mutation-verdict.py plan --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/mutation" --event "$EVENT" --base-ref "$BASE_REF" --subject "$SUBJECT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.plan.outputs.web == 'true' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ steps.plan.outputs.web == 'true' }}
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the pnpm store's path
        id: pnpm-store
        if: ${{ steps.plan.outputs.web == 'true' }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: restore the pnpm store, keyed on pnpm-lock.yaml
        if: ${{ steps.plan.outputs.web == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: the Mini App's dependencies, and the sources it generates
        if: ${{ steps.plan.outputs.web == 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web/app exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --emit-ts-declarations --silent
          pnpm --dir web/app exec svelte-kit sync
      - name: StrykerJS over each changed file, whole (the verdict reads its report)
        if: ${{ steps.plan.outputs.web == 'true' }}
        working-directory: web/app
        env:
          MUTATE: ${{ steps.plan.outputs.mutate }}
        run: |
          rc=0
          pnpm exec stryker run --mutate "$MUTATE" || rc=$?
          cp -r reports/mutation "$RUNNER_TEMP/mutation/stryker" || true
          echo "StrykerJS exited $rc"
      - name: the verdict, from Stryker's own report (the plan names a not-applicable case)
        run: python3 scripts/mutation-verdict.py judge --plan "$RUNNER_TEMP/mutation/plan.json" --class web --stryker "$RUNNER_TEMP/mutation/stryker/mutation.json"
      - name: keep the plan and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-web
          path: ${{ runner.temp }}/mutation/
          if-no-files-found: warn

  # The web engine (SPEC-338 R8, R9; ADR-349): Anki's engine built for wasm32 with its bindings,
  # held to ADR-336's budget of 8000000 bytes gzip -9, then the browser tests over that module in
  # Chromium and WebKit. The build's only wasm32 settings are on scripts/web-engine-build.sh's
  # command line: no .cargo/config.toml and no RUSTFLAGS (ADR-348). It restores the Rust cache for
  # the registry and saves none.
  web-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml) and its wasm32 target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: wasm-bindgen 0.2.129 (the crate's exact version) and wasm-opt from binaryen 133, checksums verified
        env:
          WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL -o /tmp/wasm-bindgen.tgz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo "$WASM_BINDGEN_SHA256  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          curl -fsSL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "$BINARYEN_SHA256  /tmp/binaryen.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/wasm"
          tar -xzf /tmp/wasm-bindgen.tgz -C "$HOME/.local/wasm" --strip-components=1 wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          tar -xzf /tmp/binaryen.tgz -C "$HOME/.local/wasm"
          echo "$HOME/.local/wasm" >> "$GITHUB_PATH"
          echo "$HOME/.local/wasm/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: a C compiler and archiver for wasm32 (SQLite's source)
        run: |
          command -v llvm-ar-18 || sudo apt-get install -y --no-install-recommends llvm-18
          clang-18 --version
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: build the module and its bindings
        run: bash scripts/web-engine-build.sh --cc clang-18 --ar llvm-ar-18 --out target/web-engine
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the size gate (8000000 bytes gzip -9, brotli beside it)
        run: python3 scripts/web-engine-size.py --module target/web-engine/deck_streak_web_engine_bg.wasm --bindings target/web-engine/deck_streak_web_engine.js
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: Chromium's headless shell and WebKit, with their system libraries
        run: pnpm --dir web/app exec playwright install --with-deps --only-shell chromium webkit
      - name: the browser tests over the module (Chromium and WebKit, persistent profiles)
        run: pnpm --dir web/app test:engine
      - name: the Mini App's build, which the study suite serves
        run: pnpm --dir web/app build
      - name: the module and its bindings staged beside the build, under /engine/
        run: bash scripts/web-engine-stage.sh
      - name: the study suite over the staged build (Chromium and WebKit, persistent profiles)
        run: pnpm --dir web/app test:study

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zizmor
      - name: zizmor audits the workflows themselves
        run: zizmor --no-online-audits --persona regular .github/workflows

  base-is-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: a pull request into main comes from this repository's dev
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; then
              echo "base-is-dev: a pull request into main must come from $REPO's dev (it comes from '$HEAD_REPO:$HEAD'). Open it against dev: gh pr create --base dev"
              exit 1
            fi
          fi
          echo "base-is-dev: ok ($EVENT into '${BASE:-push}')"

  ci:
    name: ${{ github.event_name == 'pull_request' && 'ci' || 'ci (push)' }}
    if: ${{ always() }}
    needs: [rust, engine, release, web, card-sandbox, hygiene, mutation-plan, mutation-rust, mutation-python, mutation-rows, mutation-verdict, mutation-web, web-engine, workflow-lint, base-is-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job reads as passing to a required check, so a skip is admitted from the two legs
      # the plan's listing can give nothing and from nowhere else, once for each leg whose own
      # result is `skipped`; `mutation-verdict`, which must succeed, judged each against the listing
      # (SPEC-290 R8).
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUST_LEG: ${{ needs.mutation-rust.result }}
          ROWS_LEG: ${{ needs.mutation-rows.result }}
        run: |
          admitted=0
          for leg in "mutation-rust:$RUST_LEG" "mutation-rows:$ROWS_LEG"; do
            if [ "${leg#*:}" = skipped ]; then
              echo "ci: ${leg%%:*} was not started; mutation-verdict judged it against the plan's listing"
              admitted=$((admitted + 1))
            fi
          done
          for result in $RESULTS; do
            if [ "$result" = skipped ] && [ "$admitted" -gt 0 ]; then
              admitted=$((admitted - 1))
              continue
            fi
            test "$result" = success || exit 1
          done
