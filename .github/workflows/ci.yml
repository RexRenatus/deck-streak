name: ci

# The local gate (scripts/check.sh) on GitHub-hosted runners, on every pull request into dev or
# main and every push to them (ADR-017). The gate runs in four parallel jobs, each calling check.sh
# with its own stages, every stage in exactly one job (ADR-055). The packs are judged on the
# maintainer's box, never here (ADR-069). No secret is used, the token is
# read-only, every action is pinned by its full commit SHA, and every job runs on a GitHub-hosted
# runner. A cache is saved only by a push to dev or main that missed its key; a pull request, a
# fork's included, restores and never saves.
# The required `ci` check is always the pull request's own run: the aggregate job reports as `ci` for
# a pull request and as `ci (push)` for a push to dev or main.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes.
# A push to dev or main has a group of its own, its run id, so it is never cancelled, and never
# replaced while it waits (GitHub keeps one pending run per group and cancels the older).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A fresh checkout rebuilds the workspace anyway; incremental state would only fill the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest,cargo-deny
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: the locked dependency graph, every target's packages (the censuses read it offline)
        run: cargo fetch --locked --manifest-path Cargo.toml
      - name: fmt, clippy (-D warnings), test (nextest), doctest and audit-rust (cargo deny)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh fmt clippy test doctest audit-rust
      - name: keep only the dependencies' artifacts in the cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.rust-cache.outputs.cache-hit != 'true' }}
        run: cargo clean --workspace
      - name: save the Rust cache
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-rust
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # The engine set (SPEC-038 R13, R14): SPEC-022's sync and budget tests, which drive Anki's engine
  # end to end and set the gate's floor, run here beside rust, which runs every other test. It
  # restores the Rust cache and saves none: rust alone saves it, because two jobs saving one key race.
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every slice runs to its end, so one run names every red slice, as check.sh names every red.
      fail-fast: false
      matrix:
        # The engine set in two slices, one per runner (R16): nextest deals its tests out in turn.
        slice: [1, 2]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: test-engine, one slice of the engine set (SPEC-022's sync and budget tests)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
          ENGINE_SLICE: ${{ matrix.slice }}/${{ strategy.job-total }}
        run: bash scripts/check.sh test-engine
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-engine-${{ matrix.slice }}
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # The workspace's tests in the profile the daemon ships from (SPEC-330, ADR-330, #473): the
  # tests run with debug assertions on and the shipped build runs with them off, so code the build
  # selects is proved here in the build it ships in. It restores the Rust cache and saves none: rust
  # alone saves it, because two jobs saving one key race. The release build lands under
  # target/release, which the cache does not hold, so this job compiles its own.
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: the locked dependency graph, every target's packages (the censuses read it offline)
        run: cargo fetch --locked --manifest-path Cargo.toml
      - name: test-release, the workspace's tests in the release profile
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh test-release
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-release
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the pnpm store's path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: restore the pnpm store, keyed on pnpm-lock.yaml
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: the Playwright version pnpm-lock.yaml locks
        id: playwright-version
        run: |
          mapfile -t versions < <(sed -n 's/^  playwright-core@\([0-9][0-9A-Za-z.+-]*\):.*$/\1/p' pnpm-lock.yaml | sort -u)
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "pnpm-lock.yaml locks ${#versions[@]} Playwright versions; the browser cache's key needs exactly one"
            exit 1
          fi
          echo "version=${versions[0]}" >> "$GITHUB_OUTPUT"
      - name: restore Playwright's Chromium headless shell, keyed on that version
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell
      - name: install Playwright's Chromium headless shell on a miss
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --dir web/app exec playwright install chromium --only-shell
      - name: save Playwright's browser
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: web (pnpm check with svelte-check --fail-on-warnings, vitest, vite build, playwright) and audit-web (pnpm audit)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh web audit-web
      - name: save the pnpm store
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-web
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  card-sandbox:
    # SPEC-341 R12 and SPEC-398: the planted card suite in Chromium, WebKit and Firefox. Each
    # planted card reaches its listener from the reference frame and nothing from the shipped card
    # frame, and each layer removed alone opens exactly the channels the schematic gives it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: Firefox, with its system libraries
        run: pnpm --dir web/app exec playwright install --with-deps firefox
      - name: Chromium's headless shell and WebKit, with their system libraries
        run: pnpm --dir web/app exec playwright install --with-deps --only-shell chromium webkit
      - name: the planted cards, in Chromium, WebKit and Firefox
        run: pnpm --dir web/app test:card
      - name: upload the planted suite's results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-sandbox-results
          path: web/app/test-results/
          if-no-files-found: warn
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # secrets scans every commit, and scrub reads every blob reachable from HEAD.
          fetch-depth: 0
          persist-credentials: false
      # A guard test builds the ingest crate twice (SPEC-055 A2): the pinned toolchain, and the
      # rust job's cache, restored only.
      # Only the rust job, which builds every target, saves it.
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # SPEC-055 A3 runs cargo deny from the python stage: every advisory exception and allowed
      # git source in deny.toml must still be live in the graph.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: gitleaks 8.30.1, checksum verified
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: python, scrub and secrets (the guard tests, among them cargo builds and a cargo deny audit; the public deny-list; gitleaks)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
          CHECK_HISTORY: "1"
        run: bash scripts/check.sh python scrub secrets
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-hygiene
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  # Mutation testing on the diff (SPEC-039 R3 and R18, ADR-057): a plan, one job per shard of the
  # diff's Rust mutants, the hand-proved rows, and a verdict read from the tools' own reports, where
  # a class that applies and examined nothing is VOID. A release pull request into main is judged on
  # its merge diff like any other, and every job reports there as here, but on that one run `ci`
  # reads each mutation job's result as advisory: it prints each one and still judges every other
  # need (SPEC-500). Every job but two runs on every event and says by name why it has nothing to
  # do, because on every other run `ci` fails on a skipped need. The two are `mutation-rust`, which
  # is not started when the plan's shards list no mutant, and `mutation-rows`, which is not started
  # when the plan selects no row and no retirement check is due; `ci` admits a skip from those two,
  # and from `mutation-python-release` (SPEC-422 R11), and from nowhere else, and `mutation-verdict`
  # judges each against the plan. Each job that runs restores caches and saves none.
  #
  # The plan: the event's case, the diff, and, when Rust changed, the shards. cargo-mutants lists
  # the diff's mutants (building nothing) and the plan takes the fewest round-robin shards whose
  # slowest is projected within three hours, half a shard's timeout, a progression mutant and its
  # shard's baseline each charged the settle census's 1521 s (SPEC-327). The shards never pass the
  # run's ceiling, 256 jobs less every other job the run can start: a diff that needs more is
  # refused whole, never capped, and every plan prints its legs against that ceiling (SPEC-362).
  mutation-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The carry's base steps read one earlier run's artifacts, which `actions: read` allows
    # (SPEC-493 R2); the workflow's default stays `contents: read`.
    permissions:
      contents: read
      actions: read
    outputs:
      case: ${{ steps.plan.outputs.case }}
      scope: ${{ steps.plan.outputs.scope }}
      rust: ${{ steps.plan.outputs.rust }}
      rows: ${{ steps.plan.outputs.rows }}
      shards: ${{ steps.shards.outputs.shards }}
      matrix: ${{ steps.shards.outputs.matrix }}
      python_shards: ${{ steps.shards.outputs.python_shards }}
      python_matrix: ${{ steps.shards.outputs.python_matrix }}
      python_release_matrix: ${{ steps.shards.outputs.python_release_matrix }}
      python_release_legs: ${{ steps.shards.outputs.python_release_legs }}
      listed: ${{ steps.shards.outputs.listed }}
      rows_legs: ${{ steps.legs.outputs.rows_legs }}
      rows_matrix: ${{ steps.legs.outputs.rows_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge ref and its first parent, the base's tip: the diff is HEAD^1...HEAD.
          fetch-depth: 2
          persist-credentials: false
      - name: the plan (the event's case, the diff's classes, its changed lines, its rows)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SUBJECT: ${{ github.event.head_commit.message }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/mutation-verdict.py plan --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/mutation" --event "$EVENT" --base-ref "$BASE_REF" --subject "$SUBJECT" --head-ref "$HEAD_REF" --head-repo "$HEAD_REPO" --repo "$REPO"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: rustup show
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ steps.plan.outputs.rust == 'true' }}
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      # cargo-mutants reads .cargo/mutants.toml, whose test tool is nextest; the listing runs no
      # test and builds nothing, but it carries the same tool and bounds as every other command.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ steps.plan.outputs.rust == 'true' }}
        with:
          tool: cargo-nextest@0.9.149
          fallback: none
      - name: the diff's mutants, as cargo-mutants itself lists them
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: cargo mutants --no-shuffle --list --json --in-diff "$RUNNER_TEMP/mutation/git.diff" --timeout 2300 --build-timeout 600 > "$RUNNER_TEMP/mutation/listed.json"
      # Every equivalence record is bound against the whole tree's mutants, not the diff's alone, so
      # a change that moves or rewrites a recorded mutant's code is judged wherever it lands
      # (SPEC-057 R8). Like the diff's, this listing builds nothing.
      - name: the whole tree's mutants, which every record is bound against
        if: ${{ steps.plan.outputs.rust == 'true' }}
        run: cargo mutants --no-shuffle --list --json --timeout 2300 --build-timeout 600 > "$RUNNER_TEMP/mutation/whole.json"
      # The repository's own Python (SPEC-087, ADR-073): the runner lists the diff's mutants and the
      # whole population's, running no test, and the plan sizes the Python matrix from the first.
      - name: the diff's Python mutants, as the runner itself lists them
        run: python3 scripts/mutation_python.py list --plan "$RUNNER_TEMP/mutation/plan.json" --out "$RUNNER_TEMP/mutation/python-listed.json"
      - name: the whole Python population's mutants, which every Python record is bound against
        run: python3 scripts/mutation_python.py list --all --out "$RUNNER_TEMP/mutation/python-whole.json"
      # The release run of a release pull request SPEC-493 admits carries a Python outcome from one
      # recorded release run of this repository, for a file whose whole read set is byte-identical
      # there and here. The base is one run chosen by run id alone, and each base step and download
      # is bounded and continues on error, so a missing base runs every listed mutant (R2, R3).
      - name: the carry's base, one run of this repository chosen by run id alone (SPEC-493 R2)
        id: base
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/mutation_carry.py base --plan "$RUNNER_TEMP/mutation/plan.json" --pull-request "$PULL_REQUEST" --run-id "$RUN_ID" --repository "$REPO" --head-sha "$HEAD_SHA" --out "$RUNNER_TEMP/carry-base" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.base.outputs.base_run != '' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/carry-base/mutation-plan
          run-id: ${{ steps.base.outputs.base_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.base.outputs.base_run != '' && steps.base.outputs.base_manifest == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: mutation-outcomes
          path: ${{ runner.temp }}/carry-base/mutation-outcomes
          run-id: ${{ steps.base.outputs.base_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.base.outputs.base_run != '' && steps.base.outputs.base_manifest != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          pattern: mutation-python-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/carry-base/legs
          run-id: ${{ steps.base.outputs.base_run }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      # On every event: `carry` writes carry.json, then moves each carried file's code lines to
      # carried_code in plan.json, and the runner lists the re-run set from that plan (R9).
      - name: the carry, which writes carry.json and then the legs' view of the plan
        env:
          BASE_RUN: ${{ steps.base.outputs.base_run }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: python3 scripts/mutation-verdict.py carry --plan "$RUNNER_TEMP/mutation/plan.json" --python-listed "$RUNNER_TEMP/mutation/python-listed.json" --base-dir "$RUNNER_TEMP/carry-base" --base-run "$BASE_RUN" --pull-request "$PULL_REQUEST"
      - name: the re-run set, the listing less every carried file's mutants
        run: python3 scripts/mutation_python.py list --plan "$RUNNER_TEMP/mutation/plan.json" --out "$RUNNER_TEMP/mutation/python-rerun.json"
      - name: the shards, the fewest whose slowest is projected within its bound
        id: shards
        run: python3 scripts/mutation-verdict.py shards --plan "$RUNNER_TEMP/mutation/plan.json" --listed "$RUNNER_TEMP/mutation/listed.json" --python-listed "$RUNNER_TEMP/mutation/python-rerun.json"
      # The plan's rows are dealt into the fewest legs whose largest is projected within half of
      # the rows job's 90 minutes, at the measured cost of a row; a count past the most legs is
      # refused whole, by name, and fails this job (SPEC-417, ADR-431). It runs whether or not the
      # plan selects rows: no rows take one leg, which still runs the retirement check.
      - name: the rows legs, the fewest whose largest is projected within its bound
        id: legs
        run: python3 scripts/mutation_rows.py legs --rows-from "$RUNNER_TEMP/mutation/plan.json"
      - name: keep the plan, the diff and the listing for every job after it
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation/
          if-no-files-found: warn

  # One job per shard of the plan: cargo-mutants over the same diff, in place, the shard's mutants
  # round-robin as the plan projected them. Its exit is recorded and its report kept; the verdict's
  # job reads them. It is not started when the plan's listing holds no mutant, which the verdict's
  # `legs` check reads from the listing, never from the leg's absence (SPEC-290 R2).
  mutation-rust:
    needs: [mutation-plan]
    if: ${{ needs.mutation-plan.outputs.listed != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: this shard's case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          echo "mutation-rust: shard $SHARD of $SHARDS: $CASE"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: the locked dependency graph, every target's packages (the census reads it offline at the baseline)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        run: cargo fetch --locked --manifest-path Cargo.toml
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        with:
          tool: cargo-nextest@0.9.149
          fallback: none
      # The leg's own unmutated baseline, inside the memory scope and bounded by SPEC-480 section 9's
      # budget, before cargo-mutants, which then skips its own. Its exit and its log are recorded under
      # `baseline/` for the verdict, and only a green one lets the next step run; the step itself always
      # succeeds, so a red or unbounded baseline reads VOID with its reason in the verdict (ADR-509).
      - name: this leg's unmutated baseline, bounded by its budget (the verdict reads its record)
        id: baseline
        if: ${{ needs.mutation-plan.outputs.rust == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          out="$RUNNER_TEMP/shards/mutation-rust-shard-$SHARD"
          mkdir -p "$out/baseline"
          rc=0
          python3 scripts/memory_scope.py --report "$out/baseline" -- bash scripts/mutation-baseline.sh "$RUNNER_TEMP/mutation/listed.json" "$SHARD" "$SHARDS" "$out/baseline/baseline.log" || rc=$?
          echo "$rc" > "$out/baseline/baseline.exit"
          if [ "$rc" -eq 0 ]; then echo "green=true" >> "$GITHUB_OUTPUT"; fi
      - name: cargo-mutants, one shard of the diff, in place (its exit is recorded; the verdict reads its report)
        if: ${{ needs.mutation-plan.outputs.rust == 'true' && steps.baseline.outputs.green == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          out="$RUNNER_TEMP/shards/mutation-rust-shard-$SHARD"
          mkdir -p "$out"
          rc=0
          python3 scripts/memory_scope.py --report "$out" -- cargo mutants --no-shuffle -vV --in-place --in-diff "$RUNNER_TEMP/mutation/git.diff" --baseline=skip --sharding round-robin --shard "$SHARD/$SHARDS" --timeout 2300 --build-timeout 600 --output "$out" || rc=$?
          echo "$rc" > "$out/cargo-mutants.exit"
          echo "cargo-mutants exited $rc"
      - name: keep the shard's report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-rust-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: warn

  # One job per shard of the plan's Python matrix: the runner over the diff's Python mutants, each
  # shard's mutants round-robin as the plan sized them, stopping a file at its first survivor. It
  # runs on every event and names its case, is never skipped, and restores no cache and saves none.
  # Its report is kept whatever the run returned; the verdict's job reads them.
  mutation-python:
    needs: [mutation-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: this shard's case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          echo "mutation-python: shard $SHARD of $SHARDS: $CASE"
      - name: the runner, one shard of the diff's Python mutants (its exit is recorded; the verdict reads its report)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          out="$RUNNER_TEMP/python-shards/mutation-python-shard-$SHARD"
          mkdir -p "$out"
          rc=0
          python3 scripts/mutation_python.py run --plan "$RUNNER_TEMP/mutation/plan.json" --shard "$SHARD/$SHARDS" --failfast --report "$out/report.json" || rc=$?
          echo "mutation-python exited $rc"
      - name: keep the shard's report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-python-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-shards/
          if-no-files-found: warn

  # The plan's second Python matrix: a matrix generates at most 256 jobs, so the legs a release run
  # deals past the first matrix's PYTHON_MATRIX_LEGS run here, each exactly as a mutation-python leg
  # runs, over the same total, and each keeps its report under the same name for the verdict. It
  # is not started when the plan deals no leg past the first matrix, which is every run but a
  # release run past it; `legs` judges that skip against the plan, and `ci` admits it once
  # (SPEC-422 R9 to R11).
  mutation-python-release:
    needs: [mutation-plan]
    if: ${{ needs.mutation-plan.outputs.python_release_legs != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.python_release_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: this shard's case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          echo "mutation-python: shard $SHARD of $SHARDS: $CASE"
      - name: the runner, one shard of the diff's Python mutants (its exit is recorded; the verdict reads its report)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.mutation-plan.outputs.python_shards }}
        run: |
          out="$RUNNER_TEMP/python-shards/mutation-python-shard-$SHARD"
          mkdir -p "$out"
          rc=0
          python3 scripts/mutation_python.py run --plan "$RUNNER_TEMP/mutation/plan.json" --shard "$SHARD/$SHARDS" --failfast --report "$out/report.json" || rc=$?
          echo "mutation-python exited $rc"
      - name: keep the shard's report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-python-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-shards/
          if-no-files-found: warn

  # The hand-proved rows the diff selects, and the retirement check: no row leaves while its target
  # stays, unless the maintainer approved it. It is not started only when the plan selects no row
  # and no retirement check is due, which is a push that merges a pull request (SPEC-290 R3). The
  # plan deals the rows into legs, one job each, and every leg keeps the 90 minutes: a leg proves
  # the rows its deal gives it and uploads its own report, and leg 0 alone runs the retirement
  # check (SPEC-417, ADR-431).
  mutation-rows:
    needs: [mutation-plan]
    if: ${{ needs.mutation-plan.outputs.rows == 'true' || needs.mutation-plan.outputs.scope == 'diff' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.mutation-plan.outputs.rows_matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The retirement check compares the rows at HEAD^1, the base's tip, with HEAD's.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation
      - name: the rows' case, by name
        env:
          CASE: ${{ needs.mutation-plan.outputs.case }}
          ROWS: ${{ needs.mutation-plan.outputs.rows }}
        run: |
          echo "mutation-rows: rows selected $ROWS: $CASE"
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: fetch the locked dependency graph, so the offline census finds every package
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        run: cargo fetch --locked
      - name: the rows the plan deals this leg (the verdict merges every leg's report)
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        env:
          LEG: ${{ matrix.leg }}
          LEGS: ${{ needs.mutation-plan.outputs.rows_legs }}
        run: |
          mkdir -p "$RUNNER_TEMP/rows"
          rc=0
          python3 scripts/mutation_rows.py prove --rows-from "$RUNNER_TEMP/mutation/plan.json" --leg "$LEG/$LEGS" --report "$RUNNER_TEMP/rows/rows-leg-$LEG.json" || rc=$?
          echo "the rows runner exited $rc"
      - name: no row leaves while its target stays, unless the maintainer approved it
        if: ${{ needs.mutation-plan.outputs.scope == 'diff' && matrix.leg == 0 }}
        run: python3 scripts/mutation_rows.py retired --base HEAD^1
      - name: keep the rows leg's report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-rows-leg-${{ matrix.leg }}
          path: ${{ runner.temp }}/rows/
          if-no-files-found: warn

  # The verdict, whatever the shards returned: every shard the plan promised, from 0 to n-1, is
  # counted, one missing or partial is VOID by name, and the shards' reports must hold every listed
  # mutant once; then the rows, for the Rust class and the oracle's.
  mutation-verdict:
    needs: [mutation-plan, mutation-rust, mutation-python, mutation-python-release, mutation-rows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each report by name, never by one pattern over all of them: the action extracts into `path`
      # itself when a download is by name, merged, or matches one artifact, and into a directory per
      # artifact only for two or more, so `mutation-*` laid the plan out by how many jobs had
      # uploaded (SPEC-126, #351). `mutation-web` is not read and is not waited for.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/reports/mutation-plan
      # Each rows leg uploads its own report, `rows-leg-<k>.json`, under its own artifact, and only
      # when the plan selected rows. One pattern, merged, lays one leg and many at the same paths, and
      # a leg that uploaded nothing is named by the merge below, never by a failed download
      # (SPEC-417 R9).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        with:
          pattern: mutation-rows-leg-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports/mutation-rows
      # Each shard's artifact holds its own `mutation-rust-shard-<i>/` directory, so merging puts
      # one shard and many at the same paths; no shard at all matches nothing and is not an error.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-rust-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-python-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      # The legs' reports become the one rows report the judge reads, in leg order; a row two legs
      # hold, or one its leg's deal did not give it, is refused by name (SPEC-417 R7, R8).
      - name: the rows legs' reports, merged into the one the verdict reads
        if: ${{ needs.mutation-plan.outputs.rows == 'true' }}
        env:
          LEGS: ${{ needs.mutation-plan.outputs.rows_legs }}
        run: python3 scripts/mutation_rows.py merge --rows-from "$RUNNER_TEMP/reports/mutation-plan/plan.json" --legs "$LEGS" --from "$RUNNER_TEMP/reports/mutation-rows" --report "$RUNNER_TEMP/reports/mutation-rows/rows.json"
      - name: the verdict, from every shard's report and the rows' (the plan names a not-applicable case)
        env:
          RUST_LEG: ${{ needs.mutation-rust.result }}
          ROWS_LEG: ${{ needs.mutation-rows.result }}
          PYTHON_RELEASE_LEG: ${{ needs.mutation-python-release.result }}
        run: |
          reports="$RUNNER_TEMP/reports"
          status=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class rust --shard-reports "$reports" --rows "$reports/mutation-rows/rows.json" --whole "$reports/mutation-plan/whole.json" || status=$?
          oracle=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class oracle --python "$reports" --rows "$reports/mutation-rows/rows.json" --python-whole "$reports/mutation-plan/python-whole.json" || oracle=$?
          if [ "$status" -eq 0 ]; then status=$oracle; fi
          scripts=0
          python3 scripts/mutation-verdict.py judge --plan "$reports/mutation-plan/plan.json" --class scripts --python "$reports" --rows "$reports/mutation-rows/rows.json" --python-whole "$reports/mutation-plan/python-whole.json" || scripts=$?
          if [ "$status" -eq 0 ]; then status=$scripts; fi
          legs=0
          python3 scripts/mutation-verdict.py legs --plan "$reports/mutation-plan/plan.json" --rust-leg "$RUST_LEG" --rows-leg "$ROWS_LEG" --python-release-leg "$PYTHON_RELEASE_LEG" || legs=$?
          if [ "$status" -eq 0 ]; then status=$legs; fi
          exit "$status"
      # Every whole and carried Python outcome of this run, its tree identity and each Python
      # class's key, kept whatever the legs returned, as a later release run's base (SPEC-493 R12).
      - name: the run's Python outcomes, whole and carried, for a later release run's carry
        if: ${{ always() }}
        run: python3 scripts/mutation-verdict.py manifest --plan "$RUNNER_TEMP/reports/mutation-plan/plan.json" --python "$RUNNER_TEMP/reports" --out "$RUNNER_TEMP/outcomes/mutation-outcomes.json" --run-id "$GITHUB_RUN_ID"
      - name: keep the run's outcomes for a later release run's carry
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-outcomes
          path: ${{ runner.temp }}/outcomes/
          if-no-files-found: warn
      # Each Rust package's Timeouts over the legs' reports, beside its baseline tests' seconds: a
      # package whose mutants timed out and whose baseline tests, times 1.5, pass the 2300 s
      # per-mutant timeout, or that no log times, is printed READ BY NAME with each such mutant, so
      # that no Timeout counts silently as a kill (SPEC-480 R16). It runs whatever the verdict read.
      - name: the Rust legs' Timeouts by package, each over-margin package by name
        if: ${{ always() }}
        run: bash scripts/mutation-timeouts.sh "$RUNNER_TEMP/reports"

  # StrykerJS over every web production file the diff changes, whole, so a survivor already on a
  # touched file is the pull request's own (SPEC-039 R3, ADR-057 D3), dealt into three shards
  # (SPEC-419, ADR-433). Each shard plans as the leg always has, asks StrykerJS's own mutation
  # server how many mutants each planned file holds, takes its share of the files dealt whole by
  # that count, largest first onto the lightest shard, and runs StrykerJS over its share. It keeps
  # its record and its report under its own index whatever its outcome, and one shard's failure
  # cancels no other. It restores the pnpm store and saves none.
  mutation-web-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: the plan (the event's case, the diff's classes, the web files it changes)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: python3 scripts/mutation-verdict.py plan --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/mutation" --event "$EVENT" --base-ref "$BASE_REF" --subject "$SUBJECT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.plan.outputs.web == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.plan.outputs.web == 'true' }}
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the pnpm store's path
        id: pnpm-store
        if: ${{ steps.plan.outputs.web == 'true' }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: restore the pnpm store, keyed on pnpm-lock.yaml
        if: ${{ steps.plan.outputs.web == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: the Mini App's dependencies, and the sources it generates
        if: ${{ steps.plan.outputs.web == 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web/app exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide --emit-ts-declarations --silent
          pnpm --dir web/app exec svelte-kit sync
      # A plan that names no web file deals every shard an explicit empty record and asks nothing.
      - name: this shard's deal, by StrykerJS's own count of each planned file's mutants
        id: deal
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/web_mutation_shards.py deal --plan "$RUNNER_TEMP/mutation/plan.json" --shard "$SHARD" --out "$RUNNER_TEMP/shards" --app web/app --node node
      - name: StrykerJS over this shard's files, whole (the verdict job reads its report)
        if: ${{ steps.deal.outputs.run == 'true' }}
        working-directory: web/app
        env:
          MUTATE: ${{ steps.deal.outputs.mutate }}
          SHARD: ${{ matrix.shard }}
        run: |
          out="$RUNNER_TEMP/shards/mutation-web-shard-$SHARD"
          rc=0
          pnpm exec stryker run --mutate "$MUTATE" || rc=$?
          cp reports/mutation/mutation.json "$out/mutation.json" || true
          echo "$rc" > "$out/stryker.exit"
          echo "StrykerJS exited $rc"
      - name: keep this shard's record and report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-web-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: warn

  # The web sweep's verdict (SPEC-419 R6, R7): one job of the leg's own name, not a matrix, so the
  # check that reports it still reports under that name. It runs whatever the shards returned,
  # reads every shard's record and report by name, and judges their union as it judged one report;
  # a missing, cut, partial, foreign or misdealt shard reads VOID by name and writes no union.
  mutation-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    needs: [mutation-web-shard]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: the plan (the event's case, the diff's classes, the web files it changes)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: python3 scripts/mutation-verdict.py plan --base HEAD^1 --head HEAD --out "$RUNNER_TEMP/mutation" --event "$EVENT" --base-ref "$BASE_REF" --subject "$SUBJECT"
      # Each shard's artifact holds its own directory named by its index, so merging lays one shard
      # and three at the same paths; a shard that kept nothing is named by the union, not here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-web-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards
      - name: every shard read by name, united into the one report the verdict reads
        env:
          RESULT: ${{ needs.mutation-web-shard.result }}
        run: python3 scripts/web_mutation_shards.py union --plan "$RUNNER_TEMP/mutation/plan.json" --reports "$RUNNER_TEMP/shards" --result "$RESULT" --out "$RUNNER_TEMP/mutation/stryker/mutation.json"
      - name: the verdict, from Stryker's own report (the plan names a not-applicable case)
        run: python3 scripts/mutation-verdict.py judge --plan "$RUNNER_TEMP/mutation/plan.json" --class web --stryker "$RUNNER_TEMP/mutation/stryker/mutation.json"
      - name: keep the plan and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-web
          path: ${{ runner.temp }}/mutation/
          if-no-files-found: warn

  # The web engine (SPEC-338 R8, R9; ADR-349): Anki's engine built for wasm32 with its bindings,
  # held to ADR-336's budget of 8000000 bytes gzip -9, then the browser tests over that module in
  # Chromium and WebKit. The build's only wasm32 settings are on scripts/web-engine-build.sh's
  # command line: no .cargo/config.toml and no RUSTFLAGS (ADR-348). It restores the Rust cache for
  # the registry and saves none.
  web-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml) and its wasm32 target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: wasm-bindgen 0.2.129 (the crate's exact version) and wasm-opt from binaryen 133, checksums verified
        env:
          WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL -o /tmp/wasm-bindgen.tgz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo "$WASM_BINDGEN_SHA256  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          curl -fsSL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "$BINARYEN_SHA256  /tmp/binaryen.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/wasm"
          tar -xzf /tmp/wasm-bindgen.tgz -C "$HOME/.local/wasm" --strip-components=1 wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          tar -xzf /tmp/binaryen.tgz -C "$HOME/.local/wasm"
          echo "$HOME/.local/wasm" >> "$GITHUB_PATH"
          echo "$HOME/.local/wasm/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: a C compiler and archiver for wasm32 (SQLite's source)
        run: |
          command -v llvm-ar-18 || sudo apt-get install -y --no-install-recommends llvm-18
          clang-18 --version
      - name: restore the Rust cache, keyed on the toolchain pin and Cargo.lock
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # The study day crate, which both clients link (SPEC-497 R4; ADR-515 D5), built for the web
      # client's wasm32 target and the native client's iOS target. A library needs no linker and
      # no SDK, so this runner builds both.
      - name: the study day crate for both clients' targets (wasm32 and iOS)
        run: |
          rustup target add aarch64-apple-ios
          cargo build --locked -p deck-streak-study-day --lib --target wasm32-unknown-unknown --target aarch64-apple-ios
      # The collection store, which both clients will link (SPEC-512 R9; ADR-530 D10), built for the
      # web client's wasm32 target with the C compiler and archiver SQLite's source needs there. Its
      # iOS build runs in xcframework.yml, where the iOS SDK the bundled SQLite compiles against is.
      - name: the collection store for the web client's target (wasm32)
        run: |
          CC_wasm32_unknown_unknown=clang-18 AR_wasm32_unknown_unknown=llvm-ar-18 \
            cargo build --locked -p deck-streak-collection --lib --target wasm32-unknown-unknown
      - name: build the module and its bindings
        run: bash scripts/web-engine-build.sh --cc clang-18 --ar llvm-ar-18 --out target/web-engine
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the size gate (8000000 bytes gzip -9, brotli beside it)
        run: python3 scripts/web-engine-size.py --module target/web-engine/deck_streak_web_engine_bg.wasm --bindings target/web-engine/deck_streak_web_engine.js
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: Chromium's headless shell and WebKit, with their system libraries
        run: pnpm --dir web/app exec playwright install --with-deps --only-shell chromium webkit
      - name: the browser tests over the module (Chromium and WebKit, persistent profiles)
        run: pnpm --dir web/app test:engine
      - name: the Mini App's build, which the study suite serves
        run: pnpm --dir web/app build
      - name: the module and its bindings staged beside the build, under /engine/
        run: bash scripts/web-engine-stage.sh
      - name: the study suite over the staged build (Chromium and WebKit, persistent profiles)
        run: pnpm --dir web/app test:study

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor
      - name: zizmor audits the workflows themselves
        run: zizmor --no-online-audits --persona regular .github/workflows

  base-is-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The release run, a pull request from this repository's dev into main, is named here for `ci`
    # by release_run's predicate (SPEC-422 R1): `true` on it, `false` on every other run, and empty
    # when the first step refused the run, so a refused run is never the release run (SPEC-500 R1).
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: a pull request into main comes from this repository's dev
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; then
              echo "base-is-dev: a pull request into main must come from $REPO's dev (it comes from '$HEAD_REPO:$HEAD'). Open it against dev: gh pr create --base dev"
              exit 1
            fi
          fi
          echo "base-is-dev: ok ($EVENT into '${BASE:-push}')"
      - name: the run is the release run only for dev into main from this repository
        id: release
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          release=false
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ] && [ "$HEAD" = "dev" ] && [ -n "$REPO" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            release=true
          fi
          echo "base-is-dev: release=$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  ci:
    name: ${{ github.event_name == 'pull_request' && 'ci' || 'ci (push)' }}
    if: ${{ always() }}
    needs: [rust, engine, release, web, card-sandbox, hygiene, mutation-plan, mutation-rust, mutation-python, mutation-python-release, mutation-rows, mutation-verdict, mutation-web-shard, mutation-web, web-engine, workflow-lint, base-is-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job reads as passing to a required check, so on every run but the release run a
      # skip is admitted from the two legs the plan's listing can give nothing and from nowhere
      # else, once for each leg whose own result is `skipped`; `mutation-verdict`, which must
      # succeed there, judged each against the listing (SPEC-290 R8).
      # A third leg, `mutation-python-release`, is admitted and judged the same way (SPEC-422 R11).
      # On the release run, which base-is-dev's `release` output names, every mutation job's
      # result is advisory: the step prints each one, to the step summary too, and admits one
      # result that is not `success`, by value, for each mutation job that did not succeed, so
      # every other need, one added later included, must still succeed (SPEC-500 R2).
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUST_LEG: ${{ needs.mutation-rust.result }}
          ROWS_LEG: ${{ needs.mutation-rows.result }}
          PYTHON_RELEASE_LEG: ${{ needs.mutation-python-release.result }}
          RELEASE: ${{ needs.base-is-dev.outputs.release }}
          PLAN_JOB: ${{ needs.mutation-plan.result }}
          PYTHON_LEG: ${{ needs.mutation-python.result }}
          VERDICT_JOB: ${{ needs.mutation-verdict.result }}
          WEB_SHARD_JOB: ${{ needs.mutation-web-shard.result }}
          WEB_JOB: ${{ needs.mutation-web.result }}
        run: |
          if [ "$RELEASE" = true ]; then
            owed=" "
            for job in "mutation-plan:$PLAN_JOB" "mutation-rust:$RUST_LEG" "mutation-python:$PYTHON_LEG" "mutation-python-release:$PYTHON_RELEASE_LEG" "mutation-rows:$ROWS_LEG" "mutation-verdict:$VERDICT_JOB" "mutation-web-shard:$WEB_SHARD_JOB" "mutation-web:$WEB_JOB"; do
              line="ci: ${job%%:*} reads ${job#*:}; advisory on the release run (SPEC-500)"
              echo "$line"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "$line" >> "$GITHUB_STEP_SUMMARY"
              fi
              if [ "${job#*:}" != success ]; then
                owed="$owed${job#*:} "
              fi
            done
            for result in $RESULTS; do
              case "$owed" in
                *" $result "*)
                  owed="${owed%%" $result "*} ${owed#*" $result "}"
                  continue
                  ;;
              esac
              test "$result" = success || exit 1
            done
          else
            admitted=0
            for leg in "mutation-rust:$RUST_LEG" "mutation-rows:$ROWS_LEG" "mutation-python-release:$PYTHON_RELEASE_LEG"; do
              if [ "${leg#*:}" = skipped ]; then
                echo "ci: ${leg%%:*} was not started; mutation-verdict judged it against the plan's listing"
                admitted=$((admitted + 1))
              fi
            done
            for result in $RESULTS; do
              if [ "$result" = skipped ] && [ "$admitted" -gt 0 ]; then
                admitted=$((admitted - 1))
                continue
              fi
              test "$result" = success || exit 1
            done
          fi
