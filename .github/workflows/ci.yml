name: ci

# The local gate (scripts/check.sh) on GitHub-hosted runners, on every pull request into dev or
# main and every push to them (ADR-017). No secret is used, the token is read-only, every action
# is pinned by its full commit SHA, and every job runs on a GitHub-hosted runner.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHECK_LOG_DIR: ${{ github.workspace }}/.check-logs
      CHECK_HISTORY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest,cargo-deny
      - name: gitleaks 8.30.1, checksum verified
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Playwright's headless Chromium for the Mini App's end-to-end tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web/app exec playwright install --with-deps chromium --only-shell
      - name: toolchain
        run: bash scripts/check.sh toolchain
      - name: fmt (cargo fmt --all --check)
        run: bash scripts/check.sh fmt
      - name: clippy (cargo clippy --workspace --all-targets --locked -- -D warnings)
        run: bash scripts/check.sh clippy
      - name: test (cargo nextest run --workspace) and doctests (cargo test --doc)
        run: bash scripts/check.sh test doctest
      - name: web (pnpm check with svelte-check, vitest, vite build, playwright)
        run: bash scripts/check.sh web
      - name: python (the repository's guard tests and the parity oracle's)
        run: bash scripts/check.sh python
      - name: packs (every vendored pack's rows, scripts/pack-rows.py)
        run: bash scripts/check.sh packs
      - name: scrub (the public deny-list and no apiKeyHelper)
        run: bash scripts/check.sh scrub
      - name: audit (cargo deny check, pnpm audit)
        run: bash scripts/check.sh audit
      - name: secrets (gitleaks over the tree and the whole history)
        run: bash scripts/check.sh secrets
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-stage-logs
          path: .check-logs/
          if-no-files-found: warn

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zizmor
      - name: zizmor audits the workflows themselves
        run: zizmor --no-online-audits --persona regular .github/workflows

  base-is-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: a pull request into main comes from this repository's dev
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; then
              echo "base-is-dev: a pull request into main must come from $REPO's dev (it comes from '$HEAD_REPO:$HEAD'). Open it against dev: gh pr create --base dev"
              exit 1
            fi
          fi
          echo "base-is-dev: ok ($EVENT into '${BASE:-push}')"

  ci:
    if: ${{ always() }}
    needs: [gate, workflow-lint, base-is-dev]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do test "$result" = success || exit 1; done
