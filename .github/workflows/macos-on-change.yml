name: macos-on-change

# The macOS CI lane (SPEC-679 section 9b, R7): a pull request into dev that changes an Apple or FFI
# path, the paths apple-on-change.yml watches with this file in place of that one, builds the
# DeckStreak scheme for a macOS destination with the pinned Xcode and runs its unit tests there.
# The framework job calls the one XCFramework workflow, as the TestFlight lanes do; the macos job
# takes that run's artifact and builds nothing of the engine (SPEC-346 R3). Its runner is admitted
# by this file's name (ADR-345 D4). No secret is passed, nothing is signed with a team or uploaded,
# and the token is read-only.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - "crates/ffi/**"
      - "crates/engine-core/**"
      - "crates/fsrs7/**"
      - "crates/collection/**"
      - "crates/media/**"
      - "ios/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/xcframework.yml"
      - ".github/workflows/macos-on-change.yml"
      - "scripts/swift_mutants.py"

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes
# (SPEC-190). Any other event has a group of its own, its run id, so it is never cancelled.
concurrency:
  group: macos-on-change-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework:
    uses: $/.github/workflows/xcframework.yml

  macos:
    needs: framework
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_DIGEST: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Xcode, its version printed
        run: xcodebuild -version
      - name: this run's XCFramework, bindings and review fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xcframework
          path: engine-artifact
      - name: place the framework and the bindings
        run: |
          mkdir -p ios/EnginePackage/Sources/DeckStreakFFI
          cp -R engine-artifact/DeckStreakFFI.xcframework ios/EnginePackage/
          cp engine-artifact/bindings/deck_streak_ffi.swift ios/EnginePackage/Sources/DeckStreakFFI/
      - name: XcodeGen, checksum-verified
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_DIGEST  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
      - name: the app's project, generated
        run: |
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/app.yml
      - name: the app's unit tests, Debug, on macOS, with the two keychain classes skipped
        # Signed ad hoc on its command line, never with a team. CredentialStoreTests and
        # SyncModelTests call the keychain, so this step skips them on macOS alone; the
        # iPhone and iPad unit tests still run both.
        run: |
          cp -R engine-artifact/review-fixture "$RUNNER_TEMP/review-fixture"
          TEST_RUNNER_DS_REVIEW_FIXTURE="$RUNNER_TEMP/review-fixture" xcodebuild test -project ios/DeckStreak.xcodeproj -scheme DeckStreakMac -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:DeckStreakTests \
            -skip-testing:DeckStreakTests/CredentialStoreTests \
            -skip-testing:DeckStreakTests/SyncModelTests \
            -derivedDataPath "$RUNNER_TEMP/macos-debug" \
            -resultBundlePath "$RUNNER_TEMP/macos.xcresult" \
            CODE_SIGN_IDENTITY=-
