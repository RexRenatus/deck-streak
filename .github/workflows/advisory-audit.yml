name: advisory-audit

# A scheduled re-audit of dev (SPEC-038 R21 to R24, ADR-055's amendment): the audit-rust and
# audit-web stages of scripts/check.sh, set up as ci.yml's rust and web jobs set them up, over dev
# once a day and on dispatch. Both stages read an advisory database when they run, cargo deny the
# RustSec database it fetches and pnpm audit the registry's report, so dev can read red with no new
# commit; this run reads it before the next push or pull request does. It runs on no pull request
# and no push, so no run of it reports under a required check's name and no pull request waits on
# it. A schedule runs only from the default branch's copy of a workflow (rust-cache.yml); until
# that copy holds this file, a dispatch at dev runs it.
# No secret is used, the token is read-only and no job widens it, every action is pinned by its
# full commit SHA, no cache is restored or saved, nothing lets an audit fail quietly, and each job
# uploads its stage logs whatever its audit read.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run waits for the one before it, and none is cancelled.
concurrency:
  group: advisory-audit
  cancel-in-progress: false

jobs:
  audit-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      - name: audit-rust (cargo deny over the advisory database it fetches, then the lock's canonical form)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh audit-rust
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-rust
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn

  audit-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: audit-web (pnpm audit of every package the lockfile resolves, against the registry's report)
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: bash scripts/check.sh audit-web
      - name: upload stage logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-stage-logs-web
          path: ${{ runner.temp }}/check-logs/
          if-no-files-found: warn
