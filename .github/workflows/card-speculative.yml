name: card-speculative

# The speculative-connection measurement (#941): the planted cards a link predictor could act on, in
# a stock build of each engine the web card suite runs (web/app/playwright.speculative.config.ts),
# read at the card suite's TCP listener. It runs on a pull request into dev that changes the
# measurement, its configuration, the planted cards, the listeners or this workflow, prints every
# reading in its log, keeps them in the `card-speculative-results` artifact, and judges only its
# controls. No secret is used, the token is read-only, and every action is pinned by its full commit
# SHA.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - "web/app/tests-card/speculative.measure.ts"
      - "web/app/tests-card/planted.ts"
      - "web/app/tests-card/listeners.ts"
      - "web/app/playwright.speculative.config.ts"
      - ".github/workflows/card-speculative.yml"

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes
# (SPEC-190). Any other event has a group of its own, its run id, so it is never cancelled.
concurrency:
  group: card-speculative-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: the full Chromium build and its headless shell, WebKit and Firefox, with their system libraries
        run: pnpm --dir web/app exec playwright install --with-deps chromium webkit firefox
      - name: the speculative-connection measurement, in each engine
        run: pnpm --dir web/app exec playwright test --config playwright.speculative.config.ts
      - name: upload the measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-speculative-results
          path: web/app/test-results/
          if-no-files-found: warn
