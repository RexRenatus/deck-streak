name: testflight-rerelease-check

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-rerelease-check
  cancel-in-progress: false

jobs:
  rerelease:
    runs-on: ubuntu-24.04
    environment: rerelease-read
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
      - name: the credential, by presence
        id: preflight
        env:
          KEY: ${{ secrets.TESTFLIGHT_CHECK_KEY != '' }}
          KEYID: ${{ secrets.TESTFLIGHT_CHECK_KEY_ID != '' }}
          ISSUER: ${{ secrets.TESTFLIGHT_CHECK_ISSUER_ID != '' }}
          APPID: ${{ secrets.TESTFLIGHT_CHECK_APP_ID != '' }}
        run: python3 scripts/testflight_age.py preflight
      - name: the newest internal build, read
        id: read
        env:
          KEY: ${{ secrets.TESTFLIGHT_CHECK_KEY }}
          KEYID: ${{ secrets.TESTFLIGHT_CHECK_KEY_ID }}
          ISSUER: ${{ secrets.TESTFLIGHT_CHECK_ISSUER_ID }}
          APPID: ${{ secrets.TESTFLIGHT_CHECK_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/testflight_age.py check
