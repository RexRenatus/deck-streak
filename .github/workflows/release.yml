name: release

# Builds a tagged release once and publishes it (SPEC-062 R1, R2; ADR-062, ADR-017, ADR-034). It runs
# on a push of a SemVer tag and nothing else, and refuses a tag whose commit is not on main. The one
# job builds the release binary and the Mini App, assembles one tarball with the deploy files, the
# agent files and a manifest of digests, writes SHA256SUMS, attests the tarball's build provenance,
# and attaches both files to a draft release. The release is published by the last step, after every
# upload succeeded, so a half-built release is never visible. The token is read-only except in that
# one job, no secret is used, every action is pinned by its full commit SHA, and no step saves a
# cache.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: the tag is SemVer, annotated, and its commit is on main
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "the tag $tag is not a SemVer release tag" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "the tag $tag is a lightweight tag; a release is an annotated tag" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the commit of $tag is not on main" >&2
            exit 1
          fi
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: the release binary
        run: cargo build --release --locked -p deck-streak-daemon --bin deckstreakd
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: 'false'
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: the Mini App, built once
        run: pnpm --dir web/app build
      - name: the tarball and its digests
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          out="$RUNNER_TEMP/release"
          stage="$out/deck-streak-$tag"
          mkdir -p "$stage/bin" "$stage/web"
          install -m 0755 target/release/deckstreakd "$stage/bin/deckstreakd"
          cp -R web/app/build/. "$stage/web/"
          cp -R deploy "$stage/deploy"
          cp -R agent "$stage/agent"
          if [ -f ai-safety.json ]; then cp ai-safety.json "$stage/ai-safety.json"; fi
          (cd "$stage" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$stage" -czf "$out/deck-streak-$tag.tar.gz" .
          (cd "$out" && sha256sum "deck-streak-$tag.tar.gz" > SHA256SUMS)
          echo "OUT=$out" >> "$GITHUB_ENV"
          {
            echo "## Release $tag"
            echo
            echo "Unpacked size: $(du -sk "$stage" | cut -f1) KiB in $(find "$stage" -type f | wc -l) files."
            echo "Tarball: $(stat -c %s "$out/deck-streak-$tag.tar.gz") bytes."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: a draft release, so nothing is visible until the last upload
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}/deck-streak-${{ github.ref_name }}.tar.gz
      - name: attach the tarball and its digests
        run: gh release upload "$GITHUB_REF_NAME" "$OUT/deck-streak-$GITHUB_REF_NAME.tar.gz" "$OUT/SHA256SUMS"
      - name: publish, last
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
