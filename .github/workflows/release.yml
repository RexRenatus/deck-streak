name: release

# Builds a tagged release once and publishes it (SPEC-062 R1, R2; ADR-062, ADR-017, ADR-034). It runs
# on a push of a SemVer tag, or on a manual dispatch made at that tag's own ref (SPEC-373,
# ADR-384), and refuses a ref that is not the tag and a tag whose commit is not on main. A
# first job audits the sync server's dependency graph (SPEC-340 R7, ADR-351 D5), and the release
# job, which needs it, builds the release binary and the sync server from the engine's pin
# (SPEC-337, ADR-347) and the Mini App, assembles one tarball with the deploy files, the agent files
# and a manifest of digests, writes SHA256SUMS, attests the tarball's build provenance, and attaches
# both files to a draft release. The release is published by the last step, after every upload
# succeeded, so a half-built release is never visible. The token is read-only except in the release
# job, no secret is used, every action is pinned by its full commit SHA, and no step saves a cache.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# One tag's runs take turns (the tag's group), a running one is never cancelled and a waiting one is
# not replaced: `queue: max` keeps up to a hundred waiting runs in the group and cancels any beyond
# them, where the default keeps one and replaces it (ADR-292).
# A dispatch made at a tag's own ref runs at that ref, so it joins the tag's group (ADR-384).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    needs: [audit-sync-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: the tag is SemVer, annotated, and its commit is on main
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "the tag $tag is not a SemVer release tag" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "the ref $GITHUB_REF is not the tag $tag" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
            echo "the tag $tag is a lightweight tag; a release is an annotated tag" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the commit of $tag is not on main" >&2
            exit 1
          fi
      - name: the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: protoc 31.1, checksum verified (Anki's engine compiles its protobuf definitions, ADR-022)
        env:
          PROTOC_SHA256: 96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
          echo "$PROTOC_SHA256  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: the release binary
        run: cargo build --release --locked -p deck-streak-daemon --bin deckstreakd
      - name: the sync server, from the fork and the commit the engine's patch entry pins (ADR-347, ADR-058)
        run: |
          set -euo pipefail
          pin="$(python3 -c 'import tomllib; entry = tomllib.load(open("Cargo.toml", "rb"))["patch"]["https://github.com/ankitects/anki.git"]["anki"]; print(entry["git"], entry["rev"])')"
          read -r fork rev <<< "$pin"
          if ! grep -Eqx '[0-9a-f]{40}' <<< "$rev"; then
            echo "the engine's patch entry pins $rev, not a full commit" >&2
            exit 1
          fi
          cargo install --locked --git "$fork" --rev "$rev" --root "$RUNNER_TEMP/sync-server" anki-sync-server
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: 'false'
      - name: the pinned Rust toolchain (rust-toolchain.toml) and its wasm32 target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: wasm-bindgen 0.2.129 (the crate's exact version) and wasm-opt from binaryen 133, checksums verified
        env:
          WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL -o /tmp/wasm-bindgen.tgz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo "$WASM_BINDGEN_SHA256  /tmp/wasm-bindgen.tgz" | sha256sum -c -
          curl -fsSL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "$BINARYEN_SHA256  /tmp/binaryen.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/wasm"
          tar -xzf /tmp/wasm-bindgen.tgz -C "$HOME/.local/wasm" --strip-components=1 wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          tar -xzf /tmp/binaryen.tgz -C "$HOME/.local/wasm"
          echo "$HOME/.local/wasm" >> "$GITHUB_PATH"
          echo "$HOME/.local/wasm/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: a C compiler and archiver for wasm32 (SQLite's source)
        run: |
          command -v llvm-ar-18 || sudo apt-get install -y --no-install-recommends llvm-18
          clang-18 --version
      - name: build the module and its bindings
        run: bash scripts/web-engine-build.sh --cc clang-18 --ar llvm-ar-18 --out target/web-engine
      - name: the size gate (8000000 bytes gzip -9, brotli beside it)
        run: python3 scripts/web-engine-size.py --module target/web-engine/deck_streak_web_engine_bg.wasm --bindings target/web-engine/deck_streak_web_engine.js
      - name: the Mini App's dependencies
        run: pnpm install --frozen-lockfile
      - name: the Mini App, built once
        run: pnpm --dir web/app build
      - name: the module and its bindings staged beside the build, under /engine/
        run: bash scripts/web-engine-stage.sh
      - name: the tarball and its digests
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          out="$RUNNER_TEMP/release"
          stage="$out/deck-streak-$tag"
          mkdir -p "$stage/bin" "$stage/web"
          install -m 0755 target/release/deckstreakd "$stage/bin/deckstreakd"
          install -m 0755 "$RUNNER_TEMP/sync-server/bin/anki-sync-server" "$stage/bin/anki-sync-server"
          cp -R web/app/build/. "$stage/web/"
          cp -R deploy "$stage/deploy"
          cp -R agent "$stage/agent"
          if [ -f ai-safety.json ]; then cp ai-safety.json "$stage/ai-safety.json"; fi
          (cd "$stage" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$stage" -czf "$out/deck-streak-$tag.tar.gz" .
          (cd "$out" && sha256sum "deck-streak-$tag.tar.gz" > SHA256SUMS)
          echo "OUT=$out" >> "$GITHUB_ENV"
          {
            echo "## Release $tag"
            echo
            echo "Unpacked size: $(du -sk "$stage" | cut -f1) KiB in $(find "$stage" -type f | wc -l) files."
            echo "Tarball: $(stat -c %s "$out/deck-streak-$tag.tar.gz") bytes."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: a draft release, so nothing is visible until the last upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}/deck-streak-${{ github.ref_name }}.tar.gz
      - name: attach the tarball and its digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$OUT/deck-streak-$GITHUB_REF_NAME.tar.gz" "$OUT/SHA256SUMS"
      - name: publish, last
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # The sync server's dependency audit (SPEC-340 R7; ADR-351 D5): the RustSec advisory check over
  # the graph the release builds the sync server from, at the fork and the commit the engine's patch
  # entry pins, under the fork's own lockfile. It reads the repository and writes nothing, and the
  # release job needs it, so an advisory refuses the release before anything is built.
  audit-sync-server:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the audit job reads the pinned Rust toolchain too
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - name: the sync server's advisories, at the commit the engine's patch entry pins
        run: bash scripts/audit-sync-server.sh --work "$RUNNER_TEMP/sync-server-audit"
