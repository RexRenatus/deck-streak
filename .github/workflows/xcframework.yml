name: xcframework

# The FFI adapter as an XCFramework for an iPhone and an iPad (SPEC-336 R6 to R9, ADR-345 D3 and
# D4): the adapter's static library for a device (aarch64-apple-ios) and for the simulator on Apple
# silicon (aarch64-apple-ios-sim), the Swift bindings generated in library mode by the generator the
# adapter itself builds, a check that the generated modulemap names no builtin clang module, one
# XCFramework holding both slices, and a consumer check that typechecks the generated Swift against
# each slice's own headers. It publishes the build time, each slice's size and both checks as the
# run's summary and as the `xcframework` artifact, beside the framework and the bindings.
# apple-on-change.yml calls it on a pull request into dev that changes an Apple or FFI path,
# apple-on-tag.yml calls it on every release tag, and a dispatch runs it directly (SPEC-344). The
# two TestFlight lanes, testflight-internal.yml and testflight-release.yml, call it before their app
# job builds and uploads the app (SPEC-352). No secret is passed to it or used by it, the token is
# read-only, and every action is pinned by its full commit SHA.
#
# The Swift harness (SPEC-339 R11, R12, ADR-350): the `xcframework` job also writes the synthetic
# collection with this commit's engine; `harness-wire` runs the codec's tests on the host; and
# `harness` links the framework, the bindings and the collection of THIS run into the app, runs its
# tests on one iPhone and one iPad simulator, measures, and uploads its report and result bundles.
# The card view (SPEC-349): `card-isolation` runs the CardIsolation package's tests and its Swift
# mutant sweep on the host, as `harness-wire` does for the codec.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcframework:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      REPORT: ${{ github.workspace }}/xcframework-report
      # The Xcode the other three jobs pin, so every job of the body builds with one named
      # toolchain rather than the image's default (SPEC-382 R5, ADR-396).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The protobuf compiler the engine's build needs: the version ADR-022 pins, and the macOS
      # archive and digest Anki's own build pins for it (build/ninja_gen/src/protobuf.rs at the
      # engine's tag).
      PROTOC_VERSION: "31.1"
      PROTOC_MACOS_DIGEST: 99ea004549c139f46da5638187a85bbe422d78939be0fa01af1aa8ab672e395f
      # The lowest iOS the consumer check typechecks the bindings for.
      IOS_DEPLOYMENT: "17.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain and its two iOS targets, before the clock starts
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: protoc, checksum-verified
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-universal_binary.zip"
          echo "$PROTOC_MACOS_DIGEST  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
      - name: the two static libraries, clocked from the first compile to the second archive
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          mkdir -p "$REPORT"
          sysctl -n hw.ncpu > "$REPORT/runner-cpus"
          started=$(date +%s)
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            target_started=$(date +%s)
            cargo rustc --locked --release -p deck-streak-ffi --lib --crate-type staticlib --target "$target" --timings
            echo "$(( $(date +%s) - target_started ))" > "$REPORT/build-seconds-$target"
          done
          echo "$(( $(date +%s) - started ))" > "$REPORT/build-seconds"
      - name: the Swift bindings, in library mode over the device library
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          started=$(date +%s)
          cargo run --locked -p deck-streak-ffi --features bindgen --bin uniffi-bindgen-swift -- \
            target/aarch64-apple-ios/release/libdeck_streak_ffi.a bindings \
            --swift-sources --headers --modulemap \
            --module-name deck_streak_ffiFFI --modulemap-filename module.modulemap
          echo "$(( $(date +%s) - started ))" > "$REPORT/bindgen-seconds"
          ls bindings
      - name: the bindings hold one module
        run: |
          echo fail > "$REPORT/one-module"
          files=$(cd bindings && find . -type f | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')
          echo "bindings: $files"
          test "$files" = "deck_streak_ffi.swift deck_streak_ffiFFI.h module.modulemap "
          modules=$(grep -cE '^[[:space:]]*(explicit[[:space:]]+|framework[[:space:]]+)?module[[:space:]]' bindings/module.modulemap || true)
          echo "modules declared: $modules"
          test "$modules" -eq 1
          echo pass > "$REPORT/one-module"
      - name: the modulemap check, which a builtin clang module refuses
        run: |
          cp bindings/module.modulemap "$REPORT/module.modulemap"
          if grep -n '_Builtin_' bindings/module.modulemap; then
            echo fail > "$REPORT/modulemap"
            exit 1
          fi
          echo pass > "$REPORT/modulemap"
      - name: the XCFramework, device and simulator slices
        run: |
          mkdir -p headers
          cp bindings/deck_streak_ffiFFI.h bindings/module.modulemap headers/
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libdeck_streak_ffi.a -headers headers \
            -library target/aarch64-apple-ios-sim/release/libdeck_streak_ffi.a -headers headers \
            -output DeckStreakFFI.xcframework
          find DeckStreakFFI.xcframework -name '*.a' -exec stat -f '%N %z' {} \; | tee "$REPORT/slices"
      - name: the XCFramework holds one Rust library
        run: |
          echo fail > "$REPORT/one-library"
          libraries=$(cd DeckStreakFFI.xcframework && find . -name '*.a' | sed 's|^\./||' | LC_ALL=C sort | tr '\n' ' ')
          echo "libraries: $libraries"
          test "$libraries" = "ios-arm64-simulator/libdeck_streak_ffi.a ios-arm64/libdeck_streak_ffi.a "
          echo pass > "$REPORT/one-library"
      - name: the consumer check, the generated Swift typechecked against each slice's headers
        run: |
          echo fail > "$REPORT/consumer"
          for slice in ios-arm64:iphoneos: ios-arm64-simulator:iphonesimulator:-simulator; do
            IFS=: read -r dir sdk suffix <<< "$slice"
            target="arm64-apple-ios${IOS_DEPLOYMENT}${suffix}"
            xcrun --sdk "$sdk" swiftc -typecheck -target "$target" \
              -I "DeckStreakFFI.xcframework/$dir/Headers" bindings/deck_streak_ffi.swift
            echo "$dir typechecks"
          done
          echo pass > "$REPORT/consumer"
      - name: the harness's synthetic collection, written by this commit's engine
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          started=$(date +%s)
          cargo run --locked -p deck-streak-ffi --example harness-fixture -- harness-fixture
          echo "$(( $(date +%s) - started ))" > "$REPORT/fixture-seconds"
          ls -l harness-fixture
          cargo run --locked -p deck-streak-ffi --example review-fixture -- review-fixture
          ls -l review-fixture
      - name: the report
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          report = pathlib.Path(os.environ["REPORT"])
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          def minutes(name):
              seconds = read(name)
              return f"{int(seconds) / 60:.1f} minutes" if seconds else "not measured"
          rows = [
              ("two static libraries, release", minutes("build-seconds")),
              ("Swift bindings, library mode", minutes("bindgen-seconds")),
              ("modulemap names no builtin clang module", read("modulemap") or "not measured"),
              ("generated Swift typechecks against each slice", read("consumer") or "not measured"),
              ("the bindings hold one module", read("one-module") or "not measured"),
              ("the XCFramework holds one Rust library", read("one-library") or "not measured"),
              ("the harness's synthetic collection, host build", minutes("fixture-seconds")),
          ]
          for target in ("aarch64-apple-ios", "aarch64-apple-ios-sim"):
              rows.append((f"static library `{target}`, release", minutes(f"build-seconds-{target}")))
          for line in read("slices").splitlines():
              path, size = line.rsplit(" ", 1)
              rows.append((f"slice `{path.split('/')[1]}`", f"{int(size) / 1048576:.1f} MiB"))
          lines = [
              f"`xcframework.yml` on a GitHub-hosted runner with {read('runner-cpus')} CPUs:",
              "",
              "| measure | measured |",
              "|---|---|",
          ] + [f"| {name} | {value} |" for name, value in rows]
          text = "\n".join(lines) + "\n"
          (report / "report.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## XCFramework (SPEC-336)\n\n" + text)
          print(text)
          PY
      - name: upload the XCFramework, the bindings and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework
          path: |
            DeckStreakFFI.xcframework/
            bindings/
            xcframework-report/
            harness-fixture/
            review-fixture/
          if-no-files-found: warn
      - name: the timing record
        # The job's own timing, written and uploaded whatever the outcome (SPEC-382 R6, ADR-393):
        # every seconds file a step wrote and the toolchain; cargo's own report goes beside it.
        if: ${{ always() }}
        run: |
          mkdir -p "$REPORT"
          xcodebuild -version > "$REPORT/xcode-version"
          sw_vers > "$REPORT/os-version"
          python3 - <<'PY'
          import json, os, pathlib
          report = pathlib.Path(os.environ["REPORT"])
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          seconds = {}
          for path in sorted(report.glob("*-seconds*")):
              if "." not in path.name:
                  value = path.read_text().strip()
                  seconds[path.name] = int(value) if value.isdigit() else None
          record = {"schema": "ci-timing/1", "job": "xcframework", "seconds": seconds,
                    "toolchain": {"xcode": read("xcode-version"), "os": read("os-version")}}
          (report / "timing.json").write_text(json.dumps(record, indent=1) + "\n")
          print(json.dumps(record, indent=1))
          PY
      - name: upload the timing record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing-xcframework
          path: |
            xcframework-report/timing.json
            target/cargo-timings/
          if-no-files-found: warn

  harness-wire:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REPORT: ${{ github.workspace }}/harness-wire-report
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the codec's tests, on the host
        run: |
          set -o pipefail
          mkdir -p "$REPORT"
          swift test --package-path ios/HarnessWire 2>&1 | tee "$REPORT/swift-test.log"
      - name: the codec's mutants, each against its one killer
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys

          package = pathlib.Path("ios/HarnessWire")
          rows = json.loads((package / "swift-mutants.json").read_text())["mutants"]
          report = pathlib.Path(os.environ["REPORT"])
          print(f"examined {len(rows)} mutant row(s)")
          if not rows:
              sys.exit("examined 0 mutant rows: nothing was judged")

          def run(killer):
              """The killer alone: cases started, cases failed, the outermost count, the exit."""
              selector = "^" + re.escape(killer) + "$"
              done = subprocess.run(
                  ["swift", "test", "--package-path", str(package), "--filter", selector],
                  capture_output=True, text=True)
              out = done.stdout + done.stderr
              started = len(re.findall(r"^Test Case '.*' started\.$", out, re.M))
              failed = len(re.findall(r"^Test Case '.*' failed \(", out, re.M))
              executed = re.findall(r"Executed (\d+) tests?, with", out)
              return started, failed, (executed[-1] if executed else "none"), done.returncode

          lines = ["| id | verdict | why |", "|---|---|---|"]
          bad = 0
          baseline = {}
          for killer in sorted({row["killer"] for row in rows}):
              started, failed, executed, code = run(killer)
              baseline[killer] = started == 1 and failed == 0 and executed == "1" and code == 0
              print(f"unmutated {killer}: {started} started, {failed} failed, "
                    f"Executed {executed}, exit {code}")
          for row in rows:
              path = package / row["file"]
              original = path.read_bytes()
              digest = hashlib.sha256(original).hexdigest()
              text = original.decode()
              if not baseline[row["killer"]]:
                  verdict = "VOID: its killer is not green on one test unmutated"
              elif text.count(row["find"]) != 1:
                  verdict = f"VOID: its find occurs {text.count(row['find'])} times"
              else:
                  try:
                      path.write_text(text.replace(row["find"], row["replace"], 1))
                      started, failed, executed, code = run(row["killer"])
                  finally:
                      path.write_bytes(original)
                  if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                      verdict = "VOID: the file was not restored byte for byte"
                  elif started == 1 and failed == 1 and code != 0:
                      verdict = "KILLED"
                  elif started == 1 and failed == 0 and code == 0:
                      verdict = "SURVIVED"
                  else:
                      verdict = (f"VOID: {started} started, {failed} failed, "
                                 f"exit {code}, so the killer did not judge it")
              bad += verdict != "KILLED"
              print(f"{row['id']}: {verdict}")
              lines.append(f"| {row['id']} | {verdict} | {row['why']} |")
          lines.append("")
          lines.append(f"{len(rows) - bad} of {len(rows)} killed; {bad} survived or void")
          (report / "sweep.md").write_text("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          sys.exit(1 if bad else 0)
          PY
      - name: upload the codec's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-wire
          path: harness-wire-report/
          if-no-files-found: warn

  card-isolation:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REPORT: ${{ github.workspace }}/card-isolation-report
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the card view's gate and rule list, on the host
        run: |
          set -o pipefail
          mkdir -p "$REPORT"
          swift test --package-path ios/CardIsolation 2>&1 | tee "$REPORT/swift-test.log"
      - name: the card view's mutants, each against its one killer
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys

          package = pathlib.Path("ios/CardIsolation")
          rows = json.loads((package / "swift-mutants.json").read_text())["mutants"]
          report = pathlib.Path(os.environ["REPORT"])
          print(f"examined {len(rows)} mutant row(s)")
          if not rows:
              sys.exit("examined 0 mutant rows: nothing was judged")

          def run(killer):
              """The killer alone: cases started, cases failed, the outermost count, the exit."""
              selector = "^" + re.escape(killer) + "$"
              done = subprocess.run(
                  ["swift", "test", "--package-path", str(package), "--filter", selector],
                  capture_output=True, text=True)
              out = done.stdout + done.stderr
              started = len(re.findall(r"^Test Case '.*' started\.$", out, re.M))
              failed = len(re.findall(r"^Test Case '.*' failed \(", out, re.M))
              executed = re.findall(r"Executed (\d+) tests?, with", out)
              return started, failed, (executed[-1] if executed else "none"), done.returncode

          lines = ["| id | verdict | why |", "|---|---|---|"]
          bad = 0
          baseline = {}
          for killer in sorted({row["killer"] for row in rows}):
              started, failed, executed, code = run(killer)
              baseline[killer] = started == 1 and failed == 0 and executed == "1" and code == 0
              print(f"unmutated {killer}: {started} started, {failed} failed, "
                    f"Executed {executed}, exit {code}")
          for row in rows:
              path = package / row["file"]
              original = path.read_bytes()
              digest = hashlib.sha256(original).hexdigest()
              text = original.decode()
              if not baseline[row["killer"]]:
                  verdict = "VOID: its killer is not green on one test unmutated"
              elif text.count(row["find"]) != 1:
                  verdict = f"VOID: its find occurs {text.count(row['find'])} times"
              else:
                  try:
                      path.write_text(text.replace(row["find"], row["replace"], 1))
                      started, failed, executed, code = run(row["killer"])
                  finally:
                      path.write_bytes(original)
                  if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                      verdict = "VOID: the file was not restored byte for byte"
                  elif started == 1 and failed == 1 and code != 0:
                      verdict = "KILLED"
                  elif started == 1 and failed == 0 and code == 0:
                      verdict = "SURVIVED"
                  else:
                      verdict = (f"VOID: {started} started, {failed} failed, "
                                 f"exit {code}, so the killer did not judge it")
              bad += verdict != "KILLED"
              print(f"{row['id']}: {verdict}")
              lines.append(f"| {row['id']} | {verdict} | {row['why']} |")
          lines.append("")
          lines.append(f"{len(rows) - bad} of {len(rows)} killed; {bad} survived or void")
          (report / "sweep.md").write_text("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          sys.exit(1 if bad else 0)
          PY
      - name: upload the card view's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: card-isolation
          path: card-isolation-report/
          if-no-files-found: warn

  harness:
    needs: xcframework
    runs-on: macos-26
    timeout-minutes: 150
    env:
      REPORT: ${{ github.workspace }}/harness-report
      RESULTS: ${{ github.workspace }}/harness-results
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # One iPhone and one iPad the runner image holds, on the default Xcode's simulator runtime.
      IPHONE_SIM: "iPhone 17"
      IPAD_SIM: "iPad (A16)"
      SIM_OS: "26.5"
      # The project generator, pinned by its release and the digest of its archive.
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_DIGEST: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: this run's XCFramework, bindings and synthetic collection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcframework
          path: engine-artifact
      - name: place the framework, the bindings and the collection
        run: |
          mkdir -p "$REPORT" "$RESULTS" ios/EnginePackage/Sources/DeckStreakFFI ios/Harness/Resources
          cp -R engine-artifact/DeckStreakFFI.xcframework ios/EnginePackage/
          cp engine-artifact/bindings/deck_streak_ffi.swift ios/EnginePackage/Sources/DeckStreakFFI/
          cp engine-artifact/harness-fixture/collection.anki2 ios/Harness/Resources/
      - name: the app icon, written
        run: |
          python3 scripts/ios_icon.py write ios/Harness/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: XcodeGen, checksum-verified
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_DIGEST  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
      - name: the project, generated
        run: |
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: the iPhone simulator, booted
        run: |
          # The first simulator of the first test step, booted and waited for in a step of its own,
          # so its boot is timed apart from the tests (SPEC-382 R4, ADR-395). The one available
          # device of the pinned name and OS, or the step fails; the iPad boots in its test steps.
          started=$(date +%s)
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          name, version = os.environ["IPHONE_SIM"], os.environ["SIM_OS"]
          runtime = "SimRuntime.iOS-" + version.replace(".", "-")
          found = [
              device["udid"]
              for key, devices in json.load(sys.stdin)["devices"].items()
              if key.endswith(runtime)
              for device in devices
              if device.get("name") == name
          ]
          if len(found) != 1:
              sys.exit(f"{len(found)} available devices named {name} on iOS {version}, not one")
          print(found[0])
          ')
          xcrun simctl bootstatus "$udid" -b
          echo "$(( $(date +%s) - started ))" > "$REPORT/boot-seconds"
      - name: the tests, Debug, on the iPhone and then the iPad
        run: |
          started=$(date +%s)
          # The measurement class runs in the Release step alone, where its figures are read.
          xcodebuild test -project ios/Harness.xcodeproj -scheme Harness -configuration Debug \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -skip-testing:HarnessUITests/HarnessMeasureTests \
            -derivedDataPath "$RUNNER_TEMP/debug" \
            -resultBundlePath "$RESULTS/debug.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          echo "$(( $(date +%s) - started ))" > "$REPORT/debug-seconds"
      - name: the card view's planted suite, Debug, on the iPhone and then the iPad
        run: |
          # SPEC-349 A3 and A5 to A8: every planted card reaches from the reference view and
          # nothing from the card view the factory ships, on both simulators.
          started=$(date +%s)
          xcodebuild test -project ios/Harness.xcodeproj -scheme CardProbe -configuration Debug \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -derivedDataPath "$RUNNER_TEMP/debug" \
            -resultBundlePath "$RESULTS/card-probe.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          echo "$(( $(date +%s) - started ))" > "$REPORT/card-probe-seconds"
      - name: the measurements, Release, on the iPhone and then the iPad
        run: |
          started=$(date +%s)
          xcodebuild test -project ios/Harness.xcodeproj -scheme Harness -configuration Release \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -only-testing:HarnessUITests/HarnessMeasureTests \
            -derivedDataPath "$RUNNER_TEMP/release" \
            -resultBundlePath "$RESULTS/release.xcresult" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
          echo "$(( $(date +%s) - started ))" > "$REPORT/release-seconds"
      - name: the Release app, built alone
        run: |
          # A test build copies the unit test bundle and XCTest's frameworks into the app it hosts,
          # so the size and the imports are read from an app built with no test action.
          xcodebuild build -project ios/Harness.xcodeproj -scheme Harness -configuration Release \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -derivedDataPath "$RUNNER_TEMP/release-app" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO
      - name: the Release app's size
        run: |
          app="$RUNNER_TEMP/release-app/Build/Products/Release-iphonesimulator/Harness.app"
          find "$app" -type f -exec stat -f %z {} + | awk '{ total += $1 } END { print total }' > "$REPORT/app-bytes"
          stat -f %z "$app/Harness" > "$REPORT/executable-bytes"
          cat "$REPORT/app-bytes" "$REPORT/executable-bytes"
      - name: the required-reason symbols the Release executable imports, against the manifest
        run: |
          nm -u "$RUNNER_TEMP/release-app/Build/Products/Release-iphonesimulator/Harness.app/Harness" > "$REPORT/imports"
          python3 - <<'PY'
          import os, pathlib, plistlib
          report = pathlib.Path(os.environ["REPORT"])
          # Apple's required-reason APIs a C import names, by category.
          categories = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": {
                  "_stat", "_fstat", "_fstatat", "_lstat", "_getattrlist", "_getattrlistbulk",
                  "_fgetattrlist", "_getattrlistat",
              },
              "NSPrivacyAccessedAPICategorySystemBootTime": {"_mach_absolute_time"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"_statfs", "_statvfs", "_fstatfs", "_fstatvfs"},
              "NSPrivacyAccessedAPICategoryUserDefaults": {"_OBJC_CLASS_$_NSUserDefaults"},
          }
          imported = {line.strip() for line in (report / "imports").read_text().splitlines()}
          used = {name: sorted(symbols & imported) for name, symbols in categories.items()}
          used = {name: symbols for name, symbols in used.items() if symbols}
          manifest = plistlib.loads(pathlib.Path("ios/Harness/PrivacyInfo.xcprivacy").read_bytes())
          declared = {entry["NSPrivacyAccessedAPIType"] for entry in manifest["NSPrivacyAccessedAPITypes"]}
          lines = [f"used {name}: {', '.join(symbols)}" for name, symbols in sorted(used.items())]
          lines += [f"declared {name}" for name in sorted(declared)]
          undeclared = sorted(set(used) - declared)
          lines += [f"UNDECLARED {name}" for name in undeclared]
          lines += [f"declared and not imported {name}" for name in sorted(declared - set(used))]
          (report / "symbols").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(1 if undeclared else 0)
          PY
      - name: the app's tests, Debug, on the iPhone and then the iPad
        # Signed ad hoc on its command line, because a simulator refuses an unsigned test host the
        # Keychain (SPEC-347 section 6). Never a team; the archive below stays unsigned.
        id: app-tests
        run: |
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/app.yml
          started=$(date +%s)
          xcodebuild test -project ios/DeckStreak.xcodeproj -scheme DeckStreak -configuration Debug \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -skip-testing:DeckStreakTests/ReviewModelTests \
            -skip-testing:DeckStreakTests/ReviewSessionTests \
            -skip-testing:DeckStreakUITests/ReviewFlowTests \
            -skip-testing:DeckStreakUITests/ReviewActionsFlowTests \
            -derivedDataPath "$RUNNER_TEMP/app-debug" \
            -resultBundlePath "$RESULTS/app.xcresult" \
            CODE_SIGN_IDENTITY=-
          echo "$(( $(date +%s) - started ))" > "$REPORT/app-seconds"
      - name: the review screen's tests, Debug, on the iPhone and then the iPad
        # The review screen's three classes, which the app's step skips, over its derived data and
        # with the review fixture named to the test runner on the command line alone (SPEC-348
        # R20, ADR-359 D8). Run after a red app step too, as the archive is.
        id: review-tests
        if: ${{ !cancelled() && steps.app-tests.outcome != 'skipped' }}
        run: |
          cp -R engine-artifact/review-fixture "$RUNNER_TEMP/review-fixture"
          started=$(date +%s)
          TEST_RUNNER_DS_REVIEW_FIXTURE="$RUNNER_TEMP/review-fixture" xcodebuild test -project ios/DeckStreak.xcodeproj -scheme DeckStreak -configuration Debug \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -only-testing:DeckStreakTests/ReviewModelTests \
            -only-testing:DeckStreakTests/ReviewSessionTests \
            -only-testing:DeckStreakUITests/ReviewFlowTests \
            -derivedDataPath "$RUNNER_TEMP/app-debug" \
            -resultBundlePath "$RESULTS/review.xcresult" \
            CODE_SIGN_IDENTITY=-
          echo "$(( $(date +%s) - started ))" > "$REPORT/review-seconds"
      - name: the bury and flag tests, Debug, on the iPhone and then the iPad
        # The review's bury and flag class, which the app's step skips, over its derived data and
        # with a copy of the review fixture of its own named to the test runner on the command
        # line alone (SPEC-358 R8). Run after a red app step too, as the review screen's step is.
        id: review-actions-tests
        if: ${{ !cancelled() && steps.app-tests.outcome != 'skipped' }}
        run: |
          cp -R engine-artifact/review-fixture "$RUNNER_TEMP/review-actions-fixture"
          started=$(date +%s)
          TEST_RUNNER_DS_REVIEW_FIXTURE="$RUNNER_TEMP/review-actions-fixture" xcodebuild test -project ios/DeckStreak.xcodeproj -scheme DeckStreak -configuration Debug \
            -showBuildTimingSummary \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -only-testing:DeckStreakUITests/ReviewActionsFlowTests \
            -derivedDataPath "$RUNNER_TEMP/app-debug" \
            -resultBundlePath "$RESULTS/review-actions.xcresult" \
            CODE_SIGN_IDENTITY=-
          echo "$(( $(date +%s) - started ))" > "$REPORT/review-actions-seconds"
      - name: the app, archived unsigned for a device
        # Read after a red test step too, so the archive and its imports are measured at every
        # run (SPEC-347 A15); a cancelled run, or a test step that never ran, skips it.
        if: ${{ !cancelled() && steps.app-tests.outcome != 'skipped' }}
        run: |
          xcodebuild archive -project ios/DeckStreak.xcodeproj -scheme DeckStreak \
            -showBuildTimingSummary \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/DeckStreak.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
          nm -u "$RUNNER_TEMP/DeckStreak.xcarchive/Products/Applications/DeckStreak.app/DeckStreak" > "$REPORT/app-imports"
          python3 - <<'PY'
          import os, pathlib, plistlib
          report = pathlib.Path(os.environ["REPORT"])
          # Apple's required-reason APIs a C import names, by category: the harness's table.
          categories = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": {
                  "_stat", "_fstat", "_fstatat", "_lstat", "_getattrlist", "_getattrlistbulk",
                  "_fgetattrlist", "_getattrlistat",
              },
              "NSPrivacyAccessedAPICategorySystemBootTime": {"_mach_absolute_time"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"_statfs", "_statvfs", "_fstatfs", "_fstatvfs"},
              "NSPrivacyAccessedAPICategoryUserDefaults": {"_OBJC_CLASS_$_NSUserDefaults"},
          }
          imported = {line.strip() for line in (report / "app-imports").read_text().splitlines()}
          used = {name: sorted(symbols & imported) for name, symbols in categories.items()}
          used = {name: symbols for name, symbols in used.items() if symbols}
          manifest = plistlib.loads(pathlib.Path("ios/App/PrivacyInfo.xcprivacy").read_bytes())
          declared = {entry["NSPrivacyAccessedAPIType"] for entry in manifest["NSPrivacyAccessedAPITypes"]}
          lines = [f"used {name}: {', '.join(symbols)}" for name, symbols in sorted(used.items())]
          lines += [f"declared {name}" for name in sorted(declared)]
          undeclared = sorted(set(used) - declared)
          lines += [f"UNDECLARED {name}" for name in undeclared]
          lines += [f"declared and not imported {name}" for name in sorted(declared - set(used))]
          (report / "app-symbols").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(1 if undeclared else 0)
          PY
      - name: the report
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, statistics, subprocess
          report = pathlib.Path(os.environ["REPORT"])
          results = pathlib.Path(os.environ["RESULTS"])
          report.mkdir(parents=True, exist_ok=True)
          simulators = [os.environ["IPHONE_SIM"], os.environ["IPAD_SIM"]]
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          def minutes(name):
              seconds = read(name)
              return f"{int(seconds) / 60:.1f} minutes" if seconds else "not measured"
          def tool(*arguments):
              done = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", *arguments],
                                    capture_output=True, text=True)
              return json.loads(done.stdout) if done.returncode == 0 and done.stdout.strip() else None
          def cases_in(label):
              """Every test case one bundle holds, each case's details written beside the report."""
              bundle = results / f"{label}.xcresult"
              tests = tool("tests", "--path", str(bundle)) if bundle.exists() else None
              if tests is None:
                  return []
              (report / f"{label}-tests.json").write_text(json.dumps(tests, indent=1))
              cases = []
              def walk(node):
                  if node.get("nodeType") == "Test Case":
                      cases.append(node)
                  for child in node.get("children", []):
                      walk(child)
              for node in tests.get("testNodes", []):
                  walk(node)
              for case in cases:
                  details = tool("test-details", "--test-id", case.get("nodeIdentifier", ""),
                                 "--path", str(bundle))
                  if details is not None:
                      name = case.get("nodeIdentifier", "").replace("/", "-")
                      (report / f"details-{label}-{name}.json").write_text(json.dumps(details, indent=1))
              return cases
          def per_simulator(case):
              """A case's result on each simulator it ran on, or its one result."""
              devices = [child for child in case.get("children", []) if child.get("nodeType") == "Device"]
              if not devices:
                  return str(case.get("result"))
              return "; ".join(f"{device.get('name')}: {device.get('result')}" for device in devices)
          def measured(node, device=None):
              """(simulator, metric, unit, values) for every metric a bundle holds, read without
              trusting one schema: a `device` names the simulator its subtree ran on."""
              if isinstance(node, list):
                  for item in node:
                      yield from measured(item, device)
              elif isinstance(node, dict):
                  if isinstance(node.get("device"), dict):
                      device = node["device"].get("deviceName", device)
                  values = node.get("measurements")
                  if isinstance(values, list) and values and all(
                          isinstance(value, (int, float)) for value in values):
                      name = " ".join(str(node.get(key, "")) for key in ("displayName", "identifier"))
                      yield device, name.strip(), node.get("unitOfMeasurement", ""), values
                  for key, value in node.items():
                      if key != "measurements":
                          yield from measured(value, device)
          debug_cases = cases_in("debug")
          release_cases = cases_in("release")
          app_cases = cases_in("app")
          review_cases = cases_in("review")
          review_actions_cases = cases_in("review-actions")
          card_probe_cases = cases_in("card-probe")
          release = results / "release.xcresult"
          metrics = tool("metrics", "--path", str(release)) if release.exists() else None
          found = []
          if metrics is not None:
              (report / "release-metrics.json").write_text(json.dumps(metrics, indent=1))
              found = list(measured(metrics))
          # Section 7's figures: a launch takes the median of its passes, memory the largest.
          figures = [
              ("M1 launch to first responsive frame, median", statistics.median,
               lambda name: "applaunch" in name.lower() or "applicationlaunch" in name.lower()),
              ("M1 open to deck list (signpost), median", statistics.median,
               lambda name: "open-to-deck-list" in name),
              ("M2 peak physical memory, largest", max,
               lambda name: "memory" in name.lower() and "peak" in name.lower()),
          ]
          rows = [
              ("the iPhone simulator, booted", minutes("boot-seconds")),
              ("tests, Debug, both simulators", minutes("debug-seconds")),
              ("card view's planted suite, Debug, both simulators", minutes("card-probe-seconds")),
              ("measurements, Release, both simulators", minutes("release-seconds")),
              ("Release app bytes", read("app-bytes") or "not measured"),
              ("Release executable bytes", read("executable-bytes") or "not measured"),
              ("app's tests, Debug, both simulators", minutes("app-seconds")),
              ("review screen's tests, Debug, both simulators", minutes("review-seconds")),
              ("bury and flag tests, Debug, both simulators", minutes("review-actions-seconds")),
          ]
          for simulator in simulators:
              for label, pick, wanted in figures:
                  hits = [(unit, values) for device, name, unit, values in found
                          if device and (simulator in device or device in simulator) and wanted(name)]
                  value = "not measured"
                  if hits:
                      unit, values = hits[0]
                      value = f"{pick(values):g} {unit} (of {len(values)} passes)"
                  rows.append((f"{label}, {simulator}", value))
          lines = [
              "`xcframework.yml`'s `harness` job:",
              "",
              "| measure | measured |",
              "|---|---|",
          ] + [f"| {name} | {value} |" for name, value in rows]
          lines += ["", "| test | result |", "|---|---|"]
          for label, cases in (
              ("Debug", debug_cases), ("Release", release_cases), ("App", app_cases),
              ("Review", review_cases),
              ("Review actions", review_actions_cases),
              ("Card probe", card_probe_cases),
          ):
              lines += [f"| {label} `{c.get('nodeIdentifier')}` | {per_simulator(c)} |" for c in cases]
              if not cases:
                  lines.append(f"| {label}: no test result was read | not measured |")
          if found:
              lines += ["", "| simulator | metric | unit | passes |", "|---|---|---|---|"]
              lines += [f"| {device} | {name} | {unit} | {', '.join(f'{value:g}' for value in values)} |"
                        for device, name, unit, values in found]
          symbols = read("symbols")
          if symbols:
              lines += ["", "Required-reason imports against the privacy manifest:", "", "```", symbols, "```"]
          app_symbols = read("app-symbols")
          if app_symbols:
              lines += ["", "The app's required-reason imports against its privacy manifest:", "", "```",
                        app_symbols, "```"]
          text = "\n".join(lines) + "\n"
          (report / "report.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Swift harness (SPEC-339)\n\n" + text)
          print(text)
          PY
      - name: upload the report and the result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness
          path: |
            harness-report/
            harness-results/
          if-no-files-found: warn
      - name: the timing record
        # The job's own timing, written and uploaded whatever the outcome (SPEC-382 R6, ADR-393):
        # every seconds file a step wrote, each test's duration on each simulator, and the toolchain.
        if: ${{ always() }}
        run: |
          mkdir -p "$REPORT"
          xcodebuild -version > "$REPORT/xcode-version"
          sw_vers > "$REPORT/os-version"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          report = pathlib.Path(os.environ["REPORT"])
          results = pathlib.Path(os.environ["RESULTS"])
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          def details(label, identifier):
              """A test's details as the report read them from its result bundle, or read here."""
              copy = report / f"details-{label}-{identifier.replace('/', '-')}.json"
              if copy.is_file():
                  return json.loads(copy.read_text())
              done = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "test-details",
                                     "--test-id", identifier, "--path", str(results / f"{label}.xcresult")],
                                    capture_output=True, text=True)
              return json.loads(done.stdout) if done.returncode == 0 and done.stdout.strip() else {}
          def cases(node, found):
              if node.get("nodeType") == "Test Case":
                  found.append(node.get("nodeIdentifier", ""))
              for child in node.get("children", []):
                  cases(child, found)
              return found
          def destinations(node, found):
              """Each simulator's run of a test and its seconds, read without trusting one schema."""
              if isinstance(node, list):
                  for item in node:
                      destinations(item, found)
              elif isinstance(node, dict):
                  if node.get("nodeType") == "Device":
                      found.append({"destination": node.get("name"),
                                    "seconds": node.get("durationInSeconds")})
                  for value in node.values():
                      destinations(value, found)
              return found
          tests = []
          for listing in sorted(report.glob("*-tests.json")):
              if listing.name.startswith("details-"):
                  continue
              label = listing.name[: -len("-tests.json")]
              found = []
              for node in json.loads(listing.read_text()).get("testNodes", []):
                  cases(node, found)
              for identifier in found:
                  test = details(label, identifier)
                  tests.append({"bundle": label, "test": identifier,
                                "seconds": test.get("durationInSeconds"),
                                "destinations": destinations(test.get("testRuns", []), [])})
          seconds = {}
          for path in sorted(report.glob("*-seconds*")):
              if "." not in path.name:
                  value = path.read_text().strip()
                  seconds[path.name] = int(value) if value.isdigit() else None
          record = {"schema": "ci-timing/1", "job": "harness", "seconds": seconds, "tests": tests,
                    "toolchain": {"xcode": read("xcode-version"), "os": read("os-version")}}
          (report / "timing.json").write_text(json.dumps(record, indent=1) + "\n")
          print(json.dumps({"seconds": seconds, "tests": len(tests)}, indent=1))
          PY
      - name: upload the timing record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing-harness
          path: harness-report/timing.json
          if-no-files-found: warn
