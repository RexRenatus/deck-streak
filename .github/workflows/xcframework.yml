name: xcframework

# The FFI adapter as an XCFramework for an iPhone and an iPad (SPEC-336 R6 to R9, ADR-345 D3 and
# D4): the adapter's static library for a device (aarch64-apple-ios) and for the simulator on Apple
# silicon (aarch64-apple-ios-sim), the Swift bindings generated in library mode by the generator the
# adapter itself builds, a check that the generated modulemap names no builtin clang module, one
# XCFramework holding both slices, and a consumer check that typechecks the generated Swift against
# each slice's own headers. It publishes the build time, each slice's size and both checks as the
# run's summary and as the `xcframework` artifact, beside the framework and the bindings. It runs on
# a pull request into dev that changes the adapter, the lockfile or this workflow, and on a
# dispatch. No secret is used, the token is read-only, and every action is pinned by its full
# commit SHA.
#
# The Swift harness (SPEC-339 R11, R12, ADR-350): the `xcframework` job also writes the synthetic
# collection with this commit's engine; `harness-wire` runs the codec's tests on the host; and
# `harness` links the framework, the bindings and the collection of THIS run into the app, runs its
# tests on one iPhone and one iPad simulator, measures, and uploads its report and result bundles.
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
    paths:
      - "crates/ffi/**"
      - "Cargo.lock"
      - ".github/workflows/xcframework.yml"
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs share its ref's group, and a newer push to it cancels the run it supersedes
# (SPEC-190). Any other event has a group of its own, its run id, so it is never cancelled.
concurrency:
  group: xcframework-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xcframework:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      REPORT: ${{ github.workspace }}/xcframework-report
      # The protobuf compiler the engine's build needs: the version ADR-022 pins, and the macOS
      # archive and digest Anki's own build pins for it (build/ninja_gen/src/protobuf.rs at the
      # engine's tag).
      PROTOC_VERSION: "31.1"
      PROTOC_MACOS_DIGEST: 99ea004549c139f46da5638187a85bbe422d78939be0fa01af1aa8ab672e395f
      # The lowest iOS the consumer check typechecks the bindings for.
      IOS_DEPLOYMENT: "17.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the pinned Rust toolchain and its two iOS targets, before the clock starts
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: protoc, checksum-verified
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-universal_binary.zip"
          echo "$PROTOC_MACOS_DIGEST  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
      - name: the two static libraries, clocked from the first compile to the second archive
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          mkdir -p "$REPORT"
          sysctl -n hw.ncpu > "$REPORT/runner-cpus"
          started=$(date +%s)
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo rustc --locked --release -p deck-streak-ffi --lib --crate-type staticlib --target "$target"
          done
          echo "$(( $(date +%s) - started ))" > "$REPORT/build-seconds"
      - name: the Swift bindings, in library mode over the device library
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          started=$(date +%s)
          cargo run --locked -p deck-streak-ffi --features bindgen --bin uniffi-bindgen-swift -- \
            target/aarch64-apple-ios/release/libdeck_streak_ffi.a bindings \
            --swift-sources --headers --modulemap \
            --module-name deck_streak_ffiFFI --modulemap-filename module.modulemap
          echo "$(( $(date +%s) - started ))" > "$REPORT/bindgen-seconds"
          ls bindings
      - name: the modulemap check, which a builtin clang module refuses
        run: |
          cp bindings/module.modulemap "$REPORT/module.modulemap"
          if grep -n '_Builtin_' bindings/module.modulemap; then
            echo fail > "$REPORT/modulemap"
            exit 1
          fi
          echo pass > "$REPORT/modulemap"
      - name: the XCFramework, device and simulator slices
        run: |
          mkdir -p headers
          cp bindings/deck_streak_ffiFFI.h bindings/module.modulemap headers/
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libdeck_streak_ffi.a -headers headers \
            -library target/aarch64-apple-ios-sim/release/libdeck_streak_ffi.a -headers headers \
            -output DeckStreakFFI.xcframework
          find DeckStreakFFI.xcframework -name '*.a' -exec stat -f '%N %z' {} \; | tee "$REPORT/slices"
      - name: the consumer check, the generated Swift typechecked against each slice's headers
        run: |
          echo fail > "$REPORT/consumer"
          for slice in ios-arm64:iphoneos: ios-arm64-simulator:iphonesimulator:-simulator; do
            IFS=: read -r dir sdk suffix <<< "$slice"
            target="arm64-apple-ios${IOS_DEPLOYMENT}${suffix}"
            xcrun --sdk "$sdk" swiftc -typecheck -target "$target" \
              -I "DeckStreakFFI.xcframework/$dir/Headers" bindings/deck_streak_ffi.swift
            echo "$dir typechecks"
          done
          echo pass > "$REPORT/consumer"
      - name: the harness's synthetic collection, written by this commit's engine
        run: |
          export PROTOC="$RUNNER_TEMP/protoc/bin/protoc"
          started=$(date +%s)
          cargo run --locked -p deck-streak-ffi --example harness-fixture -- harness-fixture
          echo "$(( $(date +%s) - started ))" > "$REPORT/fixture-seconds"
          ls -l harness-fixture
      - name: the report
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          report = pathlib.Path(os.environ["REPORT"])
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          def minutes(name):
              seconds = read(name)
              return f"{int(seconds) / 60:.1f} minutes" if seconds else "not measured"
          rows = [
              ("two static libraries, release", minutes("build-seconds")),
              ("Swift bindings, library mode", minutes("bindgen-seconds")),
              ("modulemap names no builtin clang module", read("modulemap") or "not measured"),
              ("generated Swift typechecks against each slice", read("consumer") or "not measured"),
              ("the harness's synthetic collection, host build", minutes("fixture-seconds")),
          ]
          for line in read("slices").splitlines():
              path, size = line.rsplit(" ", 1)
              rows.append((f"slice `{path.split('/')[1]}`", f"{int(size) / 1048576:.1f} MiB"))
          lines = [
              f"`xcframework.yml` on a GitHub-hosted runner with {read('runner-cpus')} CPUs:",
              "",
              "| measure | measured |",
              "|---|---|",
          ] + [f"| {name} | {value} |" for name, value in rows]
          text = "\n".join(lines) + "\n"
          (report / "report.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## XCFramework (SPEC-336)\n\n" + text)
          print(text)
          PY
      - name: upload the XCFramework, the bindings and the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework
          path: |
            DeckStreakFFI.xcframework/
            bindings/
            xcframework-report/
            harness-fixture/
          if-no-files-found: warn

  harness-wire:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      REPORT: ${{ github.workspace }}/harness-wire-report
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the codec's tests, on the host
        run: |
          set -o pipefail
          mkdir -p "$REPORT"
          swift test --package-path ios/HarnessWire 2>&1 | tee "$REPORT/swift-test.log"
      - name: upload the codec's report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-wire
          path: harness-wire-report/
          if-no-files-found: warn

  harness:
    needs: xcframework
    runs-on: macos-26
    timeout-minutes: 90
    env:
      REPORT: ${{ github.workspace }}/harness-report
      RESULTS: ${{ github.workspace }}/harness-results
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # One iPhone and one iPad the runner image holds, on the default Xcode's simulator runtime.
      IPHONE_SIM: "iPhone 17"
      IPAD_SIM: "iPad (A16)"
      SIM_OS: "26.5"
      # The project generator, pinned by its release and the digest of its archive.
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_DIGEST: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: this run's XCFramework, bindings and synthetic collection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xcframework
          path: engine-artifact
      - name: place the framework, the bindings and the collection
        run: |
          mkdir -p "$REPORT" "$RESULTS" ios/EnginePackage/Sources/DeckStreakFFI ios/Harness/Resources
          cp -R engine-artifact/DeckStreakFFI.xcframework ios/EnginePackage/
          cp engine-artifact/bindings/deck_streak_ffi.swift ios/EnginePackage/Sources/DeckStreakFFI/
          cp engine-artifact/harness-fixture/collection.anki2 ios/Harness/Resources/
      - name: XcodeGen, checksum-verified
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_DIGEST  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
      - name: the project, generated
        run: |
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec ios/project.yml
      - name: the tests, Debug, on the iPhone and then the iPad
        run: |
          started=$(date +%s)
          xcodebuild test -project ios/Harness.xcodeproj -scheme Harness -configuration Debug \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -destination "platform=iOS Simulator,name=$IPAD_SIM,OS=$SIM_OS" \
            -disable-concurrent-destination-testing \
            -derivedDataPath "$RUNNER_TEMP/debug" \
            -resultBundlePath "$RESULTS/debug.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          echo "$(( $(date +%s) - started ))" > "$REPORT/debug-seconds"
      - name: the app, Release, for the simulator
        run: |
          started=$(date +%s)
          xcodebuild build -project ios/Harness.xcodeproj -scheme Harness -configuration Release \
            -destination "platform=iOS Simulator,name=$IPHONE_SIM,OS=$SIM_OS" \
            -derivedDataPath "$RUNNER_TEMP/release" \
            CODE_SIGNING_ALLOWED=NO
          echo "$(( $(date +%s) - started ))" > "$REPORT/release-seconds"
      - name: the Release app's size
        run: |
          app="$RUNNER_TEMP/release/Build/Products/Release-iphonesimulator/Harness.app"
          find "$app" -type f -exec stat -f %z {} + | awk '{ total += $1 } END { print total }' > "$REPORT/app-bytes"
          stat -f %z "$app/Harness" > "$REPORT/executable-bytes"
          cat "$REPORT/app-bytes" "$REPORT/executable-bytes"
      - name: the required-reason symbols the Release executable imports, against the manifest
        run: |
          nm -u "$RUNNER_TEMP/release/Build/Products/Release-iphonesimulator/Harness.app/Harness" > "$REPORT/imports"
          python3 - <<'PY'
          import os, pathlib, plistlib
          report = pathlib.Path(os.environ["REPORT"])
          # Apple's required-reason APIs a C import names, by category.
          categories = {
              "NSPrivacyAccessedAPICategoryFileTimestamp": {
                  "_stat", "_fstat", "_fstatat", "_lstat", "_getattrlist", "_getattrlistbulk",
                  "_fgetattrlist", "_getattrlistat",
              },
              "NSPrivacyAccessedAPICategorySystemBootTime": {"_mach_absolute_time"},
              "NSPrivacyAccessedAPICategoryDiskSpace": {"_statfs", "_statvfs", "_fstatfs", "_fstatvfs"},
              "NSPrivacyAccessedAPICategoryUserDefaults": {"_OBJC_CLASS_$_NSUserDefaults"},
          }
          imported = {line.strip() for line in (report / "imports").read_text().splitlines()}
          used = {name: sorted(symbols & imported) for name, symbols in categories.items()}
          used = {name: symbols for name, symbols in used.items() if symbols}
          manifest = plistlib.loads(pathlib.Path("ios/Harness/PrivacyInfo.xcprivacy").read_bytes())
          declared = {entry["NSPrivacyAccessedAPIType"] for entry in manifest["NSPrivacyAccessedAPITypes"]}
          lines = [f"used {name}: {', '.join(symbols)}" for name, symbols in sorted(used.items())]
          lines += [f"declared {name}" for name in sorted(declared)]
          undeclared = sorted(set(used) - declared)
          lines += [f"UNDECLARED {name}" for name in undeclared]
          lines += [f"declared and not imported {name}" for name in sorted(declared - set(used))]
          (report / "symbols").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          raise SystemExit(1 if undeclared else 0)
          PY
      - name: the report
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          report = pathlib.Path(os.environ["REPORT"])
          results = pathlib.Path(os.environ["RESULTS"])
          report.mkdir(parents=True, exist_ok=True)
          def read(name):
              path = report / name
              return path.read_text().strip() if path.is_file() else ""
          def minutes(name):
              seconds = read(name)
              return f"{int(seconds) / 60:.1f} minutes" if seconds else "not measured"
          def tool(*arguments):
              done = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", *arguments],
                                    capture_output=True, text=True)
              return json.loads(done.stdout) if done.returncode == 0 and done.stdout.strip() else None
          rows = [
              ("tests, Debug, both simulators", minutes("debug-seconds")),
              ("the app, Release build", minutes("release-seconds")),
              ("Release app bytes", read("app-bytes") or "not measured"),
              ("Release executable bytes", read("executable-bytes") or "not measured"),
          ]
          cases = []
          bundle = results / "debug.xcresult"
          tests = tool("tests", "--path", str(bundle)) if bundle.exists() else None
          if tests is not None:
              (report / "debug-tests.json").write_text(json.dumps(tests, indent=1))
              def walk(node):
                  if node.get("nodeType") == "Test Case":
                      cases.append(node)
                  for child in node.get("children", []):
                      walk(child)
              for node in tests.get("testNodes", []):
                  walk(node)
              for case in cases:
                  details = tool("test-details", "--test-id", case.get("nodeIdentifier", ""),
                                 "--path", str(bundle))
                  if details is not None:
                      name = case.get("nodeIdentifier", "").replace("/", "-")
                      (report / f"details-{name}.json").write_text(json.dumps(details, indent=1))
          lines = [
              "`xcframework.yml`'s `harness` job:",
              "",
              "| measure | measured |",
              "|---|---|",
          ] + [f"| {name} | {value} |" for name, value in rows]
          lines += ["", "| test | result |", "|---|---|"]
          lines += [f"| `{c.get('nodeIdentifier')}` | {c.get('result')} |" for c in cases]
          if not cases:
              lines.append("| (no test result was read) | not measured |")
          symbols = read("symbols")
          if symbols:
              lines += ["", "Required-reason imports against the privacy manifest:", "", "```", symbols, "```"]
          text = "\n".join(lines) + "\n"
          (report / "report.md").write_text(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Swift harness (SPEC-339)\n\n" + text)
          print(text)
          PY
      - name: upload the report and the result bundles
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness
          path: |
            harness-report/
            harness-results/
          if-no-files-found: warn
