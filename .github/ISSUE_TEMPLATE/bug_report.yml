name: Bug report
description: Report something that does not work as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Search the existing issues first.
        Report a security problem privately, as SECURITY.md describes, and never here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web app
        - Bot
        - API
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any log lines. Remove every token and personal detail first.
      render: shell
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue you agree to follow the Code of Conduct.
      options:
        - label: I agree to follow this repository's Code of Conduct.
          required: true
