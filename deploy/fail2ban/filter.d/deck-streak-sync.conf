# The sync route's refused login (SPEC-340 R5; ADR-351 D3): one line of the edge's access log of
# the sync route (deploy/caddy/deck-streak.caddy) where the login route answered 403. The edge
# logs the path before its prefix is stripped, and the client's address it saw. The rail installs
# this filter into the host's ban service on the owner's go, beside jail.d/deck-streak-sync.conf.
[Definition]
failregex = "client_ip":"<ADDR>".*"uri":"/anki-sync/sync/hostKey".*"status":403
