# The sync route's login bound (SPEC-340 R5; ADR-351 D3): an address with five refused sync logins
# within ten minutes is banned from the web ports for one hour. It reads the edge's access log in
# the journal through filter.d/deck-streak-sync.conf. The rail installs it on the owner's go, after
# the filter is checked against one refused login (docs/runbooks/sync-server-cutover.md, started).
[deck-streak-sync]
enabled = true
filter = deck-streak-sync
backend = systemd
journalmatch = _SYSTEMD_UNIT=caddy.service
maxretry = 5
findtime = 10m
bantime = 1h
port = http,https
