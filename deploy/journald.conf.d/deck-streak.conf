# DeckStreak's journald drop-in template (SPEC-021 R6), installed as
# /etc/systemd/journald.conf.d/deck-streak.conf by the private rail; nothing in this repository
# installs it. journald keeps a line with no time limit unless MaxRetentionSec= is set, so the
# retention stays inside the logs window privacy.json declares, P14D, and PRIVACY.md tells the owner
# so. SystemMaxUse= bounds the journal's size, so a burst of lines cannot outgrow it before the time
# limit prunes them.
[Journal]
MaxRetentionSec=14day
SystemMaxUse=256M
