[package]
name = "deck-streak-ingest"
description = "DeckStreak's ingest context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ADR-022: the engine stays inside this crate, behind the AnkiEngine port (src/engine.rs).
anki.workspace = true
# SPEC-083 R6: the summary and the tariff count calendar months; the write reads the process's zone
# (ADR-083; the version Cargo.lock already pins through the engine).
chrono.workspace = true
deck-streak-kernel.workspace = true
# SPEC-083 R20 and ADR-321 D17, D20: the preview's digest over the listed card ids, and the take's
# backup checked against the working copy it was copied from.
sha2.workspace = true
# SPEC-022 section 7: the data-rights port's rows are JSON values.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# SPEC-022 section 7: the kernel's Db hands out sqlx types, and sync_runs' queries are checked into
# .sqlx/.
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

# SPEC-083 section 3: the take's tests set and remove `TZ` in their own process, which edition 2024
# makes unsafe and this workspace forbids; this one target is compiled at edition 2021, where both
# calls are safe. Every test in it holds the target's one lock and sets the zone it runs in.
[[test]]
name = "skip_write"
path = "tests/skip_write.rs"
edition = "2021"

# SPEC-083 section 3: the zero-upload test sets `TZ` in its own process for the same reason, so its
# target is compiled at edition 2021 too. Its one test holds the target's lock and sets its zone.
[[test]]
name = "skip_zero_upload"
path = "tests/skip_zero_upload.rs"
edition = "2021"

# SPEC-387 A7: the preset zero-upload test sets `TZ` in its own process for the same reason, so its
# target is compiled at edition 2021 too. Its one test holds the target's lock and sets its zone.
[[test]]
name = "preset_zero_upload"
path = "tests/preset_zero_upload.rs"
edition = "2021"

[dev-dependencies]
# ADR-029: the parity oracle's golden reader, included by path.
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util", "net", "io-util", "sync"] }
# SPEC-022 section 7: the census reads the engine's compressed request bodies.
zstd.workspace = true
