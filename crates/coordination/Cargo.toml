[package]
name = "deck-streak-coordination"
description = "DeckStreak's coordination context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-ingest.workspace = true
deck-streak-identity.workspace = true
deck-streak-analytics.workspace = true
deck-streak-progression.workspace = true
deck-streak-streaks.workspace = true
deck-streak-curriculum.workspace = true
deck-streak-economy.workspace = true
deck-streak-quests.workspace = true
deck-streak-habits.workspace = true
deck-streak-focus.workspace = true
deck-streak-discipline.workspace = true
deck-streak-markets.workspace = true
deck-streak-notifications.workspace = true
deck-streak-readings.workspace = true
deck-streak-vault.workspace = true
deck-streak-agent.workspace = true
deck-streak-insights.workspace = true
deck-streak-publishing.workspace = true
deck-streak-privacy.workspace = true
# ADR-003 through ADR-027: the cron-fire ledger's queries run through the kernel's Db, checked into
# .sqlx/, and the runner's lines go to the kernel's log.
sqlx.workspace = true
tracing.workspace = true
# SPEC-023: the sync cycle's error type, as every library's (CLAUDE.md).
thiserror.workspace = true
# SPEC-094 R9: a stored report is its envelope's JSON, read back as a value.
serde_json.workspace = true

# The parity oracle's golden reader, compiled into this crate's tests by path (ADR-029). Test
# support only: no production dependency of this context changes.
[dev-dependencies]
serde.workspace = true
# ADR-020's temporary database, and the runner's tests on tokio's runtime (SPEC-027); the change
# gate's tests run whole cycles over a temporary database and copy (SPEC-023 section 7).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
