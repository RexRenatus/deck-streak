[package]
name = "deck-streak-economy"
description = "DeckStreak's economy context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
# SPEC-082 R18: the data-rights port's rows are JSON values (ADR-029), and its queries run through
# the kernel's Db, checked into .sqlx/.
serde_json.workspace = true
sqlx.workspace = true

[dev-dependencies]
# ADR-029: the parity oracle's golden reader, compiled into the goldens test by path.
serde.workspace = true
# The goldens' floats are compared bit for bit, so the reader parses them exactly (SPEC-071 section 7).
serde_json = { workspace = true, features = ["float_roundtrip"] }
