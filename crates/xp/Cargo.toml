[package]
name = "deck-streak-xp"
description = "DeckStreak's per-review XP rule and its table from economy.json, with no I/O, for the server and both clients. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ADR-371 D4 and SPEC-360 R5: the embedded table's floats parse exactly, to the same bits in every
# graph that links the crate. The feature is on here because a client's graph has no ingest or
# progression to turn it on for it.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
# ADR-029: the parity oracle's golden reader, compiled into the crate's golden tests by path.
serde.workspace = true
