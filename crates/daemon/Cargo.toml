[package]
name = "deck-streak-daemon"
description = "DeckStreak's daemon context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The one release binary: its first argument names the role it runs (SPEC-025 R1, ADR-010).
[[bin]]
name = "deckstreakd"
path = "src/main.rs"

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-ingest.workspace = true
deck-streak-identity.workspace = true
deck-streak-analytics.workspace = true
deck-streak-progression.workspace = true
deck-streak-streaks.workspace = true
deck-streak-curriculum.workspace = true
deck-streak-economy.workspace = true
deck-streak-quests.workspace = true
deck-streak-habits.workspace = true
deck-streak-focus.workspace = true
deck-streak-discipline.workspace = true
deck-streak-markets.workspace = true
deck-streak-notifications.workspace = true
deck-streak-readings.workspace = true
deck-streak-vault.workspace = true
deck-streak-agent.workspace = true
deck-streak-insights.workspace = true
deck-streak-publishing.workspace = true
deck-streak-privacy.workspace = true
deck-streak-coordination.workspace = true
deck-streak-api.workspace = true
deck-streak-bot.workspace = true
# ADR-003: anyhow in the binary alone; the library's roles return thiserror types (SPEC-025).
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# ADR-020's temporary database and ADR-029's golden reader; SPEC-026's fake Bot API, included from
# the bot's tests by path, is an axum server on a loopback port.
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
# SPEC-072 A31: the composed router is driven in process, over a seeded collection copy.
# SPEC-128 A11 plants one trigger in the job's own database so the recompute fails after the sync.
sqlx.workspace = true
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
