[package]
name = "deck-streak-engine-core"
description = "DeckStreak's engine core: Anki's engine behind one allow-listed dispatcher both clients share. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# ADR-356 D1 and D4: the one client-side holder of the engine. It declares no feature, no
# `crate-type` and no build script, so nothing a member turns on can widen what it admits.
[dependencies]
# ADR-022 and ADR-058: Anki's engine, whose backend this crate holds privately (SPEC-345 R1).
anki.workspace = true
# ADR-348: the engine's protobuf messages and their codec, from the same fork commit.
anki_proto.workspace = true
prost.workspace = true
# ADR-029: the engine's database command is JSON; the core builds it from its own fixed reads
# (ADR-356 D7).
serde_json.workspace = true
# ADR-358 D4: the URL parser for the sync login's endpoint guard (SPEC-347 R2); the engine's own
# dependencies already bring it, so it adds no package.
url.workspace = true
# ADR-359 D1: the encoder for a face's `data:` URLs (SPEC-348 R3); the engine's own dependencies
# already bring this version, so it adds no package.
base64.workspace = true
# ADR-400 D1: the isolated FSRS-7 scheduler, the core's one workspace edge until ADR-621 D6 added
# the media core's, named by `src/replay.rs` alone and held by the graph census (SPEC-386 R7).
deck-streak-fsrs7 = { path = "../fsrs7" }
# ADR-621 D6 and D8: the media core's one reference grammar, which a face's rewrite reads.
deck-streak-media.workspace = true

[dev-dependencies]
# ADR-525 D2 (SPEC-507 A2): the analytics crate's capped seconds, its review row and its study day,
# which the card health panel's differential test compares with. Dev only: the core's own edges
# stay the engine, the scheduler and the media core (ADR-621 D6).
deck-streak-analytics.workspace = true
# ADR-621 D6 (SPEC-601 A5): the face tests' readers answer through a temporary media store.
deck-streak-collection.workspace = true
deck-streak-ingest.workspace = true
deck-streak-kernel.workspace = true
# ADR-375 (SPEC-364 section 3): the runtime that runs the engine's own sync server as a child of the
# one-way tests, on a loopback port, as the native adapter's login tests run it.
tokio = { workspace = true, features = ["rt"] }
# ADR-640 (SPEC-618 R9): the bench harness, for `benches/` alone.
divan.workspace = true
# ADR-020 and ADR-621 (SPEC-601 A5): the temporary folder each face test's media store lives in.
tempfile.workspace = true

# SPEC-618 R9: the scheduler's day queue, event check, fold and schedule step, measured
# by CodSpeed; Divan's `main` replaces the default harness.
[[bench]]
name = "scheduling"
harness = false
