[package]
name = "deck-streak-ffi"
description = "DeckStreak's FFI adapter: the engine's allow-listed backend for a native client. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ADR-356 D1 (SPEC-345 R5): the engine core, which holds Anki's engine behind its native column. This
# adapter keeps its own allow-list, checked first (ADR-356 D3), and beside the core depends on no
# crate of DeckStreak's (ADR-345 D1).
deck-streak-engine-core.workspace = true
# ADR-345 D2: the bindings generator's runtime and macros, pinned exactly.
uniffi.workspace = true

[dev-dependencies]
# ADR-022 and ADR-058: Anki's engine, for the round-trip tests' synthetic collections only
# (SPEC-345 R6).
anki.workspace = true

[features]
# ADR-345 D3: the Swift bindings generator, turned on only by the XCFramework workflow; a workspace
# build without the feature compiles none of the generator's code.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

# ADR-345 D5: the generator's binary is built by every build of the crate, so a default-feature
# test runs it (SPEC-336 R10); built without `bindgen`, it holds no generator.
[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
