[package]
name = "deck-streak-curriculum"
description = "DeckStreak's curriculum context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-ingest.workspace = true

# The parity oracle's golden reader, compiled into this crate's tests by path (ADR-029). Test
# support only.
[dev-dependencies]
serde.workspace = true
# The goldens' floats are compared bit for bit, so the reader parses them exactly: serde_json's
# default parser is best-effort and can land one unit in the last place away (SPEC-071 section 7).
serde_json = { workspace = true, features = ["float_roundtrip"] }
