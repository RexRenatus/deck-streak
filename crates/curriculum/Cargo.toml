[package]
name = "deck-streak-curriculum"
description = "DeckStreak's curriculum context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-ingest.workspace = true
# SPEC-077 R6, R18: the store's and the data-rights port's queries run through the kernel's Db,
# checked into .sqlx/, and their rows and the stored bands are JSON values (ADR-003, ADR-029).
serde_json.workspace = true
sqlx.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The store's and the port's tests: a file-backed database per test (SPEC-077 A10).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
