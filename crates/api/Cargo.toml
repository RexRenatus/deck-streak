[package]
name = "deck-streak-api"
description = "DeckStreak's api context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-identity.workspace = true
deck-streak-notifications.workspace = true
deck-streak-coordination.workspace = true
# ADR-003 and ADR-025: the HTTP adapter's stack (SPEC-025).
axum.workspace = true
# ADR-029: the handshake's JSON body and the answers' JSON (SPEC-024).
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["catch-panic", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing.workspace = true

[dev-dependencies]
# SPEC-071 A22, A23: the analytics routes' tests write synthetic rollup rows into ADR-020's temporary
# database, through the kernel's Db, which hands out sqlx types.
sqlx.workspace = true
tempfile.workspace = true
# The paused clock (test-util) drives the timeout and the bound without sleeping; io-util and net
# drive the drain over a real loopback socket.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tower = { workspace = true, features = ["util"] }
