[package]
name = "deck-streak-agent"
description = "DeckStreak's agent context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The agent depends on the kernel only (docs/CONTEXT-MAP.md, ADR-002), and on the external crates
# ADR-003 and ADR-029 admit: serde_json reads a template's frontmatter values and the private
# roster, and writes an output's frontmatter; thiserror types the refusals.
[dependencies]
deck-streak-kernel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# ADR-043: agent_runs is written through the kernel's Db, its queries checked into .sqlx/; the runner
# and the gate launch subprocesses under a time bound.
sqlx.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "macros"] }

# A temporary directory outside the repository for the roster (ADR-020), and the async runtime for
# the ports' tests (ADR-003). Test support only.
[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
