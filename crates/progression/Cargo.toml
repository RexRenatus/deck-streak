[package]
name = "deck-streak-progression"
description = "DeckStreak's progression context. See docs/CONTEXT-MAP.md."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
deck-streak-kernel.workspace = true
deck-streak-ingest.workspace = true
# SPEC-040: the data-rights port's rows are JSON values (ADR-029).
serde_json.workspace = true
# ADR-003: the XP ledger's queries run through the kernel's Db, checked into .sqlx/, and a refused
# grant source is this context's own error type, as every library's (CLAUDE.md).
sqlx.workspace = true
thiserror.workspace = true

[dev-dependencies]
# ADR-029: the parity oracle's golden reader, compiled into the level test by path.
serde.workspace = true
# The goldens' floats are compared bit for bit, so the reader parses them exactly: serde_json's
# default parser is best-effort and can land one unit in the last place away (SPEC-071 section 7).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# ADR-020's temporary database, and two concurrent grants on tokio's multi-thread runtime (A3).
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
# ADR-040: the compile-fail fixture that proves a signed amount does not compile (A6).
trybuild.workspace = true
