# The harness's Xcode project, generated in CI by a pinned, digest-checked XcodeGen and never
# committed (SPEC-339 R1, ADR-350). Build settings live in Config/Harness.xcconfig; the Info.plist
# and the privacy manifest are committed files this spec points at, never generated.
name: Harness
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Harness.xcconfig
  Release: Config/Harness.xcconfig
packages:
  EnginePackage:
    path: EnginePackage
  HarnessWire:
    path: HarnessWire
  # The card view's isolation (SPEC-349): the one factory every card web view is built by.
  CardIsolation:
    path: CardIsolation
targets:
  Harness:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Harness/Sources
      - path: Harness/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The synthetic collection CI writes with this commit's engine; git ignores it.
      - path: Harness/Resources
        buildPhase: resources
        optional: true
    dependencies:
      - package: EnginePackage
        product: DeckStreakFFI
      - package: HarnessWire
      - package: CardIsolation
    settings:
      base:
        INFOPLIST_FILE: Harness/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
  HarnessTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HarnessTests
    dependencies:
      - target: Harness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DS_APP_ID).tests
        TARGETED_DEVICE_FAMILY: "1,2"
  HarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HarnessUITests
    dependencies:
      - target: Harness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DS_APP_ID).uitests
        TARGETED_DEVICE_FAMILY: "1,2"
  # The planted suite's host: an empty app that declares local networking for the suite's
  # listeners (SPEC-349 R9). Test-only: no scheme builds it for running or archiving.
  CardProbeHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardProbeHost
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: CardProbeHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(DS_APP_ID).cardprobe
        TARGETED_DEVICE_FAMILY: "1,2"
  # The planted suite (SPEC-349 A3, A5 to A8), hosted by the probe host. It reaches the factory's
  # internal single-layer door through `@testable import`: Xcode builds a local package's Debug
  # configuration with testability on, and the scheme tests in Debug.
  CardProbeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardProbeTests
    dependencies:
      - target: CardProbeHost
      - package: CardIsolation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DS_APP_ID).cardprobe.tests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Harness:
    build:
      targets:
        Harness: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarnessTests
        - HarnessUITests
    archive:
      config: Release
  CardProbe:
    build:
      targets:
        CardProbeHost: [test]
        CardProbeTests: [test]
    test:
      config: Debug
      targets:
        - CardProbeTests
