name: planted

# A planted workflow (SPEC-034 A11): words that are not the secrets context, a step's output named
# `secrets` and a file name that begins with the word. scripts/tests/test_ci_workflows.py judges
# it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a scan that counts what it found
        id: scan
        run: echo "secrets=0" >> "$GITHUB_OUTPUT"
      - name: the count, read back, and the scan's configuration
        env:
          FOUND: ${{ steps.scan.outputs.secrets }}
          CONFIG: ${{ hashFiles('secrets-scan.toml') }}
        run: echo "$FOUND $CONFIG"
