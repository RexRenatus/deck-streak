name: planted

# A planted workflow (SPEC-034 A11): the default token read as a secret, in either form and any
# case, since GitHub reads a secret's name without case. scripts/tests/test_ci_workflows.py judges
# it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: the default token, as a secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANY_CASE: ${{ secrets.github_token }}
          INDEXED: ${{ secrets['GITHUB_TOKEN'] }}
        run: echo planted
