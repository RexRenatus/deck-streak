name: planted

# A planted workflow (SPEC-034 A11): environments the checker reads that set no variable git
# reads: names that hold the letters `GIT_` only inside a longer word, an empty `env`, a container
# named by its image alone, a container whose `env` is a mapping, a container whose `options`
# are written out and name no variable git reads, and a container whose `ports` and `volumes` are
# written out, and whose registry `credentials` are one `${{ }}` expression, which no step reads.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  DIGIT_COUNT: 2

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
    steps:
      - run: echo "$DIGIT_COUNT $LEGIT_MODE"
        env:
          LEGIT_MODE: fast
  contained:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      env:
        MODE: fast
    steps:
      - run: echo ready
  optioned:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --cpus 1
    steps:
      - run: echo ready
  ported:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      ports:
        - 8080:80
      volumes:
        - planted-cache:/cache
      credentials: ${{ fromJSON(vars.PLANTED_CREDENTIALS) }}
    steps:
      - run: echo ready
