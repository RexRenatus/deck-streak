name: planted

# A planted workflow (SPEC-034 A11): a step's output named `secrets`, which is a property of the
# steps context and not the secrets context. scripts/tests/test_ci_workflows.py judges it; nothing
# runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a scan that counts what it found
        id: scan
        run: echo "secrets=0" >> "$GITHUB_OUTPUT"
      - name: the count, read back
        env:
          FOUND: ${{ steps.scan.outputs.secrets }}
        run: echo "$FOUND"
