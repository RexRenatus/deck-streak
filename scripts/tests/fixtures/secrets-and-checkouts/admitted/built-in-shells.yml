name: planted

# A planted workflow (SPEC-034 A11): each of GitHub's built-in shell keywords, which the runner runs
# with its own arguments, in the workflow's defaults, a job's defaults, a step and a step inside a
# `parallel` block, and a shell omitted or empty, which is none: the runner falls back to the
# defaults. scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: sh
    steps:
      - run: echo planted
        shell: bash
      - run: echo planted
        shell: sh
      - run: echo planted
        shell: pwsh
      - run: echo planted
        shell: powershell
      - run: print(1)
        shell: python
      - run: echo planted
        shell: cmd
      - parallel:
          - run: echo planted
            shell: bash
  empty:
    runs-on: ubuntu-24.04
    defaults:
      run:
    steps:
      - run: echo planted
        shell:
      - run: echo planted
        shell: ''
