name: planted

# A planted workflow (SPEC-034 A11): the default token by its own name, github.token.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: the default token
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo planted
