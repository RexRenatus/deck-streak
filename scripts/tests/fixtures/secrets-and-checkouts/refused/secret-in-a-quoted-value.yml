name: planted

# A planted workflow (SPEC-034 A10): a secret read inside quoted values. The reader reads a quote
# doubled inside single quotes as one quote, and refuses a double-quoted value that holds an escape
# rather than read it. The names are synthetic. scripts/tests/test_ci_workflows.py judges it;
# nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a secret inside quoted values
        env:
          SINGLE: 'don''t ${{ secrets.EXAMPLE_TOKEN }}'
          DOUBLE: "say \"hi\" ${{ secrets.EXAMPLE_KEY }}"
          ESCAPED: "\x24{{ secrets.EXAMPLE_VALUE }}"
        run: echo planted
