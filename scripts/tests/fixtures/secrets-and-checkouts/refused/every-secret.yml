name: planted

# A planted workflow (SPEC-034 A10): the secrets context whole, and a secret named only at run time.
# The names are synthetic. scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: [EXAMPLE_TOKEN, EXAMPLE_KEY]
    steps:
      - name: a secret named at run time, and every secret
        env:
          CHOSEN: ${{ secrets[matrix.name] }}
        run: echo '${{ toJSON(secrets) }}' > every-secret.json
