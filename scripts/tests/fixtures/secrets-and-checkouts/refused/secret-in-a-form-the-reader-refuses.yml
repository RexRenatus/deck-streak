name: planted

# A planted workflow (SPEC-034 A10): forms the reader refuses rather than read: a secret behind a
# tag, in a flow mapping, in a quoted flow-list item and after a quoted key that does not end its
# item, and flow-list items that hold a key. The names are synthetic.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - "planted key": ${{ secrets.EXAMPLE_TOKEN }}
    steps:
      - name: a secret behind a tag, and inside a quoted flow-list item
        env:
          TAGGED: !!str "\x24{{ secrets.EXAMPLE_TOKEN }}"
          LISTED: ['planted #${{ secrets.EXAMPLE_VALUE }}']
        run: echo planted
      - name: a secret inside a flow mapping
        env: {FLOWED: "\x24{{ secrets.EXAMPLE_KEY }}"}
        run: echo planted
      - name: flow-list items that hold a key
        env:
          COLON: [planted: kept]
          QUESTION: [?planted]
        run: echo planted
