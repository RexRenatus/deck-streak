name: planted

# A planted workflow (SPEC-034 A10): git configured from the environment, which can point git at
# another repository or have it run a command. A variable whose name begins with `GIT_`, in any case, set as an `env`
# key of the workflow, a job, a job's container and a step, and named in a value: a container's
# options and a script that exports one and reads it, named once. The names are synthetic.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://github.com/example-org/other-repository.git.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/RexRenatus/deck-streak

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_PARAMETERS: planted
    container:
      image: ubuntu:24.04
      env:
        GIT_SSH_COMMAND: planted
      options: --env GIT_CONFIG_GLOBAL=planted
    steps:
      - run: echo ready
        env:
          git_ssh_command: planted
      - run: export GIT_ASKPASS=planted && echo "$GIT_ASKPASS"
