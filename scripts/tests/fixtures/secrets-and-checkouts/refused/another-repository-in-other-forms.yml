name: planted

# A planted workflow (SPEC-034 A10): another repository reached in other forms: a checkout whose
# action is named in another case, a clone after a git option, a fetch through an ssh host and in
# git's scp-like form, a checkout whose input is named in another case, a checkout from another
# server, and actions/checkout written with an empty part, a trailing slash, a backslash or a path
# inside it, as the runner reads each. The names are synthetic. scripts/tests/test_ci_workflows.py
# judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a checkout named in another case
        uses: Actions/Checkout@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
      - name: a clone after a git option
        run: git -C work clone https://github.com/example-org/other-repository.git
      - name: a fetch through an ssh host
        run: git fetch git@example-host:example-org/other-repository.git
      - name: a fetch in git's scp-like form
        run: git fetch github.com:example-org/other-repository.git main
      - name: an input named in another case
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          Repository: example-org/other-repository
          persist-credentials: false
      - name: an input named in capitals
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          REPOSITORY: example-org/other-repository
          persist-credentials: false
      - name: a checkout from another server
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          github-server-url: https://example-host.example
          persist-credentials: false
      - name: a checkout from another server, its input named in another case
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          GitHub-Server-URL: https://example-host.example
          persist-credentials: false
      - name: actions/checkout with an empty part
        uses: actions//checkout@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
      - name: actions/checkout with a trailing slash
        uses: actions/checkout/@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
      - name: actions/checkout with a backslash
        uses: actions\checkout@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
      - name: an action at a path inside actions/checkout
        uses: actions/checkout/planted@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
