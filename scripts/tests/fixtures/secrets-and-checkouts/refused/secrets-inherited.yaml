name: planted

# A planted workflow (SPEC-034 A10): a job that passes every secret to the workflow it calls. It is
# a `.yaml` file, which GitHub reads as a workflow too. scripts/tests/test_ci_workflows.py judges
# it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  call:
    uses: ./.github/workflows/reusable.yml
    secrets: inherit
