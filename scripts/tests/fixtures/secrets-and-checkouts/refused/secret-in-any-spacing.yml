name: planted

# A planted workflow (SPEC-034 A10): a secret read in any spacing and in any case, and after a `#`
# that no space precedes, which YAML reads as text. The names are synthetic.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a secret in any spacing and in any case
        env:
          SPACED: ${{ secrets.EXAMPLE_TOKEN }}
          UNSPACED: ${{secrets.EXAMPLE_KEY}}
          WIDE: ${{   secrets.EXAMPLE_VALUE   }}
          CAPITALS: ${{ SECRETS.Example_Token }}
          HASHED: planted#${{ secrets.EXAMPLE_TOKEN }}
        run: echo planted
