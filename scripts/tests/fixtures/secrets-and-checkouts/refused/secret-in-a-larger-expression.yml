name: planted

# A planted workflow (SPEC-034 A10): a secret inside a larger expression, one of them after a quoted
# string that holds `}}`, which does not close the expression. The names are synthetic.
# scripts/tests/test_ci_workflows.py judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: a secret inside a larger expression
        env:
          EITHER: ${{ github.token || secrets.EXAMPLE_TOKEN }}
          FORMATTED: ${{ format('{{{0}}}', secrets.EXAMPLE_KEY) }}
        run: echo planted
