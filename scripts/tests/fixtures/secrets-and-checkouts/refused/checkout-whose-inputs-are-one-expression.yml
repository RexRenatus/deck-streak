name: planted

# A planted workflow (SPEC-034 A10): actions/checkout whose inputs are one `${{ }}` expression, which
# GitHub evaluates when the step runs, so no reading of the file names the repository it checks out:
# a literal read by fromJSON, a step's output read by fromJSON, and a literal in quotes naming
# another server. The names are synthetic. scripts/tests/test_ci_workflows.py judges it; nothing
# runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: inputs read from a literal
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with: ${{ fromJSON('{"repository":"example-org/other-repository"}') }}
      - name: inputs written by a step
        id: settings
        run: echo 'SETTINGS={"repository":"example-org/other-repository"}' >> "$GITHUB_OUTPUT"
      - name: inputs read from that step's output
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with: ${{ fromJSON(steps.settings.outputs.SETTINGS) }}
      - name: inputs read from a literal in quotes
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with: '${{ fromJSON(''{"github-server-url":"https://example-host.example"}'') }}'
