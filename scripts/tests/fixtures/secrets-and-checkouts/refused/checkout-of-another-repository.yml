name: planted

# A planted workflow (SPEC-034 A10): actions/checkout of another repository, by name and by a
# pull request's head repository. The names are synthetic. scripts/tests/test_ci_workflows.py
# judges it; nothing runs it.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          repository: example-org/other-repository
          persist-credentials: false
      - name: the pull request's head, by its repository
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
