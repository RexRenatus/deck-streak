# The JavaScript workspace. pnpm 12 reads its settings here and from the environment, and reads
# only registry and auth settings from `.npmrc`.
packages:
  - web/app

# One version for a tool that more than one package depends on. Vitest is a devDependency of the
# root, which runs web/app's tests from the repository root, and of web/app itself.
catalog:
  vitest: ^5.0.5

# Refuse to install on a Node that a package's `engines` rules out (the root pins Node 24).
engineStrict: true

# A development-only transitive dependency, moved to the version that fixes its advisory, which no
# update inside its parent's major reaches (ADR-005's amendment). StrykerJS 10's
# `typed-rest-client` 2.3.1 pins `qs` 6.15.1 (fixed in 6.16.1). The selector names its parent's
# major, so the entry never touches a later major, which declares a fixed range itself; an entry
# whose parent no longer matches is removed, as SvelteKit 2's `cookie` and Mermaid 11's `katex`
# entries were when SvelteKit 3 and Mermaid 12 declared fixed ranges themselves.
overrides:
  'typed-rest-client@2>qs': '>=6.16.1 <7'
