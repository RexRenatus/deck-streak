# The JavaScript workspace. pnpm 11 reads its settings here and from the environment, and reads
# only registry and auth settings from `.npmrc`.
packages:
  - web/app

# One version for a tool that more than one package depends on. Vitest is a devDependency of the
# root, which runs web/app's tests from the repository root, and of web/app itself.
catalog:
  vitest: ^4.1.11

# Refuse to install on a Node that a package's `engines` rules out (the root pins Node 24).
engineStrict: true
