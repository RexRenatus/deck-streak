name = "formal"
defaultTargets = ["Formal"]

# #472 (ADR-305). One Lean library, every module under Formal/ by glob, so an entry joins the build
# by existing and no list is typed.
[[lean_lib]]
name = "Formal"
globs = ["Formal.*"]
# ADR-440. Every warning Lean prints while it builds the library is an error, so a warning
# fails the build and every formal check that runs it.
leanOptions = { warningAsError = true }
