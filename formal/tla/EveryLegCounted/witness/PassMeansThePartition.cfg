\* The verdict takes the plan's legs as the population and never holds them to the tool's listing.
\* A plan that drops a listed mutant passes, since no leg was dealt it and no report misses it.
\* This is MCEveryLegCounted.cfg with TrustThePlan = TRUE and nothing else changed;
\* PassMeansThePartition must find a pass with a dropped mutant.
SPECIFICATION Spec
CONSTANTS
    Mutants = {m1, m2, m3}
    NLegs = 2
    MaxAttempts = 2
    CountReported = FALSE
    TrustThePlan = TRUE
INVARIANT PassMeansThePartition
