\* The verdict promises only the legs whose report arrived. A leg wired to another leg's slice
\* reports it whole while that leg uploads nothing, and the run passes with a dealt leg that never
\* reported. This is MCEveryLegCounted.cfg with CountReported = TRUE and nothing else changed;
\* PassMeansEveryLegCounted must find a pass with a dealt leg and no whole report in its store.
SPECIFICATION Spec
CONSTANTS
    Mutants = {m1, m2, m3}
    NLegs = 2
    MaxAttempts = 2
    CountReported = TRUE
    TrustThePlan = FALSE
INVARIANT PassMeansEveryLegCounted
