\* the guard as it is: the match read before the limiter, one lock around the count and the
\* record, the oldest bucket evicted, one word for every refusal; three requests, four tokens,
\* two failures a window of two ticks, two buckets, a clock of four instants
\* @phx bound NReq=3 MaxFailures=2 MaxBuckets=2 Window=2 MaxTime=3
\* @phx states >= 237645
CONSTANTS
    LimiterAfterMatch = TRUE
    OneLock = TRUE
    Evict = TRUE
    OneWord = TRUE
    NReq = 3
    MaxFailures = 2
    MaxBuckets = 2
    Window = 2
    MaxTime = 3
SPECIFICATION Spec
INVARIANT TypeOK GrantedAlwaysAdmitted FreshFailuresAtMostMax BucketsAtMostMax OneRefusalForEveryCause
_POSSIBLE ARequestIsLimited ABucketIsEvicted AGrantedTokenIsAllowedOverItsFullBucket
