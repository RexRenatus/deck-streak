\* the activation as it is: the open-window read, the oldest held first, the guarded write, each
\* call in one write; three callers, three tokens, a window of two ticks over five
\* @phx bound NActors=3 NTokens=3 Window=2 MaxTime=5
\* @phx states >= 6756
CONSTANTS
    CheckOpenWindow = TRUE
    OldestFirst = TRUE
    OneWrite = TRUE
    NActors = 3
    NTokens = 3
    Window = 2
    MaxTime = 5
SPECIFICATION Spec
INVARIANT TypeOK AtMostOneOpenWindow OldestHeldFirst
_POSSIBLE ATokenIsActivated ALaterWindowFollows AWindowIsOpen
