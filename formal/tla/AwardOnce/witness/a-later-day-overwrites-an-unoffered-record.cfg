\* #75 NoSilentLoss witness: the offers run before the write, but the write does not re-read the mark, so a later
\* day replaces a record the router did not answer and nothing names it
CONSTANTS
    Design = "mark"
    UniqueKey = TRUE
    OnceKey = TRUE
    Drain = TRUE
    Recheck = FALSE
    MaxCrash = 1
    MaxMiss = 1
SPECIFICATION Spec
INVARIANT NoSilentLoss
