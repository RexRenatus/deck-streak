\* The base's run(): the counts are read as soon as the command exits (scripts/memory_scope.py:301-302
\* at dev 36c4783a), memory.events at :169 and then memory.peak at :175, while a process the command
\* started may still live. A kill after the counters' read is neither counted nor makes the record void.
\* This is MCLateKillCounted.cfg with ReadBeforeAlone = TRUE and nothing else changed;
\* AKillAfterBothReadsIsCountedOrTheRecordIsVoid must find a record in force after a kill after both reads.
SPECIFICATION Spec
CONSTANTS
    Cmd = cmd
    Started = {p1, p2}
    Wrapper = script
    Reads = 2
    ReadBeforeAlone = TRUE
INVARIANT AKillAfterBothReadsIsCountedOrTheRecordIsVoid
