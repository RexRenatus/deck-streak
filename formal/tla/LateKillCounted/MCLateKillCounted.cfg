\* @phx bound Reads=2
\* @phx states >= 468
\* The cure: after the command, run() reads cgroup.procs at most Reads times and reads the counts
\* only once the scope holds the script alone. Two processes the command may start, two reads.
SPECIFICATION Spec
CONSTANTS
    Cmd = cmd
    Started = {p1, p2}
    Wrapper = script
    Reads = 2
    ReadBeforeAlone = FALSE
INVARIANT TypeOK EveryKillIsCountedOrTheRecordIsVoid NoKillIsReadAsACleanRun AKillBetweenTheTwoReadsIsCountedOrTheRecordIsVoid AKillAfterBothReadsIsCountedOrTheRecordIsVoid
