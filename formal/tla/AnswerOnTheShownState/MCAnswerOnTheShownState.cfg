\* the code as it is: the core sends the state the card was shown with, and the engine compares the
\* card's current state with it before it writes; two presses, three states and one change by
\* another caller
\* @phx bound MaxChanges=1
\* @phx states >= 648
CONSTANTS
    Presses = {p1, p2}
    States = {s1, s2, s3}
    MaxChanges = 1
    ReadAtAnswer = FALSE
    EngineCompares = TRUE
SPECIFICATION Spec
INVARIANT TypeOK AnAnswerCarriesTheStateItWasShown NoAnswerIsRecordedOnAChangedCard
