\* #760 NoAnswerIsRecordedOnAChangedCard witness: no answer is recorded on a card whose state changed
\* after its press was shown. The one switch off is EngineCompares: an engine without the comparison
\* its answer_card_inner makes before it writes.
CONSTANTS
    Presses = {p1, p2}
    States = {s1, s2, s3}
    MaxChanges = 1
    ReadAtAnswer = FALSE
    EngineCompares = FALSE
SPECIFICATION Spec
INVARIANT TypeOK NoAnswerIsRecordedOnAChangedCard
