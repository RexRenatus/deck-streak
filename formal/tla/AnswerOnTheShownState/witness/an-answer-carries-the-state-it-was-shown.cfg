\* #760 AnAnswerCarriesTheStateItWasShown witness: every recorded answer carries the state its
\* press was shown. The one switch on is ReadAtAnswer, ADR-376 D3's rejected read at answer time:
\* the core reads the engine's own state for the card and sends it in place of the shown one, as row
\* S46001's mutant of dispatch.rs::run_answer does.
CONSTANTS
    Presses = {p1, p2}
    States = {s1, s2, s3}
    MaxChanges = 1
    ReadAtAnswer = TRUE
    EngineCompares = TRUE
SPECIFICATION Spec
INVARIANT TypeOK AnAnswerCarriesTheStateItWasShown
