\* The removal takes nothing out. A census leaves its member unit in the store, and the next census
\* starts its passes beside it: the warm target SPEC-072 section 14's round 7 recorded moving a
\* verdict, which ADR-197's round 8 answered with an empty target for each census. This is
\* MCCensusStore.cfg with Pruned = FALSE and nothing else changed; NoMemberSurvivesTheRemoval must
\* find a member unit in the store right after a census's removal.
SPECIFICATION Spec
CONSTANTS
    Censuses = {c1, c2}
    Trees = {t1, t2}
    Nobody = Nobody
    Locked = TRUE
    Pruned = FALSE
INVARIANT NoMemberSurvivesTheRemoval
