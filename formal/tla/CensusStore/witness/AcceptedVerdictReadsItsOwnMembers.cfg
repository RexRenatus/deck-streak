\* The store's lock is not taken. One census compiles its member, the other removes it and compiles
\* its own tree's member under the same name, and the first reads that unit as one it compiled: a
\* warm target moving a verdict, as SPEC-072 section 14's round 7 recorded and ADR-197's round 8
\* answered with an empty target for each census. This is MCCensusStore.cfg with Locked = FALSE and
\* nothing else changed; AcceptedVerdictReadsItsOwnMembers must find an accepted verdict that read
\* another tree's member unit.
SPECIFICATION Spec
CONSTANTS
    Censuses = {c1, c2}
    Trees = {t1, t2}
    Nobody = Nobody
    Locked = FALSE
    Pruned = TRUE
INVARIANT AcceptedVerdictReadsItsOwnMembers
