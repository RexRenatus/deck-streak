\* The code as it is: each census holds the store's lock from before its first removal to after its
\* last pass, and its removal takes every path package's unit out of the store. Two censuses of one
\* checkout, each judging either of two trees, over one store.
SPECIFICATION Spec
CONSTANTS
    Censuses = {c1, c2}
    Trees = {t1, t2}
    Nobody = Nobody
    Locked = TRUE
    Pruned = TRUE
INVARIANT TypeOK AcceptedVerdictReadsItsOwnMembers NoMemberSurvivesTheRemoval
