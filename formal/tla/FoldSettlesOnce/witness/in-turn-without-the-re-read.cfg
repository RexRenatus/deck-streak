\* #311 SettleInTurn witness: with no re-read, a run that read no cursor settles its own closed day
\* after another run, which also read none, has settled an earlier one, so the day between them is
\* never settled (crates/coordination/src/recompute/mod.rs:479 reads the cursor once and :503 opens
\* each day's write without re-reading it, at 9b0bf65f9)
CONSTANTS
    Recheck = FALSE
    MaxDay = 5
    MaxRuns = 2
    MaxCrash = 2
SPECIFICATION Spec
INVARIANT SettleInTurn
