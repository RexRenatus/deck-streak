\* #671 EverySyncFollowsAnAdmittingRead witness: a read admits only a minimum at most the client's
\* level. The one switch on is Flip, the comparison turned over, so a minimum above the level
\* admits and one at it refuses.
CONSTANTS
    Level = 1
    MaxMinimum = 3
    NPrivate = 1
    Gate = TRUE
    Flip = TRUE
    PrivateStartsAdmitted = FALSE
SPECIFICATION Spec
INVARIANT EverySyncFollowsAnAdmittingRead
