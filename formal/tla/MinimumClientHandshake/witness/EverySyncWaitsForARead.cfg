\* #671 EverySyncFollowsAnAdmittingRead witness: every sync call that reaches the engine acted on
\* a read that admitted the client's level. The one switch off is Gate, the check before the
\* engine: the merge-base's `crates/engine-core/src/dispatch.rs` ran every sync pair with no check.
CONSTANTS
    Level = 1
    MaxMinimum = 3
    NPrivate = 1
    Gate = FALSE
    Flip = FALSE
    PrivateStartsAdmitted = FALSE
SPECIFICATION Spec
INVARIANT EverySyncFollowsAnAdmittingRead
