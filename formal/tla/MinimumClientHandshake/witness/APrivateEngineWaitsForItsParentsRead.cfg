\* #671 EverySyncFollowsAnAdmittingRead witness: a private engine obeys its parent's latest read.
\* The one switch on is PrivateStartsAdmitted, a private engine with a cell of its own that begins
\* admitted and that no read sets.
CONSTANTS
    Level = 1
    MaxMinimum = 3
    NPrivate = 1
    Gate = TRUE
    Flip = FALSE
    PrivateStartsAdmitted = TRUE
SPECIFICATION Spec
INVARIANT EverySyncFollowsAnAdmittingRead
