\* witness for EveryFailureIsToldOrItsSilenceIsHeard: the keys of a read are recorded before the report is delivered, so a report not delivered leaves its keys marked reported and the next run checks in over a failure nobody was told of
CONSTANTS
    RecordFirst = TRUE
    NameAlone = FALSE
    CheckInAfterUndelivered = FALSE
    UnreadableAsEmpty = FALSE
    MaxInv = 2
    Names = {n1}
SPECIFICATION Spec
PROPERTY EveryFailureIsToldOrItsSilenceIsHeard
