\* the chosen design: the guard at apply time over every kind of operation, the paths resolved at
\* each operation; two operations of every kind over every folder, and up to three changes by
\* another writer, each a link made into the journal folder or a folder put back
\* @phx bound NumOps=2 MaxEnv=3
\* @phx states >= 20880
CONSTANTS
    ApplyGuard = TRUE
    GuardKinds = {"dir", "rename", "write"}
    ResolveAt = "op"
    NumOps = 2
    MaxEnv = 3
SPECIFICATION Spec
INVARIANT TypeOK NoJournalWrite
