\* #56 NoJournalWrite witness: nothing a run applies lands under a journal folder. The guard covers
\* the bytes of a note alone, the refusal crates/vault/src/atomic.rs:37 (write) makes at 42e647bf,
\* and not the folders a run creates or the captures it renames.
CONSTANTS
    ApplyGuard = TRUE
    GuardKinds = {"write"}
    ResolveAt = "op"
    NumOps = 2
    MaxEnv = 3
SPECIFICATION Spec
INVARIANT NoJournalWrite
