\* #56 NoJournalWrite witness: nothing a run applies lands under a journal folder. Every path is
\* resolved once, at the run's first write, as crates/vault/src/staged.rs:841 (placement) resolves
\* it once in the check at 42e647bf: a folder made a link after the first write is not seen.
CONSTANTS
    ApplyGuard = TRUE
    GuardKinds = {"dir", "rename", "write"}
    ResolveAt = "once"
    NumOps = 2
    MaxEnv = 3
SPECIFICATION Spec
INVARIANT NoJournalWrite
