\* #56 NoJournalWrite witness: nothing a run applies lands under a journal folder. The guard
\* compares names alone, as crates/vault/src/atomic.rs:74 (refuse_journal) does without its
\* resolution at 42e647bf: a duty folder whose name is a link into a journal folder passes it.
CONSTANTS
    ApplyGuard = TRUE
    GuardKinds = {"dir", "rename", "write"}
    ResolveAt = "op"
    NumOps = 2
    MaxEnv = 3
    GuardHit <- NameHit
SPECIFICATION Spec
INVARIANT NoJournalWrite
