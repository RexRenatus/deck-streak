\* #56 NoJournalWrite witness: nothing a run applies lands under a journal folder. The apply has no
\* guard of its own and trusts the check made before it, as crates/vault/src/staged.rs:947
\* (apply_op) and :974 (create_folders) did at 42e647bf: a folder made a link after the re-check
\* takes the operation into the journal folder.
CONSTANTS
    ApplyGuard = FALSE
    GuardKinds = {"dir", "rename", "write"}
    ResolveAt = "op"
    NumOps = 2
    MaxEnv = 3
SPECIFICATION Spec
INVARIANT NoJournalWrite
