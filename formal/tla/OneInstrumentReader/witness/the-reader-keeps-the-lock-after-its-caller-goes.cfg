\* The code at 36c4783a: instruments.rs::run_held holds the lock in the caller's future, so a
\* dropped caller or a stopping runtime drops it, and lock.rs's Drop for Held unlocks while the
\* read in reader.rs::with_copy runs on. AtMostOneReader must find two runs reading at once.
SPECIFICATION Spec
CONSTANTS
    NApi = 2
    NBot = 1
    Exclusive = TRUE
    HoldToEnd = FALSE
    KeepOnStop = FALSE
INVARIANT TypeOK AtMostOneReader
