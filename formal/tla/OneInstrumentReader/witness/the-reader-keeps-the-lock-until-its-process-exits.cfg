\* A task alone: the run's own task keeps the lock when its caller goes, but a stopping runtime
\* drops the task and unlocks while the read runs on. AtMostOneReader must find two runs reading
\* at once.
SPECIFICATION Spec
CONSTANTS
    NApi = 2
    NBot = 1
    Exclusive = TRUE
    HoldToEnd = TRUE
    KeepOnStop = FALSE
INVARIANT TypeOK AtMostOneReader
