\* The issue's own: an acquire that is not exclusive lets a second run take the lock while the
\* first holds it. AtMostOneReader must find two runs reading at once.
SPECIFICATION Spec
CONSTANTS
    NApi = 2
    NBot = 1
    Exclusive = FALSE
    HoldToEnd = TRUE
    KeepOnStop = TRUE
INVARIANT TypeOK AtMostOneReader
