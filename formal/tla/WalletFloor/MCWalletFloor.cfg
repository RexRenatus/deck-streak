\* the wallet as it is: every read inside the write, the unique key, the once-ever guard over every
\* day, a closed day's mint kept at held.max(amount); three tasks, two days, amounts up to two
\* @phx bound NActors=3 NDays=2 MaxAmount=2
\* @phx states >= 180580
CONSTANTS
    ReadInsideWrite = TRUE
    UniqueKey = TRUE
    OnceGuardAllDays = TRUE
    ClosedKeepsHeld = TRUE
    NActors = 3
    NDays = 2
    MaxAmount = 2
SPECIFICATION Spec
INVARIANT TypeOK FloorHolds OneMovementPerKey DepositOnceEver SettledMintNeverFalls
