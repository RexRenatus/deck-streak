\* #824 ScoresOfAnotherDayOrSnapshotNeverApply witness: scores made for another study day or another
\* snapshot never order the presented queue. The one switch off is Keyed: the input ADR-339 decides
\* at the merge-base, "for each card due today, an identifier and a score" (ADR-339 lines 37-40),
\* names neither the day nor the snapshot its scores were made for.
CONSTANTS
    NCards = 2
    MaxDay = 2
    MaxGen = 1
    MaxScore = 2
    Keyed = FALSE
    Derived = TRUE
    OffRestores = TRUE
    ScorerReadsOnly = TRUE
    ReorderWritesNothing = TRUE
SPECIFICATION Spec
INVARIANT ScoresOfAnotherDayOrSnapshotNeverApply
