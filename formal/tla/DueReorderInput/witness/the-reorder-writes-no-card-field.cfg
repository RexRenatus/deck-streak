\* #824 NoScoreOrReorderWritesACardField witness: the reorder changes no card field. The one switch
\* off is ReorderWritesNothing: the planted model ADR-339 refuses, which moves the top-scored
\* card's due date to today.
CONSTANTS
    NCards = 2
    MaxDay = 2
    MaxGen = 1
    MaxScore = 2
    Keyed = TRUE
    Derived = TRUE
    OffRestores = TRUE
    ScorerReadsOnly = TRUE
    ReorderWritesNothing = FALSE
SPECIFICATION Spec
INVARIANT NoScoreOrReorderWritesACardField
