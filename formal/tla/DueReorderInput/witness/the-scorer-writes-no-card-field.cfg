\* #824 NoScoreOrReorderWritesACardField witness: the scorer's read changes no card field. The one
\* switch off is ScorerReadsOnly: a planted scorer that writes the fields of the snapshot it reads.
CONSTANTS
    NCards = 2
    MaxDay = 2
    MaxGen = 1
    MaxScore = 2
    Keyed = TRUE
    Derived = TRUE
    OffRestores = TRUE
    ScorerReadsOnly = FALSE
    ReorderWritesNothing = TRUE
SPECIFICATION Spec
INVARIANT NoScoreOrReorderWritesACardField
