\* #824 PresentedIsTheStockDueSet witness: the presented queue holds exactly the stock queue's cards.
\* The one switch off is Derived, the queue derived from the stock queue at every step as
\* `current_card` derives its head at the merge-base: a design that reorders once and keeps the
\* result misses a lapsed card that comes back and a card that leaves by another path.
CONSTANTS
    NCards = 2
    MaxDay = 2
    MaxGen = 1
    MaxScore = 2
    Keyed = TRUE
    Derived = FALSE
    OffRestores = TRUE
    ScorerReadsOnly = TRUE
    ReorderWritesNothing = TRUE
SPECIFICATION Spec
INVARIANT PresentedIsTheStockDueSet
