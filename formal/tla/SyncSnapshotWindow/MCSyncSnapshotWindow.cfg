\* the chosen design: the window ordered after the server's stop, a held database refused, a whole
\* generation published, the server started on success and on failure, no condition on the window
\* and one transaction per session; three daily runs, three sessions and two failed copies
\* @phx bound MaxWindows=3 MaxSessions=3 MaxFail=2
\* @phx states >= 1286
CONSTANTS
    OrderAfterStop = TRUE
    RefuseHolder = TRUE
    PublishWhole = TRUE
    StartOnFailure = TRUE
    GatedByCondition = FALSE
    AtomicSession = TRUE
    MaxWindows = 3
    MaxSessions = 3
    MaxFail = 2
SPECIFICATION Spec
INVARIANT TypeOK CopyOnlyWhileStopped PairFromOneGeneration ASyncInTheWindowIsRefusedWhole
