\* #647 PairFromOneGeneration witness: the published collection and media index are of one
\* generation. Each database is published as it is copied, not by one rename of the whole
\* generation.
CONSTANTS
    OrderAfterStop = TRUE
    RefuseHolder = TRUE
    PublishWhole = FALSE
    StartOnFailure = TRUE
    GatedByCondition = FALSE
    AtomicSession = TRUE
    MaxWindows = 2
    MaxSessions = 2
    MaxFail = 1
SPECIFICATION Spec
INVARIANT PairFromOneGeneration
