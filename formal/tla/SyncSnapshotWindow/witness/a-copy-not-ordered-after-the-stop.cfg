\* #647 CopyOnlyWhileStopped witness: the published generation holds no database read while a
\* server process ran. The window is not ordered after the server's stop (no After= beside its
\* Conflicts=), so its copy can start while the server drains; the media index is still refused
\* while held.
CONSTANTS
    OrderAfterStop = FALSE
    RefuseHolder = TRUE
    PublishWhole = TRUE
    StartOnFailure = TRUE
    GatedByCondition = FALSE
    AtomicSession = TRUE
    MaxWindows = 2
    MaxSessions = 2
    MaxFail = 1
SPECIFICATION Spec
INVARIANT CopyOnlyWhileStopped
