\* #647 ASyncInTheWindowIsRefusedWhole witness: a sync in the window is refused whole. A session
\* commits each step as it applies it rather than in one transaction from its start to its finish,
\* so the server's exit can cut it between them.
CONSTANTS
    OrderAfterStop = TRUE
    RefuseHolder = TRUE
    PublishWhole = TRUE
    StartOnFailure = TRUE
    GatedByCondition = FALSE
    AtomicSession = FALSE
    MaxWindows = 2
    MaxSessions = 2
    MaxFail = 1
SPECIFICATION Spec
INVARIANT ASyncInTheWindowIsRefusedWhole
