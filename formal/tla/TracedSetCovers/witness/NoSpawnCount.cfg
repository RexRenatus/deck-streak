\* The joiners leave out the per-parent count: a process that started more processes than the
\* records naming it no longer joins its test. This is MCTracedSetCovers.cfg with
\* SkipSpawnCount = TRUE and nothing else changed; NoExecutorDropped must find a test whose child
\* executed a line and left no record by the read while another test traced it.
SPECIFICATION Spec
CONSTANTS
    NT = 2
    MaxDesc = 3
    NL = 1
    SkipSpawnCount = TRUE
INVARIANT NoExecutorDropped
