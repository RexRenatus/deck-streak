\* @phx bound NT=2 MaxDesc=3 NL=1
\* The code as it is: two tests run in order, one target line, and up to three descendant
\* processes that start, execute, replace their image, write a record or exit with none, in any
\* order, while the judge reads the records once after the runner exits.
SPECIFICATION Spec
CONSTANTS
    NT = 2
    MaxDesc = 3
    NL = 1
    SkipSpawnCount = FALSE
INVARIANT TypeOK NoExecutorDropped
