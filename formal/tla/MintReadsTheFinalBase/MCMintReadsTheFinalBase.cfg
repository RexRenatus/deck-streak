\* the fold as built: the mint in phase 6 of each day's write, the backfill minted too; three days
\* (a backfill window, a settled day, the current day, which turns over once), bases up to three,
\* a divisor of one and a cap of two, and two runs of each cycle
\* @phx bound NDays=3 MaxBase=3 Divisor=1 Cap=2 Runs=2
\* @phx states >= 244178
CONSTANTS
    MintAt = "phase6"
    MintsBackfill = TRUE
    NDays = 3
    MaxBase = 3
    Divisor = 1
    Cap = 2
    Runs = 2
SPECIFICATION Spec
INVARIANT TypeOK SettledMintEqualsItsFinalBase SettledDayMintNeverFalls CurrentMintFollowsItsBase
