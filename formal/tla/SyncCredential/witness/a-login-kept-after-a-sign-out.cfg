\* #654 NoKeyAtRestAfterSignOut witness: after a sign-out, until the owner starts a new login,
\* no sealed record is stored. The one switch off is CheckLoginGeneration, the landed login's
\* generation check, so a login started before the sign-out is kept after it.
CONSTANTS
    CheckLoginGeneration = FALSE
    CheckSendGeneration = TRUE
    CheckRefusalGeneration = TRUE
    DropOnlyOnRefusal = TRUE
    ReleaseNeedsSession = TRUE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT NoKeyAtRestAfterSignOut
