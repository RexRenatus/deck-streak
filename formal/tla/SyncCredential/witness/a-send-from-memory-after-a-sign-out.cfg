\* #654 NoSendAfterSignOut witness: no Worker starts a send after a sign-out until a later
\* login is kept. The one switch off is CheckSendGeneration, the re-read of the stored generation
\* and record before a send, so a Worker sends the key it holds in memory.
CONSTANTS
    CheckLoginGeneration = TRUE
    CheckSendGeneration = FALSE
    CheckRefusalGeneration = TRUE
    DropOnlyOnRefusal = TRUE
    ReleaseNeedsSession = TRUE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT NoSendAfterSignOut
