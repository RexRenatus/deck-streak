\* #654 UnsealOnlyInALiveSession witness: a Worker opens the record only while an owner
\* session is live. The one switch off is ReleaseNeedsSession, so the sealing key is released
\* with no session.
CONSTANTS
    CheckLoginGeneration = TRUE
    CheckSendGeneration = TRUE
    CheckRefusalGeneration = TRUE
    DropOnlyOnRefusal = TRUE
    ReleaseNeedsSession = FALSE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT UnsealOnlyInALiveSession
