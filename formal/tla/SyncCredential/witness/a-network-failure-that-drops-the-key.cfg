\* #654 AFailureKeepsTheKey witness: a network failure never removes the record. The one
\* switch off is DropOnlyOnRefusal, so a failed send drops the record.
CONSTANTS
    CheckLoginGeneration = TRUE
    CheckSendGeneration = TRUE
    CheckRefusalGeneration = TRUE
    DropOnlyOnRefusal = FALSE
    ReleaseNeedsSession = TRUE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT AFailureKeepsTheKey
