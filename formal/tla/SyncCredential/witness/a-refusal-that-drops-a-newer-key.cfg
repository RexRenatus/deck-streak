\* #654 ARefusalDropsOnlyItsOwnKey witness: a refusal never removes a record of a later
\* generation than the one it refused. The one switch off is CheckRefusalGeneration, the refusal's
\* generation check, so a refusal of an older key drops whatever is stored.
CONSTANTS
    CheckLoginGeneration = TRUE
    CheckSendGeneration = TRUE
    CheckRefusalGeneration = FALSE
    DropOnlyOnRefusal = TRUE
    ReleaseNeedsSession = TRUE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT ARefusalDropsOnlyItsOwnKey
