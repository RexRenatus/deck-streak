\* the chosen design: a landed login kept only at the generation it started at, a send only from
\* the current generation while a record is stored, a refusal that drops only its own generation, a
\* network failure that keeps the record, and the sealing key released only to a live owner
\* session; two Workers, generations up to 4, two versions of the seal secret
\* @phx bound NWorkers=2 MaxGen=4 MaxKeys=2
CONSTANTS
    CheckLoginGeneration = TRUE
    CheckSendGeneration = TRUE
    CheckRefusalGeneration = TRUE
    DropOnlyOnRefusal = TRUE
    ReleaseNeedsSession = TRUE
    NWorkers = 2
    MaxGen = 4
    MaxKeys = 2
SPECIFICATION Spec
INVARIANT TypeOK NoKeyAtRestAfterSignOut NoSendAfterSignOut ARefusalDropsOnlyItsOwnKey AFailureKeepsTheKey UnsealOnlyInALiveSession
