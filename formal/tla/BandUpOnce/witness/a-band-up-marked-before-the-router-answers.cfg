    NEvals = 2
    UniqueKey = TRUE
    OnceKey = TRUE
    MarkFirst = TRUE
    MarkWrite = TRUE
    MaxCrash = 1
    MaxMiss = 1
SPECIFICATION Spec
INVARIANT MarkedOnlyWhenAnswered
