\* The design at head (#571): the owner's sync holds its celebrations outside the window for the
\* bot's flush that follows its answer, which may never run (the answer bound expires). A scheduled
\* flush comes after the last sync trigger, as the next 07:36 always comes; it fires more than
\* AgeLimit after that trigger, so it ends every hold delivered or abandoned by name.
\* @phx bound Horizon=8 QuietEnd=3 AgeLimit=2 Lease=1
\* @phx states >= 55407
SPECIFICATION Spec
CONSTANTS
    Items = {a, b}
    Horizon = 8
    QuietEnd = 3
    AgeLimit = 2
    Lease = 1
    SyncAt = {1, 3, 4}
    SchedAt = {3, 4, 7}
    Serialised = TRUE
    Claimed = TRUE
    NamedOnFail = TRUE
    SendHold = TRUE
INVARIANT TypeOK NoDoubleDelivery HeldReachesOrAbandons
