\* The round-2 design for a flush whose work answers an error: every row still claimed under its
\* token goes back to held, the row whose push reached included, and a later flush pushes it
\* again. This is MCHeldFlush.cfg with NamedOnFail = FALSE and nothing else changed;
\* NoDoubleDelivery must find an item reaching the owner twice.
SPECIFICATION Spec
CONSTANTS
    Items = {a, b}
    Horizon = 6
    QuietEnd = 3
    AgeLimit = 2
    Lease = 1
    SyncAt = {1, 3, 5}
    SchedAt = {3, 4}
    Serialised = TRUE
    Claimed = TRUE
    NamedOnFail = FALSE
INVARIANT NoDoubleDelivery
