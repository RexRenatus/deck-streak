\* A celebration the owner's sync holds outside the window, whose answer the bot does not observe,
\* with no scheduled flush after the last sync trigger: nothing takes the hold before the run ends.
\* This is MCHeldFlush.cfg with SendHold = TRUE and nothing else changed; HeldReachesOrAbandons
\* must find an item still held at the end of the run.
SPECIFICATION Spec
CONSTANTS
    Items = {a, b}
    Horizon = 6
    QuietEnd = 3
    AgeLimit = 2
    Lease = 1
    SyncAt = {1, 3, 5}
    SchedAt = {3, 4}
    Serialised = TRUE
    Claimed = TRUE
    NamedOnFail = TRUE
    SendHold = TRUE
INVARIANT HeldReachesOrAbandons
