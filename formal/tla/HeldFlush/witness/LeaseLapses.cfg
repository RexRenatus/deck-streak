\* The round-1 design: a lease that lapses while its holder still sends, and no row claim. A flush
\* that outlives its lease, or dies after its push reached, lets a later flush send the item again.
\* This is MCHeldFlush.cfg with Claimed = FALSE and nothing else changed; NoDoubleDelivery must
\* find an item reaching the owner twice.
SPECIFICATION Spec
CONSTANTS
    Items = {a, b}
    Horizon = 6
    QuietEnd = 3
    AgeLimit = 2
    Lease = 2
    SyncAt = {1, 3, 5}
    SchedAt = {3, 5}
    Serialised = TRUE
    Claimed = FALSE
INVARIANT NoDoubleDelivery
