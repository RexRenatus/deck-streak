\* #631 BackupBeforeReplace witness: every row a write removes is in a backup, or is a row the
\* second client synced after the re-check. The one switch off is BackupFirst, the backup before
\* a download's write.
CONSTANTS
    BackupFirst = FALSE
    SnapshotFirst = TRUE
    Recheck = TRUE
    SchemaBump = TRUE
    VerifyAtWrite = TRUE
    MaxReviews = 3
SPECIFICATION Spec
INVARIANT BackupBeforeReplace
