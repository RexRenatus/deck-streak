\* #631 NoReviewLost witness: every review ever made is on the device, the server, the
\* second client, a backup, the server copy or the snapshot. The one switch off is VerifyAtWrite,
\* the device's re-read at a download's write.
CONSTANTS
    BackupFirst = TRUE
    SnapshotFirst = TRUE
    Recheck = TRUE
    SchemaBump = TRUE
    VerifyAtWrite = FALSE
    MaxReviews = 3
SPECIFICATION Spec
INVARIANT NoReviewLost
