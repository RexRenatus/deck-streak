\* the grant as it is: the unique key, the pity in the chests' write, the draw first;
\* three recomputes, three keys, requests of three sessions
\* @phx bound NActors=3 NKeys=3 ReqLen=3
\* @phx states >= 31024
CONSTANTS
    UniqueKey = TRUE
    PityInTheChestsWrite = TRUE
    DrawFirst = TRUE
    NActors = 3
    NKeys = 3
    ReqLen = 3
SPECIFICATION Spec
INVARIANT TypeOK OneChestPerKey PityEqualsChests FailedDrawWritesNothing
_POSSIBLE AChestIsStored ADrawFails AFailedKeyIsRolledLater
