\* the chosen design: the stem claimed by its unique row inside one BEGIN IMMEDIATE transaction,
\* the files written only after the claim, the attachment renamed before the stub, the journal
\* refused, an md attachment named apart from its stub, two writers of one stem and two crashes
\* @phx bound MaxCrash=2
\* @phx states >= 2304
CONSTANTS
    Order = "attach-first"
    Claim = TRUE
    ClaimFirst = TRUE
    JournalRefusal = TRUE
    DistinctNames = TRUE
    MaxCrash = 2
SPECIFICATION Spec
INVARIANT TypeOK AtMostOneStub StubImpliesAttachment SecondWriterWritesNothing NoJournalWrite
    StubNeverNamesTheAttachment
