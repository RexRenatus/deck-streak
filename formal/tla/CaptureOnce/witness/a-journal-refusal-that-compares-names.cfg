\* #56 NoJournalWrite witness: nothing is written under a journal folder, also when a journal
\* folder's name is a link. The guard binds GuardHit to LexicalHit, the comparison of names that
\* crates/vault/src/atomic.rs:73 (refuse_journal) and crates/vault/src/inbox.rs:282 (locate) made at
\* 4b62990e: an inbox named Diary and a journal folder named Mirror, a link to Diary, pass it.
CONSTANTS
    Order = "attach-first"
    Claim = TRUE
    ClaimFirst = TRUE
    JournalRefusal = TRUE
    DistinctNames = TRUE
    KeyClaim = TRUE
    MaxCrash = 2
    GuardHit <- LexicalHit
SPECIFICATION Spec
INVARIANT NoJournalWrite
