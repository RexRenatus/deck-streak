\* The main bound: 2 devices, 2 operations each (one review of the card, one edit of the note's
\* field f0), 1 server crash, MaxHlc 4, 1 note; device 2's token can be revoked. A server crash
\* loses every answer not yet read, which is all a device crash loses in this model.
\* @phx bound MaxHlc=4 MaxCrash=0 MaxServerCrash=1 MaxLoss=0
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- MainScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {2}
    Bug = "none"
SPECIFICATION Spec
INVARIANT NoLostReview ExactlyOnce NoSkip CanonicalCardFold NoSilentOverwrite FieldConverges CausalHlc RetractOnlyOwn LocalIsPrefix
PROPERTY MonotoneLog RebootstrapKeepsPending RevokedDeviceRefused CausalHlcAtMake
