\* Convergence witness, at the liveness bound: a pull may copy a later operation past the next one, which no later pull returns to. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- LiveScript
    MaxHlc = 2
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 1
    Revocable = {2}
    Bug = "PullSkips"
SPECIFICATION Spec
PROPERTY Convergence
