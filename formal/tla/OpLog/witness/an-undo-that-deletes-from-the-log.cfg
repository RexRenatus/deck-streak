\* MonotoneLog witness, at the edits bound: the writer deletes the undone operation instead of appending the undo. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0", "f1"}
    Script <- EditsScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 0
    MaxLoss = 0
    Revocable = {}
    Bug = "UndoDeletes"
SPECIFICATION Spec
PROPERTY MonotoneLog
