\* CausalHlcAtMake witness, at the main bound: the device reads the oldest clock in its pulled copy as the clock it saw, so its next clock can sit below one it pulled. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- MainScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {2}
    Bug = "SeenLeast"
SPECIFICATION Spec
PROPERTY CausalHlcAtMake
