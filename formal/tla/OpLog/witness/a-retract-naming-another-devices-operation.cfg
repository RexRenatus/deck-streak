\* RetractOnlyOwn witness, at the edits bound: an undo may name another device's edit. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0", "f1"}
    Script <- EditsScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 0
    MaxLoss = 0
    Revocable = {}
    Bug = "RetractOther"
SPECIFICATION Spec
INVARIANT RetractOnlyOwn
