\* NoLostReview witness, at the main bound: the device drops the operation from its queue when it sends it. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- MainScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {2}
    Bug = "DropOnSend"
SPECIFICATION Spec
INVARIANT NoLostReview
