\* NoLostReview witness, at the main bound: the judge answers before the writer commits, so a server crash loses an answered review. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- MainScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {2}
    Bug = "AnswerBeforeCommit"
SPECIFICATION Spec
INVARIANT NoLostReview
