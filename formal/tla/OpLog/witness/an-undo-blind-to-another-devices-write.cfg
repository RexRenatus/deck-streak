\* UndoOwnOnly witness, at the edits bound: an undo restores the value its edit replaced, over another device's later write. No code at the merge-base runs this
\* protocol, so the defect is the design's recorded switch (SPEC-504).
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0", "f1"}
    Script <- EditsScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 0
    MaxLoss = 0
    Revocable = {}
    Bug = "UndoBlind"
SPECIFICATION Spec
INVARIANT UndoOwnOnly
