\* Edits and undo at the note's bound: 2 devices, 1 note with 2 fields, values {a, b, c}. Device 1
\* edits f0 with a, then undoes that edit; device 2 edits f0 with b and f1 with c (inside the bound
\* of at most 3 edits and 1 undo each), MaxHlc 4.
\* @phx bound MaxHlc=4 MaxCrash=0 MaxServerCrash=0 MaxLoss=0
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0", "f1"}
    Script <- EditsScript
    MaxHlc = 4
    MaxCrash = 0
    MaxServerCrash = 0
    MaxLoss = 0
    Revocable = {}
    Bug = "none"
SPECIFICATION Spec
INVARIANT UndoOwnOnly FieldConverges NoSilentOverwrite RetractOnlyOwn LocalIsPrefix
PROPERTY MonotoneLog
