\* A report configuration (one more actor than the main bound): 3 devices, 1 operation each (a
\* review on device 1, an edit of f0 on devices 2 and 3), 1 server crash, MaxHlc 3; no token is revoked.
\* @phx bound MaxHlc=3 MaxCrash=0 MaxServerCrash=1 MaxLoss=0
CONSTANTS
    Devices = {1, 2, 3}
    Fields = {"f0"}
    Script <- ThreeScript
    MaxHlc = 3
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {}
    Bug = "none"
SPECIFICATION Spec
INVARIANT NoLostReview ExactlyOnce NoSkip CanonicalCardFold NoSilentOverwrite FieldConverges CausalHlc RetractOnlyOwn LocalIsPrefix
PROPERTY MonotoneLog RebootstrapKeepsPending
