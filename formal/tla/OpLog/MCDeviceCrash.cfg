\* The device crash at the main bound: MCOpLog's constants with one crash per device (MaxCrash 1).
\* A device crash loses the answers it had not read; its queue, cursor, pulled copy and clock are
\* durable, so no review is lost, none is applied twice, and its next clock stays past what it pulled.
\* @phx bound MaxHlc=4 MaxCrash=1 MaxServerCrash=1 MaxLoss=0
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- MainScript
    MaxHlc = 4
    MaxCrash = 1
    MaxServerCrash = 1
    MaxLoss = 0
    Revocable = {2}
    Bug = "none"
SPECIFICATION Spec
INVARIANT NoLostReview ExactlyOnce
PROPERTY CausalHlcAtMake
