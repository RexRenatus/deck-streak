\* Convergence under the fairness in Spec: 2 devices, 1 operation each (a review on device 1, an
\* edit of f0 on device 2), at most one lost answer per operation (MaxLoss 1), 1 server crash.
\* @phx bound MaxHlc=2 MaxCrash=0 MaxServerCrash=1 MaxLoss=1
CONSTANTS
    Devices = {1, 2}
    Fields = {"f0"}
    Script <- LiveScript
    MaxHlc = 2
    MaxCrash = 0
    MaxServerCrash = 1
    MaxLoss = 1
    Revocable = {2}
    Bug = "none"
SPECIFICATION Spec
PROPERTY Convergence
