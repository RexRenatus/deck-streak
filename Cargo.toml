# A virtual manifest: one crate per bounded context (docs/CONTEXT-MAP.md). The crate graph IS
# the context map, so a dependency the map does not declare is a design question, not a fix.
[workspace]
members = ["crates/*"]
# A virtual workspace has no edition to infer the resolver from, so it is set explicitly.
resolver = "3"

# Metadata every member inherits with `key.workspace = true`.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/RexRenatus/deck-streak"
publish = false

# Build profile (SPEC-125, ADR-125). Workspace crates keep line tables, which is what a panic
# backtrace needs to name a file and line; dependencies keep no debuginfo. The `test` profile
# inherits `dev`, so both apply to `cargo test` too.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# One home for every version. External crates are added here by the delivery whose ADR admits
# them (docs/decisions); a member writes `name.workspace = true`.
[workspace.dependencies]
deck-streak-kernel = { path = "crates/kernel" }
deck-streak-ingest = { path = "crates/ingest" }
deck-streak-identity = { path = "crates/identity" }
deck-streak-analytics = { path = "crates/analytics" }
deck-streak-progression = { path = "crates/progression" }
deck-streak-streaks = { path = "crates/streaks" }
deck-streak-curriculum = { path = "crates/curriculum" }
deck-streak-economy = { path = "crates/economy" }
deck-streak-quests = { path = "crates/quests" }
deck-streak-habits = { path = "crates/habits" }
deck-streak-focus = { path = "crates/focus" }
deck-streak-discipline = { path = "crates/discipline" }
deck-streak-markets = { path = "crates/markets" }
deck-streak-notifications = { path = "crates/notifications" }
deck-streak-readings = { path = "crates/readings" }
deck-streak-vault = { path = "crates/vault" }
deck-streak-agent = { path = "crates/agent" }
deck-streak-insights = { path = "crates/insights" }
deck-streak-publishing = { path = "crates/publishing" }
deck-streak-privacy = { path = "crates/privacy" }
deck-streak-coordination = { path = "crates/coordination" }
deck-streak-api = { path = "crates/api" }
deck-streak-bot = { path = "crates/bot" }
deck-streak-daemon = { path = "crates/daemon" }
# ADR-029: the parity oracle's golden reader. So far only a proving crate's dev-dependencies name
# them; later ADRs cite ADR-029 rather than admitting them again.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ADR-003: the backend stack, admitted by the kernel (SPEC-020). sqlx carries exactly the features
# the kernel's repository base needs; a member adds tokio's features as it uses them.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = "~1.53"
thiserror = "2.0.21"
tracing = "0.1.44"
# ADR-046: the anchor normaliser and the word counter (SPEC-046 R6, R9). html-escape decodes the
# entities, unicode-normalization folds to NFKC, unicode-segmentation counts the words.
html-escape = "0.2.15"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter"] }
# ADR-020: a temporary database or collection, in tests only.
tempfile = "3.27.0"
# ADR-293: the agent's source pins read Rust as tokens (SPEC-043 R12b, R16b): proc-macro2's lexer
# and syn's literal values, both already in the lock through the workspace's derive and query
# macros, with no default feature. In tests only.
proc-macro2 = { version = "1.0.107", default-features = false }
syn = { version = "2.0.119", default-features = false }
# ADR-003 and ADR-025: the API service (SPEC-025). axum carries only what a loopback HTTP/1.1
# service behind Caddy needs; tower brings the concurrency bound, the load shed and, for tests,
# `ServiceExt::oneshot`; tower-http brings the layers ADR-003 names. A member adds features as it
# uses them. anyhow is the binary's error type alone.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "matched-path"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
anyhow = "1.0.104"
# ADR-022 (SPEC-022): Anki's own Rust engine, for ingest only, pinned to an upstream release tag,
# with the TLS backend Anki's own Linux build selects. SPEC-055 moved it from 26.05 to 26.09.3, and
# the `[patch]` entry below replaces the tag with a commit of the maintainer's fork (ADR-058). An
# Anki upgrade is a deliberate delivery that re-runs ADR-022's measurement.
anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3", features = ["rustls"] }
# SPEC-022 section 7: the zstd the engine already brings, for the census's tests to read the
# engine's compressed request bodies.
zstd = "0.13.3"
# ADR-006 and ADR-024: Telegram's launch data and the owner's sessions (SPEC-024). RustCrypto's
# hmac and sha2 of one digest generation (hmac 0.13 needs sha2 0.11), subtle for the session
# store's constant-time compare, and getrandom for the session ids.
hmac = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
getrandom = "0.4.3"
# ADR-003 and ADR-026: the Bot API client (SPEC-026), with its async client over reqwest. That
# client brings reqwest's rustls stack; the bot reaches reqwest only through frankenstein's own
# re-export, for the one upload frankenstein reads from a file path (ADR-026, "Decided at delivery").
frankenstein = { version = "0.52.1", default-features = false, features = ["client-reqwest"] }
# ADR-040 (SPEC-040 A6): the compile-fail harness that proves an XP amount cannot be built from a
# signed integer. A dev-dependency only; no production dependency of any context changes.
trybuild = "1.0.121"

# ADR-058 (#233): the engine's upstream tag above, replaced by a commit of the maintainer's fork that
# is that tag plus one fix, so the engine's protobuf build script stops rerunning on every cargo
# command (#228). Pinned by `rev`, never by branch, and tagged on the fork. Cargo reads patches from
# the root manifest only. The entry goes when an upstream release carries the fix.
[patch."https://github.com/ankitects/anki.git"]
anki = { git = "https://github.com/RexRenatus/anki.git", rev = "57382da085e6752738dc4bb617789be836a23300" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# A group sits at priority -1, so a single lint below it can override it (rs.lint-group-priority).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints are cherry-picked; the whole restriction group is never enabled.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
# Pedantic lints this workspace allows, each for a reason.
# A context's types are named for the context (readings::ReadingNote): the repetition is the
# ubiquitous language, not noise.
module_name_repetitions = "allow"
