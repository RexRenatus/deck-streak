# A virtual manifest: one crate per bounded context (docs/CONTEXT-MAP.md). The crate graph IS
# the context map, so a dependency the map does not declare is a design question, not a fix.
[workspace]
members = ["crates/*"]
# A virtual workspace has no edition to infer the resolver from, so it is set explicitly.
resolver = "3"

# Metadata every member inherits with `key.workspace = true`.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/RexRenatus/deck-streak"
publish = false

# Build profile (SPEC-125, ADR-125). Workspace crates keep line tables, which is what a panic
# backtrace needs to name a file and line; dependencies keep no debuginfo. The `test` profile
# inherits `dev`, so both apply to `cargo test` too.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# One home for every version. External crates are added here by the delivery whose ADR admits
# them (docs/decisions); a member writes `name.workspace = true`.
[workspace.dependencies]
deck-streak-kernel = { path = "crates/kernel" }
deck-streak-ingest = { path = "crates/ingest" }
deck-streak-identity = { path = "crates/identity" }
deck-streak-analytics = { path = "crates/analytics" }
deck-streak-progression = { path = "crates/progression" }
deck-streak-streaks = { path = "crates/streaks" }
deck-streak-curriculum = { path = "crates/curriculum" }
deck-streak-economy = { path = "crates/economy" }
deck-streak-quests = { path = "crates/quests" }
deck-streak-habits = { path = "crates/habits" }
deck-streak-focus = { path = "crates/focus" }
deck-streak-discipline = { path = "crates/discipline" }
deck-streak-markets = { path = "crates/markets" }
deck-streak-notifications = { path = "crates/notifications" }
deck-streak-readings = { path = "crates/readings" }
deck-streak-vault = { path = "crates/vault" }
deck-streak-agent = { path = "crates/agent" }
deck-streak-insights = { path = "crates/insights" }
deck-streak-publishing = { path = "crates/publishing" }
deck-streak-privacy = { path = "crates/privacy" }
deck-streak-coordination = { path = "crates/coordination" }
deck-streak-api = { path = "crates/api" }
deck-streak-bot = { path = "crates/bot" }
deck-streak-mcp = { path = "crates/mcp" }
deck-streak-daemon = { path = "crates/daemon" }
deck-streak-ffi = { path = "crates/ffi" }
deck-streak-engine-core = { path = "crates/engine-core" }
deck-streak-xp = { path = "crates/xp" }
# ADR-029: the parity oracle's golden reader. So far only a proving crate's dev-dependencies name
# them; later ADRs cite ADR-029 rather than admitting them again.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ADR-003: the backend stack, admitted by the kernel (SPEC-020). sqlx carries exactly the features
# the kernel's repository base needs; a member adds tokio's features as it uses them.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = "~1.53"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter"] }
# ADR-020: a temporary database or collection, in tests only.
tempfile = "3.27.0"
# ADR-293: the agent's source pins read Rust as tokens (SPEC-043 R12b, R16b): proc-macro2's lexer
# and syn's literal values, both already in the lock through the workspace's derive and query
# macros, with no default feature. In tests only.
proc-macro2 = { version = "1.0.107", default-features = false }
syn = { version = "2.0.119", default-features = false }
# ADR-003 and ADR-025: the API service (SPEC-025). axum carries only what a loopback HTTP/1.1
# service behind Caddy needs; tower brings the concurrency bound, the load shed and, for tests,
# `ServiceExt::oneshot`; tower-http brings the layers ADR-003 names. A member adds features as it
# uses them. anyhow is the binary's error type alone.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "matched-path"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
anyhow = "1.0.104"
# ADR-119 and ADR-329: the official Rust MCP SDK for the MCP adapter's server (SPEC-119 R2): its
# server, its tool macros and its streamable HTTP server transport, and nothing else.
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
# ADR-022 (SPEC-022): Anki's own Rust engine, for ingest only, pinned to an upstream release tag,
# with the TLS backend Anki's own Linux build selects. SPEC-055 moved it from 26.05 to 26.09.3, and
# the `[patch]` entry below replaces the tag with a commit of the maintainer's fork (ADR-058). An
# Anki upgrade is a deliberate delivery that re-runs ADR-022's measurement.
anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3", features = ["rustls"] }
# ADR-348 (SPEC-338): the engine's protobuf messages, from the same tag and the same fork commit as
# the engine, for the web engine's study calls on wasm32.
anki_proto = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3" }
prost = "0.13.5"
# ADR-358 D4: the URL parser the engine's own dependencies already bring, for the engine core's
# endpoint guard on the sync login (SPEC-347 R2).
url = "2.5.8"
# ADR-359 D1: the encoder for the `data:` URLs the engine core writes a face's media into
# (SPEC-348 R3), at the version the engine's own HTTP client already resolves, so it adds no package.
base64 = "0.22.1"
# SPEC-022 section 7: the zstd the engine already brings, for the census's tests to read the
# engine's compressed request bodies.
zstd = "0.13.3"
# ADR-006 and ADR-024: Telegram's launch data and the owner's sessions (SPEC-024). RustCrypto's
# hmac and sha2 of one digest generation (hmac 0.13 needs sha2 0.11), subtle for the session
# store's constant-time compare, and getrandom for the session ids.
hmac = "0.13.0"
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
getrandom = "0.4.3"
# ADR-370 (SPEC-359): passkeys on the web. webauthn-rs runs the relying party's ceremonies and its
# ceremony state stays in memory, never serialized; uuid's random ids are the passkeys' user handle.
webauthn-rs = "0.5.5"
uuid = { version = "1.26.1", features = ["v4"] }
# ADR-003 and ADR-026: the Bot API client (SPEC-026), with its async client over reqwest. That
# client brings reqwest's rustls stack; the bot reaches reqwest only through frankenstein's own
# re-export, for the one upload frankenstein reads from a file path (ADR-026, "Decided at delivery").
frankenstein = { version = "0.52.1", default-features = false, features = ["client-reqwest"] }
# ADR-348 (SPEC-338): the web engine's wasm32-only crates. wasm-bindgen is pinned exactly, because
# its CLI must match the crate's version; sqlite-wasm-rs is the SQLite the engine's rusqlite links
# on wasm32, and sqlite-wasm-vfs its OPFS SyncAccessHandle pool.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
sqlite-wasm-rs = "0.5.5"
sqlite-wasm-vfs = "0.2.0"
# ADR-040 (SPEC-040 A6): the compile-fail harness that proves an XP amount cannot be built from a
# signed integer. A dev-dependency only; no production dependency of any context changes.
trybuild = "1.0.121"
# ADR-345 D2 (SPEC-336): UniFFI, the bindings generator behind the FFI adapter's one entry point,
# pinned exactly to the last release whose generated Swift modulemap names no builtin clang module,
# the lines that break a simulator XCFramework's consumers (ADR-345 records the measurement).
# Default features off: the adapter's `bindgen` feature turns the generator on for the XCFramework
# workflow alone.
uniffi = { version = "=0.29.1", default-features = false }
# ADR-338 and ADR-353 D1: the upstream scheduler's FSRS-7, for the isolated scheduler crate alone,
# taken from fsrs-rs at one full commit of its main branch, never a branch name or a short id. The
# released crate carries no FSRS-7, and this package shares its name, so cargo tells the two apart
# by source. A re-pin is a deliberate delivery.
fsrs7 = { package = "fsrs", git = "https://github.com/open-spaced-repetition/fsrs-rs.git", rev = "4bc0a0979f95dd01cc653031b6f2a01429e4c32b" }
# ADR-338 and ADR-353 D5: the released scheduler the engine already locks, pinned exactly to the
# engine's own, so the scheduler crate's coexistence test links both packages into one binary. A
# dev-dependency only; nothing in production names it.
fsrs6 = { package = "fsrs", version = "=6.6.2" }
# ADR-354 D1, D2 and D5 (SPEC-343): the push senders' client and tokens. hyper's pooled client,
# HTTP/2 for APNs, over hyper-rustls on the rustls the workspace already locks, with the platform
# verifier and the aws-lc-rs provider the bot's client resolves; a bounded body read; P-256 ECDSA
# for the provider and VAPID tokens; RFC 8291's encryption from web-push-native, its own `vapid`
# feature off; base64url for the tokens. In tests only: hkdf and aes-gcm for the push service
# fake's own RFC 8291 decryption, beside sha2 above.
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
rustls = { version = "0.23.45", default-features = false }
http-body-util = "0.1.5"
p256 = "0.13.2"
web-push-native = { version = "0.5.0", default-features = false }
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
aes-gcm = "0.10.3"

# ADR-058 (#233): the engine's upstream tag above, replaced by a commit of the maintainer's fork that
# is that tag plus one fix, so the engine's protobuf build script stops rerunning on every cargo
# command (#228). Pinned by `rev`, never by branch, and tagged on the fork. Cargo reads patches from
# the root manifest only. The entry goes when an upstream release carries the fix. ADR-348 (SPEC-338)
# moved the rev to the fork's tag `deckstreak-pin-26.09.3-wasm32`: that fix plus one commit per
# wasm32 patch, and `anki_proto` from the same commit, so the web engine and ingest share one engine.
# SPEC-364 moved it to the fork's tag `deckstreak-pin-26.09.3-wasm32-sync`: that commit plus the
# browser's sync transport and its two companion wasm32 patches, one commit each (ADR-058's note).
# SPEC-377 moved it to the fork's tag `deckstreak-pin-26.09.3-wasm32-full-sync`: that commit plus
# the browser's full sync files patch, one commit (ADR-058's note).
[patch."https://github.com/ankitects/anki.git"]
anki = { git = "https://github.com/RexRenatus/anki.git", rev = "bd4fe2f4e9aa6e37434678e7770e6934b6071fcb" }
anki_proto = { git = "https://github.com/RexRenatus/anki.git", rev = "bd4fe2f4e9aa6e37434678e7770e6934b6071fcb" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# A group sits at priority -1, so a single lint below it can override it (rs.lint-group-priority).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints are cherry-picked; the whole restriction group is never enabled.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
# Pedantic lints this workspace allows, each for a reason.
# A context's types are named for the context (readings::ReadingNote): the repetition is the
# ubiquitous language, not noise.
module_name_repetitions = "allow"
