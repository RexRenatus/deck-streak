# cargo-deny: RustSec advisories, licences, bans and sources (the web-security pack's
# ws.dep-audit-config; run by scripts/check.sh's audit-rust stage and by CI's rust job).

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database is an error; an exception names its advisory id and why.
# The six below are "unmaintained" notices (none is a vulnerability) on crates that reach this
# workspace only through Anki's engine (ADR-022): the unic crates under its unic-ucd-category, and
# rustls-pemfile. Each was re-read at 26.09.3 (SPEC-055). An engine upgrade re-reads every one of
# them, and scripts/tests/test_engine_pin.py refuses an exception cargo deny no longer encounters.
# The seventh, paste, is the same kind of notice on a direct dependency of frankenstein, the Bot API
# client (SPEC-026, ADR-026); a frankenstein upgrade re-reads it.
ignore = [
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, not vulnerable; the engine's unic-ucd-category (ADR-022)" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: unmaintained, not vulnerable; the engine's unic-ucd-category (ADR-022)" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: unmaintained, not vulnerable; the engine's unic-ucd-category (ADR-022)" },
    { id = "RUSTSEC-2025-0094", reason = "unic-ucd-category: unmaintained, not vulnerable; a direct dependency of the engine (ADR-022)" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: unmaintained, not vulnerable; the engine's unic-ucd-category (ADR-022)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, not vulnerable; a direct dependency of the engine (ADR-022)" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; a direct dependency of frankenstein, the Bot API client (SPEC-026)" },
]

[licenses]
# Licences compatible with shipping inside an AGPL-3.0-or-later work.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# frankenstein, the Bot API client (ADR-003, SPEC-026), is WTFPL: a permissive licence compatible with
# the GNU GPL. It is admitted for that crate alone, never for the workspace (ADR-026).
exceptions = [
    { allow = ["WTFPL"], crate = "frankenstein" },
]

[licenses.private]
# The workspace's own crates are unpublished; their licence is the repository's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ADR-022 and ADR-058: the maintainer's fork of Anki, whose commit the root manifest's `[patch]`
# entry puts in place of the upstream tag the engine names, and the one fork the engine's own
# manifest pins by revision (ankitects/rust-url, for percent-encoding-iri). ADR-338 and ADR-353 add
# a third, fsrs-rs, below; nothing else. While the patch holds no crate comes from Anki's own
# repository, so it is not allowed: an unpatched engine is refused by name.
allow-git = [
    "https://github.com/RexRenatus/anki.git",
    "https://github.com/ankitects/rust-url.git",
    # ADR-338, ADR-353 D1: the upstream scheduler's development line, the only source of FSRS-7,
    # pinned by a full revision in [workspace.dependencies] and used by deck-streak-fsrs7 alone. The
    # engine keeps the released crate from the registry.
    "https://github.com/open-spaced-repetition/fsrs-rs.git",
]
