# Lint levels for a DeckStreak-shaped workspace (skills/packs/rust-service). Put these tables in
# the ROOT Cargo.toml, beside greenfield's workspace template.
#
# [workspace.lints] is NOT inherited implicitly: every member's Cargo.toml needs
#
#     [lints]
#     workspace = true
#
# or it gets none of this (rs.lints-inherited; Cargo's own missing_lints_inheritance lint).

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# A group sits at priority -1, so a single lint below it can override it. At the same priority
# Cargo orders them by name and the later one wins (rs.lint-group-priority).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints are cherry-picked; the whole restriction group is never enabled.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
# Pedantic lints this workspace allows, each for a reason.
module_name_repetitions = "allow"
