# Litestream 0.5 keeps snapshots for the GLOBAL snapshot.retention; a retention under a replica is
# ignored. An erased row can stay in the replica for interval + retention, so declare a backups
# window in privacy.json that covers both, and say so in the privacy policy.
snapshot:
  interval: 1h
  retention: 24h

dbs:
  - path: /var/lib/deckstreak/deckstreak.db
    replica:
      url: ${REPLICA_URL}
