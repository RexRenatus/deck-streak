name: release

# A release is published from a SemVer tag, and only from one. The tag must be on main.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@{{CHECKOUT_ACTION_SHA}}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: the tag is the version the workspace declares
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$TAG"
      - name: build once; this artifact is the one every deploy of the tag installs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo build --release --locked
          tar -czf "app-$TAG.tar.gz" -C target/release app
          sha256sum "app-$TAG.tar.gz" > "app-$TAG.tar.gz.sha256"
      - name: draft, attach, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" "app-$TAG.tar.gz" "app-$TAG.tar.gz.sha256"
          gh release edit "$TAG" --draft=false
