name: changelog

# A pull request adds a fragment under changelog.d/, or it is the release pull request that
# compiles them into CHANGELOG.md. Its job, `fragment`, is a required check on main.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@{{CHECKOUT_ACTION_SHA}}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a fragment is added, or CHANGELOG.md is compiled
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD -- CHANGELOG.md | grep -q .; then exit 0; fi
          if git diff --name-only --diff-filter=A "$BASE" HEAD -- changelog.d/ | grep -v README.md | grep -q .; then exit 0; fi
          echo "Add a fragment under changelog.d/ (see changelog.d/README.md)."
          exit 1
