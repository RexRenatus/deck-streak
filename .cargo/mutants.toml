# cargo-mutants 27.1.0 (SPEC-039 R5 to R7, ADR-057). The pull request's `mutation-rust` job and the
# weekly battery run it in place, on a committed tree, and a local run is targeted the same way:
#
#   cargo mutants --in-place -f crates/<crate>/src/<file>.rs    then cargo clean
#
# `--in-place` runs one mutant at a time, the rule's `-j 1`, and refuses a `-j` flag beside it
# (exit 1, measured on 27.1.0).
#
# Each exclusion names one mutant, as an anchored `exclude_re` entry, with
# `# EQUIVALENT: <why no test can tell it apart> (#N)` on the line above it. A test refuses any other
# form, and any `mutants::skip` attribute (scripts/tests/test_mutation_workflows.py). One mutant
# is excluded, an equivalent SPEC-071 records (its section 10); SPEC-057 replaces this form, and its
# delivery converts the entry.
exclude_re = [
    # EQUIVALENT: only a card younger than MATURE_IVL_DAYS reaches this test, so <= admits no other card (#295)
    '^crates/analytics/src/snapshot\.rs:75:58: replace < with <= in card_snapshot$',
]

# Each mutant's tests run under cargo-nextest, the gate's own runner, a process per test. Under
# cargo test, one process per binary, identity's log test failed the unmutated baseline on two of
# thirty-two CI runners, so cargo-mutants refused the shard (exit 4, SPEC-039 section 8).
test_tool = "nextest"
